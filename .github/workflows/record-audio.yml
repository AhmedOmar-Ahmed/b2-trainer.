name: Record natural voice audio

on:
  push:
    branches: [main]
    paths: ["index.html", "tools/**", ".github/workflows/record-audio.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-audio
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always start from the newest recordings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - name: Record and publish in batches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 40); do
            set +e; python tools/make_audio.py; code=$?; set -e
            git add -A audio
            if ! git diff --cached --quiet; then
              git commit -q -m "Record natural voice audio (batch $i) [skip ci]"
              git pull -q --rebase origin main
              git push -q
            fi
            if [ "$code" -eq 0 ]; then echo "All recordings done."; break; fi
            if [ "$code" -ne 3 ]; then exit "$code"; fi
          done
