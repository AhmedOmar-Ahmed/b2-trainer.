hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach hat eine Schuluniform mehr Vorteile als Nachteile.", "In my opinion, a school uniform has more advantages than disadvantages."], ["Ich denke, dass Schüler sich dann mehr auf den Unterricht konzentrieren als auf ihre Kleidung.", "I think students would then concentrate more on lessons than on their clothes."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile der Schuluniform", "Advantages of school uniforms", [["Einerseits sehen alle Schüler gleich aus, und niemand wird wegen seiner Kleidung ausgelacht.", "On the one hand, all students look the same, and nobody is laughed at because of their clothes."], ["Außerdem können Kinder aus ärmeren Familien besser integriert werden.", "In addition, children from poorer families can be better integrated."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile der Schuluniform", "Disadvantages of school uniforms", [["Andererseits können die Schüler ihre Persönlichkeit dann weniger durch Kleidung zeigen.", "On the other hand, students can then express their personality less through their clothes."], ["Zudem muss die Uniform bezahlt werden, und das kann für manche Familien teuer sein.", "Moreover, the uniform has to be paid for, and that can be expensive for some families."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Markendruck und Ausgrenzung", "Brand pressure and exclusion", [["Ein weiterer wichtiger Punkt ist der Druck, teure Marken zu tragen.", "Another important point is the pressure to wear expensive brands."], ["Dieser Druck ist für viele Jugendliche sehr hoch und kann sogar zu Mobbing führen.", "This pressure is very high for many young people and can even lead to bullying."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Konflikte lösen", "Solving conflicts", [["Was Konflikte zwischen Schülern betrifft, bin ich der Meinung, dass eine Uniform allein sie nicht lösen kann.", "As far as conflicts between students are concerned, I believe a uniform alone cannot solve them."], ["Probleme müssen offen besprochen und gemeinsam gelöst werden.", "Problems have to be discussed openly and solved together."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Schuluniformen in meinem Heimatland", "School uniforms in my home country", [["In meinem Heimatland tragen viele Schüler eine Schuluniform, und das ist ganz normal.", "In my home country, many students wear a school uniform, and that is completely normal."], ["Ich finde, dass dadurch morgens viel Zeit und Stress gespart wird.", "I think it saves a lot of time and stress in the morning."], ["Wie ist das in deinem Heimatland?", "How is it in your home country?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass Kleidung für Jugendliche sehr wichtig ist.", "From my own experience, I can say that clothes are very important for young people."], ["Ich erinnere mich, dass manche Mitschüler wegen ihrer Kleidung ausgelacht wurden.", "I remember that some classmates were laughed at because of their clothes."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Ich würde vorschlagen, dass die Schüler beim Design der Uniform mitbestimmen dürfen.", "I would suggest that students be allowed to have a say in the design of the uniform."], ["Außerdem sollte die Schule Familien mit wenig Geld finanziell unterstützen.", "In addition, the school should support families with little money financially."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Schuluniformen viele Vorteile haben, aber nicht alle Probleme lösen.", "In summary, school uniforms have many advantages but don't solve all problems."], ["Ich bin davon überzeugt, dass Respekt und Toleranz vor allem im Gespräch gelernt werden.", "I am convinced that respect and tolerance are learned above all through conversation."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "handy", "title": "Kinder unterschätzen Gefahren von Handy und Internet", "en": "Children underestimate the dangers of mobile phones and the internet", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um eine Befragung der EU-Kommission zur Handy- und Internetnutzung von Kindern und Jugendlichen.", "The text is about an EU Commission survey on mobile phone and internet use by children and young people."], ["Das Ergebnis zeigt, dass die jungen Nutzer selbstbewusst mit den neuen Medien umgehen, aber die Gefahren unterschätzen.", "The result shows that young users handle the new media confidently but underestimate the dangers."], ["Bei Problemen würden die meisten Kinder ihre Eltern nur als letzten Ausweg um Hilfe bitten.", "If they have problems, most children would only ask their parents for help as a last resort."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach sind Handy und Internet für Kinder sowohl nützlich als auch gefährlich.", "In my opinion, mobile phones and the internet are both useful and dangerous for children."], ["Ich denke, dass Kinder nicht zu früh ein eigenes Smartphone bekommen sollten.", "I think children shouldn't get their own smartphone too early."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile von Handy und Internet", "Advantages of phones and the internet", [["Einerseits können Kinder im Internet viel lernen und schnell Informationen finden.", "On the one hand, children can learn a lot on the internet and find information quickly."], ["Außerdem können die Eltern ihr Kind jederzeit anrufen, was ein Gefühl von Sicherheit gibt.", "In addition, parents can call their child at any time, which gives a feeling of security."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Gefahren", "Dangers", [["Andererseits können Kinder im Internet leicht Gewaltvideos oder ungeeignete Inhalte finden.", "On the other hand, children can easily find violent videos or unsuitable content on the internet."], ["Außerdem kommen Beleidigungen, Drohungen und Cybermobbing immer häufiger vor.", "In addition, insults, threats and cyberbullying are becoming more and more common."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Fotos und Privatsphäre", "Photos and privacy", [["Ein weiterer wichtiger Punkt sind Fotos.", "Another important point is photos."], ["Viele Jugendliche teilen private Bilder, ohne an die Folgen zu denken.", "Many young people share private pictures without thinking about the consequences."], ["Was einmal im Internet ist, kann man kaum wieder löschen.", "Once something is on the internet, it can hardly be deleted."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Verantwortung der Eltern", "Parents' responsibility", [["Was die Eltern betrifft, bin ich der Meinung, dass sie mit ihren Kindern offen über die Risiken sprechen sollten.", "As far as the parents are concerned, I believe they should talk openly with their children about the risks."], ["Die Kinder sollten wissen, dass sie bei Problemen immer zu ihren Eltern kommen können.", "Children should know that they can always come to their parents with problems."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Rolle der Schule", "Role of the school", [["Ich halte es für besonders wichtig, dass Medienkompetenz in der Schule unterrichtet wird.", "I think it is especially important that media literacy is taught at school."], ["Zum Beispiel könnten Schüler lernen, wie man sichere Passwörter benutzt und gefälschte Nachrichten erkennt.", "For example, students could learn how to use secure passwords and recognise fake news."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass schon sehr kleine Kinder heute ein Smartphone benutzen.", "From my own experience, I can say that even very young children use a smartphone today."], ["Ich sehe oft Kinder im Restaurant, die nur auf ihr Handy schauen, statt mit ihrer Familie zu sprechen.", "I often see children in restaurants who only look at their phone instead of talking to their family."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Ich würde vorschlagen, dass Eltern Kinderschutz-Apps nutzen und feste Handyzeiten vereinbaren.", "I would suggest that parents use child-protection apps and agree on fixed phone times."], ["Außerdem sollten die Eltern selbst ein gutes Vorbild sein und nicht ständig am Handy sein.", "In addition, parents should be a good role model themselves and not be on their phone all the time."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Handy und Internet zum Leben der Kinder gehören, aber auch Gefahren haben.", "In summary, phones and the internet are part of children's lives but also have dangers."], ["Ich bin davon überzeugt, dass Aufklärung und Vertrauen zwischen Eltern und Kindern der beste Schutz sind.", "I am convinced that education and trust between parents and children are the best protection."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "fernsehen", "title": "Fernsehen macht Kinder dumm", "en": "Television makes children stupid", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frage, welchen Einfluss das Fernsehen auf Kinder hat.", "The text is about what influence television has on children."], ["Neue Studien zeigen, dass Kinder, die viel fernsehen, später oft schlechtere Schulabschlüsse haben.", "New studies show that children who watch a lot of TV often have worse school qualifications later."], ["Außerdem kann zu viel Fernsehen der Gesundheit schaden, weil die Kinder sich zu wenig bewegen.", "In addition, too much television can harm health because children move too little."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach macht Fernsehen Kinder nicht automatisch dumm, aber zu viel Fernsehen ist schädlich.", "In my opinion, television doesn't automatically make children stupid, but too much television is harmful."], ["Ich denke, dass es vor allem darauf ankommt, was und wie lange die Kinder schauen.", "I think it mainly depends on what children watch and for how long."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile des Fernsehens", "Advantages of television", [["Einerseits gibt es viele gute Kindersendungen, mit denen Kinder etwas lernen können.", "On the one hand, there are many good children's programmes from which children can learn something."], ["Außerdem kann Fernsehen bei der Entspannung helfen und Kindern neue Länder und Kulturen zeigen.", "In addition, television can help children relax and show them new countries and cultures."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile des Fernsehens", "Disadvantages of television", [["Andererseits sitzen viele Kinder stundenlang vor dem Fernseher, statt draußen zu spielen.", "On the other hand, many children sit in front of the TV for hours instead of playing outside."], ["Das kann zu Übergewicht, Konzentrationsproblemen und schlechteren Noten führen.", "That can lead to being overweight, concentration problems and worse grades."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Fernseher im Kinderzimmer", "A TV in the child's bedroom", [["Ein weiterer wichtiger Punkt ist der Fernseher im Kinderzimmer.", "Another important point is the TV in the child's bedroom."], ["Laut den Studien haben Kinder mit eigenem Fernseher im Durchschnitt schlechtere Noten.", "According to the studies, children with their own TV have worse grades on average."], ["Deshalb finde ich, dass ein Fernseher nicht ins Kinderzimmer gehört.", "That's why I think a TV doesn't belong in a child's bedroom."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Verantwortung der Eltern", "Parents' responsibility", [["Was die Eltern betrifft, bin ich der Meinung, dass sie klare Regeln für die Fernsehzeit festlegen sollten.", "As far as the parents are concerned, I believe they should set clear rules for TV time."], ["Experten empfehlen höchstens eine Stunde pro Tag, und Hausaufgaben sollten nie vor dem Fernseher gemacht werden.", "Experts recommend at most one hour a day, and homework should never be done in front of the TV."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Schlaf und Lernen", "Sleep and learning", [["Ich halte es für sehr wichtig, dass Kinder vor dem Schlafengehen nicht fernsehen.", "I think it's very important that children don't watch TV before going to bed."], ["Die Bilder und Geräusche lenken ab, und das Gehirn kann sich den Lernstoff schlechter merken.", "The pictures and sounds are distracting, and the brain remembers the learning material less well."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass ich als Kind auch gern ferngesehen habe.", "From my own experience, I can say that I also liked watching TV as a child."], ["Meine Eltern haben aber darauf geachtet, dass ich zuerst meine Hausaufgaben mache und genug draußen spiele.", "But my parents made sure that I did my homework first and played outside enough."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Statt den Fernseher ganz zu verbieten, würde ich vorschlagen, gemeinsam mit den Kindern gute Sendungen auszuwählen.", "Instead of banning the TV completely, I would suggest choosing good programmes together with the children."], ["Außerdem sollten Eltern Alternativen anbieten, zum Beispiel Sport, Bücher oder Spiele mit der Familie.", "In addition, parents should offer alternatives, for example sport, books or family games."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Fernsehen in Maßen in Ordnung ist, aber zu viel Fernsehen schadet.", "In summary, television in moderation is fine, but too much television is harmful."], ["Ich bin davon überzeugt, dass die Eltern hier die wichtigste Rolle spielen.", "I am convinced that parents play the most important role here."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "ohneinternet", "title": "Eine Woche ohne Internet", "en": "A week without the internet", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text erzählt ein Autor von seinem Experiment, eine Woche lang ohne Internet zu leben.", "In the text, an author describes his experiment of living without the internet for a week."], ["Er konnte keine Informationen schnell nachschauen, nichts online bestellen und musste am Bahnhof lange für Fahrkarten anstehen.", "He couldn't quickly look up information, couldn't order anything online and had to queue for a long time at the station for tickets."], ["Am Ende stellt er fest, dass das Internet Menschen zusammenbringt und das Leben sehr erleichtert.", "In the end, he finds that the internet brings people together and makes life much easier."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach ist das Internet heute aus unserem Alltag nicht mehr wegzudenken.", "In my opinion, today it is impossible to imagine our everyday life without the internet."], ["Ich denke aber, dass eine kurze Pause ab und zu sehr guttun kann.", "But I think a short break now and then can do you a lot of good."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile des Internets", "Advantages of the internet", [["Einerseits spart das Internet viel Zeit, zum Beispiel beim Einkaufen, beim Kaufen von Fahrkarten oder bei Bankgeschäften.", "On the one hand, the internet saves a lot of time, for example when shopping, buying tickets or doing banking."], ["Außerdem kann man jederzeit mit Familie und Freunden in Kontakt bleiben, auch wenn sie weit weg wohnen.", "In addition, you can stay in contact with family and friends at any time, even if they live far away."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile des Internets", "Disadvantages of the internet", [["Andererseits verbringen viele Menschen zu viel Zeit online und haben weniger echte Kontakte.", "On the other hand, many people spend too much time online and have fewer real contacts."], ["Außerdem kann man durch die ständige Erreichbarkeit leicht in Stress geraten.", "In addition, being constantly reachable can easily cause stress."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Abhängigkeit vom Internet", "Dependence on the internet", [["Ein weiterer wichtiger Punkt ist, dass wir sehr abhängig vom Internet geworden sind.", "Another important point is that we have become very dependent on the internet."], ["Viele Menschen wissen gar nicht mehr, wie man eine Karte liest oder ohne Handy eine Adresse findet.", "Many people no longer know how to read a map or find an address without a phone."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Kinder und das Internet", "Children and the internet", [["Was die Kinder betrifft, bin ich der Meinung, dass sie lernen sollten, auch ohne Internet Antworten zu finden.", "As far as children are concerned, I believe they should learn to find answers without the internet too."], ["Zum Beispiel können sie Bücher lesen oder ihre Eltern und Lehrer fragen.", "For example, they can read books or ask their parents and teachers."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Eine digitale Pause", "A digital break", [["Ich halte es für sinnvoll, ab und zu eine digitale Pause zu machen, zum Beispiel am Wochenende oder im Urlaub.", "I think it makes sense to take a digital break now and then, for example at the weekend or on holiday."], ["So hat man mehr Zeit für Gespräche, Bewegung und Hobbys.", "That way you have more time for conversations, exercise and hobbies."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass mir das Internet in Deutschland sehr geholfen hat.", "From my own experience, I can say that the internet has helped me a lot in Germany."], ["Ich lerne online Deutsch, finde Wege mit dem Navi und telefoniere per Video mit meiner Familie im Heimatland.", "I learn German online, find my way with navigation and make video calls with my family in my home country."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Ich würde vorschlagen, feste Zeiten ohne Handy einzuführen, zum Beispiel beim Essen oder vor dem Schlafengehen.", "I would suggest introducing fixed phone-free times, for example during meals or before going to bed."], ["Außerdem kann man Benachrichtigungen ausschalten, damit man nicht ständig abgelenkt wird.", "In addition, you can turn off notifications so that you aren't constantly distracted."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass das Internet unser Leben sehr erleichtert, aber man es bewusst nutzen sollte.", "In summary, the internet makes our lives much easier, but it should be used consciously."], ["Ich bin davon überzeugt, dass eine gesunde Balance zwischen online und offline am besten ist.", "I am convinced that a healthy balance between online and offline is best."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}], "redemittel": [["Im Text geht es um …", "The text is about …"], ["Meiner Meinung nach …", "In my opinion …"], ["Ich bin der Ansicht, dass …", "I am of the view that …"], ["Einerseits … andererseits …", "On the one hand … on the other hand …"], ["Ein weiterer wichtiger Punkt ist …", "Another important point is …"], ["Was … betrifft, …", "As far as … is concerned, …"], ["Ich halte es für wichtig, dass …", "I consider it important that …"], ["Aus meiner eigenen Erfahrung …", "From my own experience …"], ["Ich würde vorschlagen, dass …", "I would suggest that …"], ["Zusammenfassend lässt sich sagen …", "In summary, one can say …"], ["Da stimme ich dir zu.", "I agree with you on that."], ["Da bin ich anderer Meinung.", "I see that differently."], ["Das ist ein guter Punkt, aber …", "That's a good point, but …"], ["Könntest du das genauer erklären?", "Could you explain that more precisely?"]]}

/* ===================== HELPERS ===================== */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WORD_RE = /[A-Za-zÄÖÜäöüß]+(?:-[A-Za-zÄÖÜäöüß]+)*/g;
const isQ = s => s.trim().endsWith("?");

function lookup(word){
  const w = word.toLowerCase();
  if (DICT[w]) return DICT[w];
  for (const suf of ["en","em","er","es","e","n","s"]) {
    if (w.endsWith(suf) && DICT[w.slice(0,-suf.length)]) return DICT[w.slice(0,-suf.length)];
  }
  for (const add of ["e","en","n"]) { if (DICT[w+add]) return DICT[w+add]; }
  return null;
}

// Wrap words in spans; keep char offsets for speech highlighting
function wrap(text, ctx){
  let out = "", last = 0, m; WORD_RE.lastIndex = 0;
  while ((m = WORD_RE.exec(text))) {
    out += esc(text.slice(last, m.index));
    out += `<span class="w" data-s="${m.index}" data-e="${m.index+m[0].length}" data-ctx="${ctx}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

/* ===================== STATE ===================== */
let cur = 0, showEn = false;
let done = {};
try { done = JSON.parse(localStorage.getItem("b2done")||"{}"); } catch(e){}
function saveDone(){ try{ localStorage.setItem("b2done", JSON.stringify(done)); }catch(e){} }
const key = (t,i) => TOPICS[t].id + ":" + i;
function progress(t){ return TOPICS[t].sections.filter((_,i)=>done[key(t,i)]).length; }

/* ===================== RENDER ===================== */
function renderSide(){
  $("#topics").innerHTML = TOPICS.map((t,i)=>{
    const p = progress(i);
    return `<button class="topic-btn ${i===cur?'active':''}" onclick="go(${i})">
      <span class="t">${esc(t.title)}</span><span class="p">${p}/10 gelernt</span>
      <div class="bar"><i style="width:${p*10}%"></i></div></button>`;
  }).join("");
}
function renderMain(){
  const t = TOPICS[cur];
  let h = `<div class="eyebrow">Thema ${cur+1} von ${TOPICS.length} · Teil 2: Diskussion</div>
  <h1>${wrap(t.title, cur+"|t")}</h1><p class="h1-en">${esc(t.en)}</p>
  <div class="actions">
    <button class="btn primary" onclick="P.open(${cur},'lesson')">▶ Video-Lektion</button>
    <button class="btn" onclick="P.open(${cur},'shadow')">🗣️ Nachsprechen</button>
    <button class="btn" onclick="P.open(${cur},'exam')">🎤 Prüfungssimulation</button>
    <button class="btn ${showEn?'on':''}" onclick="toggleEn()">${showEn?'Englisch ausblenden':'Englisch anzeigen'}</button>
  </div>
  <div id="voiceBanner"></div>
  <div class="tip">Klicke auf ein Wort → englische Bedeutung. 🔊 neben jedem Satz liest ihn vor. Hake jeden Punkt ab, wenn sie ihn frei sprechen kann.</div>
  <div class="${showEn?'show-en':''}">`;
  t.sections.forEach(([head, headEn, sents], si)=>{
    const d = done[key(cur,si)];
    h += `<div class="section ${d?'done':''}">
      <div class="sec-head"><div class="num">${si+1}</div>
        <div class="sec-title">${wrap(head, cur+"|"+si+"|h")}<small>${esc(headEn)}</small></div>
        <button class="icon-btn" onclick="P.open(${cur},'lesson',${si})">▶ Video</button>
        <button class="icon-btn done-btn ${d?'is':''}" onclick="toggleDone(${si})">${d?'✓ Gelernt':'Gelernt?'}</button>
      </div>`;
    sents.forEach(([de,en], k)=>{
      h += `<p class="sent ${isQ(de)?'q':''}">${wrap(de, cur+"|"+si+"|"+k)} <button class="say" title="Vorlesen" onclick="sayOne(${si},${k})">🔊</button></p><p class="en">${esc(en)}</p>`;
    });
    h += `</div>`;
  });
  h += `</div><div class="redemittel"><h3>Redemittel für die Prüfung</h3><div class="rm-grid">` +
    REDEMITTEL.map(([d,e],i)=>`<div class="rm"><b>${wrap(d,"rm|"+i)}</b><span>${esc(e)}</span></div>`).join("") + `</div></div>`;
  $("#main").innerHTML = h;
  renderBanner();
}
function go(i){ cur=i; renderSide(); renderMain(); window.scrollTo(0,0); }
function toggleEn(){ showEn=!showEn; renderMain(); }
function toggleDone(si){ const k=key(cur,si); done[k]=!done[k]; saveDone(); renderSide(); renderMain(); }

/* ===================== WORD POPUP ===================== */
function ctxSentence(ctx){
  const p = ctx.split("|");
  if (p[0]==="rm") return REDEMITTEL[+p[1]][1];
  const t = TOPICS[+p[0]];
  if (p[1]==="t") return t.en;
  const sec = t.sections[+p[1]];
  if (p[2]==="h") return sec[1];
  return sec[2][+p[2]][1];
}
document.addEventListener("click", e=>{
  const w = e.target.closest(".w");
  if (!w) { if (!e.target.closest("#pop")) hidePop(); return; }
  e.stopPropagation();
  const word = w.textContent, g = lookup(word), pop = $("#pop");
  pop.querySelector(".pw").textContent = word;
  const pg = pop.querySelector(".pg");
  pg.textContent = g || "Nicht im Wörterbuch – siehe Satz unten oder Google Translate";
  pg.className = "pg" + (g ? "" : " none");
  const ctx = w.dataset.ctx;
  pop.querySelector(".ps").innerHTML = ctx ? "<b>Satz:</b> " + esc(ctxSentence(ctx)) : "";
  const q = encodeURIComponent(word);
  pop.querySelector(".prow").innerHTML =
    `<a href="#" onclick="speak(${JSON.stringify(word).replace(/"/g,'&quot;')});return false;">🔊 Aussprache</a>
     <a href="https://translate.google.com/?sl=de&tl=en&text=${q}" target="_blank" rel="noopener">Google Translate ↗</a>
     <a href="https://www.dict.cc/?s=${q}" target="_blank" rel="noopener">dict.cc ↗</a>`;
  pop.style.display = "block";
  const r = w.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = Math.min(Math.max(8, r.left), innerWidth - pw - 8);
  let y = r.bottom + 8; if (y + ph > innerHeight - 8) y = r.top - ph - 8;
  pop.style.left = x + "px"; pop.style.top = Math.max(8,y) + "px";
  if (P.playing) P.pause();
});
function hidePop(){ $("#pop").style.display = "none"; }

let voices = [], voice = null, rate = 1.0;
function loadVoices(){
  if (window.TIMINGS) {
    const sel = $("#voiceSel");
    sel.innerHTML = Object.keys(window.TIMINGS).map(v=>`<option value="${v}" ${v===recVoice?'selected':''}>${v[0].toUpperCase()+v.slice(1)} (natürlich)</option>`).join("");
    $("#vnote").innerHTML = "✓ Aufgenommene natürliche KI-Stimme – funktioniert auf jedem Gerät.";
    renderBanner(); return;
  }
  const all = speechSynthesis.getVoices();
  voices = all.filter(v => /^de/i.test(v.lang));
  voices.sort((a,b)=>score(b)-score(a));
  if (!voice || !voices.includes(voice) || (!isNatural(voice) && isNatural(voices[0]))) voice = voices[0] || null;
  const sel = $("#voiceSel");
  sel.innerHTML = voices.length ? voices.map((v,i)=>`<option value="${i}" ${v===voice?'selected':''}>${esc(v.name.replace(/Microsoft |Online |- German.*$/g,'').trim())}</option>`).join("")
                                : `<option>Keine deutsche Stimme</option>`;
  renderBanner();
  $("#vnote").innerHTML = voices.length && /natural|neural|online/i.test(voice.name)
    ? "✓ Natürliche KI-Stimme aktiv: " + esc(voice.name)
    : "Hinweis: Für eine natürliche KI-Stimme öffne diese Seite in <b>Microsoft Edge</b> (Stimmen „Katja Natural“, „Conrad Natural“, „Amala Natural“).";
}
function isNatural(v){ return v && /natural|neural/i.test(v.name); }
function renderBanner(){
  const el=document.getElementById("voiceBanner"); if(!el) return;
  if (window.TIMINGS && recVoice) { el.innerHTML=`<div class="vb good">✅ <span><b>Natural AI voice (recorded):</b> ${recVoice[0].toUpperCase()+recVoice.slice(1)} – works on phone, Chrome, Safari and Edge.</span><button class="icon-btn" onclick="testVoice()">🔊 Test voice</button></div>`; return; }
  const nat=voices.filter(isNatural);
  if (isNatural(voice)) {
    el.innerHTML=`<div class="vb good">✅ <span><b>Natural voice is on:</b> ${esc(voice.name.replace(/Microsoft |Online |\(Natural\)|- German.*$/g,'').trim())}${nat.length>1?` (+${nat.length-1} more in the voice list in the player)`:''}</span><button class="icon-btn" onclick="testVoice()">🔊 Test voice</button></div>`;
  } else {
    el.innerHTML=`<div class="vb bad">⚠️ <span><b>Robotic voice:</b> this browser has no natural German voice.<br>Open the downloaded file <b>b2-muendlich.html</b> in <b>Microsoft Edge</b> (right-click → Open with → Microsoft Edge) while you're online. Edge then uses the natural AI voices Katja, Amala, Conrad, Killian and Florian automatically.</span><button class="icon-btn" onclick="testVoice()">🔊 Test voice</button></div>`;
  }
}
function testVoice(){ say("test", "Hallo! Ich bin deine Stimme für die B2-Prüfung. Viel Erfolg beim Lernen!"); }
function score(v){ let s=0; if(/natural|neural/i.test(v.name)) s+=10; if(/online/i.test(v.name)) s+=5; if(/de-DE/i.test(v.lang)) s+=3; if(/katja|amala|seraphina|conrad|killian|florian/i.test(v.name)) s+=2; if(/google/i.test(v.name)) s+=1; return s; }
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = loadVoices; }
setTimeout(loadVoices, 0);

function speak(text, {onWord, onEnd, r} = {}){
  if (!("speechSynthesis" in window)) { onEnd && setTimeout(onEnd, 1500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE"; if (voice) u.voice = voice; u.rate = r || rate;
  if (onWord) u.onboundary = e => { if (e.name === "word" || e.name === undefined) onWord(e.charIndex); };
  u.onend = () => onEnd && onEnd();
  u.onerror = () => onEnd && onEnd();
  speechSynthesis.speak(u);
}
function sayOne(si,k){
  const de = TOPICS[cur].sections[si][2][k][0];
  const p = document.querySelectorAll(".section")[si].querySelectorAll(".sent")[k];
  const spans = [...p.querySelectorAll(".w")];
  say(TOPICS[cur].id+"/"+si+"_"+k, de, { onWord: i => spans.forEach(s => s.classList.toggle("speaking", +s.dataset.s <= i && i < +s.dataset.e)),
              onEnd: () => spans.forEach(s => s.classList.remove("speaking")) });
}

/* ===================== RECORDED NATURAL AUDIO ===================== */
const REC = window.TIMINGS || null;              // created by tools/make_audio.py
const REC_VOICES = REC ? Object.keys(REC) : [];
let recVoice = REC_VOICES[0] || null, curAudio = null, rafId = 0;
const hasRec = k => !!(recVoice && REC[recVoice] && REC[recVoice][k]);
function stopAll(){
  if (curAudio){ curAudio.onended = null; curAudio.pause(); curAudio = null; }
  cancelAnimationFrame(rafId);
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
// say(): plays the recorded MP3 if it exists, otherwise falls back to the browser voice
function say(k, text, {onWord, onEnd} = {}){
  stopAll();
  if (!hasRec(k)) { speak(text, {onWord, onEnd}); return; }
  const tm = REC[recVoice][k];
  const a = new Audio("audio/" + recVoice + "/" + k + ".mp3");
  a.playbackRate = rate; a.preservesPitch = true; curAudio = a;
  let done = false;
  const fin = () => { if (done) return; done = true; cancelAnimationFrame(rafId); if (curAudio === a) curAudio = null; onEnd && onEnd(); };
  a.onended = fin;
  a.onerror = () => { if (curAudio === a) curAudio = null; speak(text, {onWord, onEnd}); };
  const tick = () => {
    if (onWord && tm.length) {
      const ms = a.currentTime * 1000; let idx = -1;
      for (const [c, t] of tm) { if (t <= ms + 60) idx = c; else break; }
      if (idx >= 0) onWord(idx);
    }
    if (!a.paused) rafId = requestAnimationFrame(tick);
  };
  a.onplay = () => { rafId = requestAnimationFrame(tick); };
  a.play().catch(() => { a.onerror(); });
}

/* ===================== VIDEO PLAYER ===================== */
const MODES = { lesson:"Lektion", shadow:"Nachsprechen", exam:"Prüfung" };
const P = {
  t:0, mode:"lesson", items:[], i:0, playing:false, timer:null, en:true, token:0,
  build(){
    this.items = [];
    TOPICS[this.t].sections.forEach(([h,hen,s],si)=>{
      if (this.mode === "exam") this.items.push({si, kind:"prompt", h, de:h, en:hen});
      s.forEach(([de,en],k)=> this.items.push({si, k, h, de, en}));
    });
  },
  open(t, mode, startSec){
    this.t=t; this.mode=mode; this.build();
    this.i = startSec!=null ? this.items.findIndex(x=>x.si===startSec) : 0;
    $("#player").classList.add("open"); hidePop();
    $("#modeBtn").textContent = "Modus: " + MODES[mode];
    this.show(); this.play();
  },
  close(){ this.stop(); $("#player").classList.remove("open"); },
  show(){
    const it = this.items[this.i], T = TOPICS[this.t];
    $("#stTopic").textContent = T.title;
    $("#stCount").textContent = `Punkt ${it.si+1} / 10`;
    const head = $("#stHead"); head.textContent = `${it.si+1}. ${it.h}`;
    const tx = $("#stText"), en = $("#stEn");
    if (it.kind === "prompt") {
      tx.innerHTML = `<span style="opacity:.85">Du bist dran! Sprich frei über:</span><br>„${wrap(it.h, this.t+"|"+it.si+"|h")}“`;
      en.textContent = it.en;
    } else {
      tx.innerHTML = wrap(it.de, this.t+"|"+it.si+"|"+it.k);
      en.textContent = it.en;
    }
    en.classList.toggle("hide", !this.en);
    [head,tx].forEach(el=>{ el.style.animation="none"; el.offsetHeight; el.style.animation=""; });
    $("#progBar").style.width = ((this.i+1)/this.items.length*100) + "%";
    $("#stTimer").classList.remove("show");
    $("#avLabel").textContent = it.kind==="prompt" ? "Prüferin" : (isQ(it.de) ? "Frage an den Partner" : "Sprecherin");
  },
  play(){ this.playing=true; $("#playBtn").textContent="⏸ Pause"; this.run(); },
  pause(){ this.playing=false; this.token++; $("#playBtn").textContent="▶ Abspielen"; stopAll(); clearInterval(this.timer); $("#stage").classList.remove("talking"); $("#stTimer").classList.remove("show"); },
  stop(){ this.pause(); },
  toggle(){ this.playing ? this.pause() : this.play(); },
  run(){
    const tok = ++this.token, it = this.items[this.i], stage = $("#stage");
    const spans = [...$("#stText").querySelectorAll(".w")];
    const after = () => { if (tok!==this.token) return; stage.classList.remove("talking"); this.afterItem(tok); };
    if (it.kind === "prompt") {
      stage.classList.add("talking");
      say(TOPICS[this.t].id+"/"+it.si+"_p", `Punkt ${it.si+1}: ${it.h}. Bitte sprich jetzt.`, { onEnd: ()=>{ if(tok!==this.token) return; stage.classList.remove("talking"); this.countdown(tok, 45, "Sprich jetzt", ()=>this.advance(tok)); } });
      return;
    }
    stage.classList.add("talking");
    say(TOPICS[this.t].id+"/"+it.si+"_"+it.k, it.de, {
      onWord: i => spans.forEach(s => s.classList.toggle("speaking", +s.dataset.s <= i && i < +s.dataset.e)),
      onEnd: () => { spans.forEach(s=>s.classList.remove("speaking")); after(); }
    });
  },
  afterItem(tok){
    if (this.mode === "shadow") {
      const words = this.items[this.i].de.split(/\s+/).length;
      this.countdown(tok, Math.ceil(words*0.55/rate)+2, "Jetzt du – nachsprechen", ()=>this.advance(tok));
    } else setTimeout(()=>this.advance(tok), 600);
  },
  countdown(tok, n, label, cb){
    const box = $("#stTimer"); $("#stTimerLabel").textContent = label; $("#stTimerNum").textContent = n; box.classList.add("show");
    clearInterval(this.timer);
    this.timer = setInterval(()=>{
      if (tok!==this.token) { clearInterval(this.timer); return; }
      n--; $("#stTimerNum").textContent = n;
      if (n<=0) { clearInterval(this.timer); box.classList.remove("show"); cb(); }
    },1000);
  },
  advance(tok){
    if (tok!==this.token) return;
    if (this.i < this.items.length-1) { this.i++; this.show(); this.run(); }
    else { this.pause(); $("#stHead").textContent="Super gemacht! 🎉"; $("#stText").textContent="Thema abgeschlossen."; $("#stEn").textContent="Topic complete – well done!"; }
  },
  next(){ const was=this.playing; this.pause(); if(this.i<this.items.length-1) this.i++; this.show(); if(was) this.play(); },
  prev(){ const was=this.playing; this.pause(); if(this.i>0) this.i--; this.show(); if(was) this.play(); },
  cycleMode(){ const ks=Object.keys(MODES); const si=this.items[this.i].si; this.mode=ks[(ks.indexOf(this.mode)+1)%ks.length]; $("#modeBtn").textContent="Modus: "+MODES[this.mode]; const was=this.playing; this.pause(); this.build(); this.i=this.items.findIndex(x=>x.si===si); this.show(); if(was) this.play(); },
  cycleRate(){ const rs=[0.85,1.0,1.1]; rate=rs[(rs.indexOf(rate)+1)%rs.length]; $("#rateBtn").textContent=`Tempo ${rate}×`; if(curAudio) curAudio.playbackRate=rate; },
  toggleEn(){ this.en=!this.en; $("#enBtn").classList.toggle("on",this.en); $("#stEn").classList.toggle("hide",!this.en); },
  setVoice(i){ if (window.TIMINGS) { recVoice = i; renderBanner(); return; } voice = voices[+i]; loadVoices(); }
};
document.addEventListener("keydown", e=>{
  if (!$("#player").classList.contains("open")) return;
  if (e.key===" ") { e.preventDefault(); P.toggle(); }
  if (e.key==="ArrowRight") P.next();
  if (e.key==="ArrowLeft") P.prev();
  if (e.key==="Escape") P.close();
});

go(0);
</script>
