", "I'll take care of the video and the chat group."]]], ["Person A", "Person A", [["Und ich übernehme das Lied und das Geldsammeln.", "And I'll do the song and collect the money."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-umzug", "type": "plan", "title": "Einem Freund beim Umzug helfen", "en": "Helping a friend move", "task": "Ihr Freund möchte in eine andere Stadt umziehen. Sie wollen beim Umzug helfen. Planen Sie gemeinsam, was zu tun ist.", "task_en": "Your friend wants to move to another town. You want to help with the move. Plan together what needs to be done.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, zieht unser Freund Tim nächsten Monat nach Hamburg, und wir wollen ihm beim Umzug helfen.", "Hi! As you know, our friend Tim is moving to Hamburg next month, and we want to help him with the move."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst klären, wann genau der Umzug stattfindet.", "In my opinion, we should first clarify exactly when the move takes place."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was den Transport angeht, würde ich vorschlagen, einen Transporter zu mieten, weil das viel billiger als eine Umzugsfirma ist.", "As for transport, I'd suggest renting a van, because it's much cheaper than a removal company."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was das Packen betrifft, finde ich es wichtig, eine Woche vorher anzufangen und alle Kartons zu beschriften, denn dann geht am Umzugstag alles schneller.", "As far as packing is concerned, I think it's important to start a week earlier and label all the boxes, because then everything goes faster on moving day."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Helfer schlage ich vor, noch drei oder vier Freunde zu fragen, damit niemand zu schwer tragen muss.", "Regarding helpers, I suggest asking three or four more friends so that nobody has to carry too much."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was das Essen angeht, wäre Pizza für alle sinnvoll, weil die Helfer nach der Arbeit bestimmt Hunger haben.", "As for food, pizza for everyone would make sense, because the helpers will surely be hungry after the work."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings ist Hamburg weit weg. Vielleicht sollten wir sehr früh losfahren, damit wir nicht im Stau stehen?", "However, Hamburg is far away. Maybe we should leave very early so that we don't get stuck in traffic?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Wenn wir um sechs Uhr losfahren, sind wir mittags in Hamburg und können in Ruhe ausladen.", "If we leave at six, we'll be in Hamburg by noon and can unload calmly."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um den Transporter und die Kartons.", "I'll take care of the van and the boxes."]]], ["Person A", "Person A", [["Und ich übernehme die Helfer und das Essen.", "And I'll do the helpers and the food."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-kino", "type": "plan", "title": "Zusammen ins Kino gehen", "en": "Going to the cinema together", "task": "Nächsten Freitag ist der letzte Tag des Deutschkurses und Sie wollen mit dem Kurs ins Kino gehen. Machen Sie gemeinsam einen Plan.", "task_en": "Next Friday is the last day of the German course, and you want to go to the cinema with the course. Make a plan together.", "sections": [["Person A", "Person A", [["Hallo! Nächsten Freitag ist der letzte Kurstag, und ich möchte gern mit allen zusammen ins Kino gehen.", "Hi! Next Friday is the last day of the course, and I'd like to go to the cinema with everyone."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst einen passenden Film aussuchen.", "In my opinion, we should first choose a suitable film."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was den Film angeht, würde ich eine deutsche Komödie mit Untertiteln vorschlagen, weil wir dabei Deutsch üben und trotzdem alles verstehen.", "As for the film, I'd suggest a German comedy with subtitles, because we practise German and still understand everything."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Uhrzeit betrifft, finde ich die Vorstellung um 18 Uhr gut, denn der Kurs endet um 17 Uhr.", "As far as the time is concerned, I think the 6 pm showing is good, because the course ends at 5 pm."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Karten schlage ich vor, sie online zu reservieren, damit wir einen Gruppenrabatt bekommen und nebeneinander sitzen.", "Regarding tickets, I suggest booking them online so that we get a group discount and sit together."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Einladung angeht, wäre eine Nachricht in der Kursgruppe sinnvoll, weil wir dann schnell wissen, wer mitkommt.", "As for the invitation, a message in the course group would make sense, because then we quickly know who's coming."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings möchten manche danach vielleicht noch zusammen essen. Vielleicht reservieren wir auch einen Tisch in einem Restaurant?", "However, some people might want to eat together afterwards. Maybe we could also book a table in a restaurant?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Ein gemeinsames Essen wäre ein schöner Abschluss für unseren Kurs.", "A meal together would be a nice ending for our course."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Kinokarten.", "I'll take care of the cinema tickets."]]], ["Person A", "Person A", [["Und ich übernehme das Restaurant und informiere alle im Kurs.", "And I'll do the restaurant and let everyone in the course know."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-software", "type": "plan", "title": "Ein Software-Seminar organisieren", "en": "Organising a software seminar", "task": "Sie organisieren ein Seminar über Computersoftware. Überlegen Sie gemeinsam, was Sie tun können, und entwickeln Sie Vorschläge für das Seminar.", "task_en": "You are organising a seminar on computer software. Think together about what you can do and develop ideas for the seminar.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, sollen wir ein Seminar über Computersoftware organisieren.", "Hi! As you know, we are supposed to organise a seminar on computer software."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, wer die Teilnehmer sind und was sie lernen möchten.", "In my opinion, we should first think about who the participants are and what they want to learn."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Thema angeht, würde ich Word und Excel vorschlagen, weil viele Menschen diese Programme für ihre Arbeit brauchen.", "As for the topic, I'd suggest Word and Excel, because many people need these programs for work."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was den Raum betrifft, finde ich es wichtig, dass jeder einen eigenen Computer hat, denn man lernt am besten durch Üben.", "As far as the room is concerned, I think it's important that everyone has their own computer, because you learn best by practising."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich des Referenten schlage ich vor, einen erfahrenen IT-Trainer einzuladen, damit die Teilnehmer Antworten auf alle Fragen bekommen.", "Regarding the speaker, I suggest inviting an experienced IT trainer so that participants get answers to all their questions."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Unterlagen angeht, wäre eine kurze Anleitung zum Mitnehmen sinnvoll, weil die Teilnehmer zu Hause weiterüben möchten.", "As for materials, a short guide to take home would make sense, because participants want to keep practising at home."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings kostet ein Trainer Geld. Vielleicht verlangen wir eine kleine Teilnahmegebühr?", "However, a trainer costs money. Maybe we could charge a small participation fee?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Zwanzig Euro pro Person wären fair, und Studenten könnten weniger bezahlen.", "Twenty euros per person would be fair, and students could pay less."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um den Raum und die Computer.", "I'll take care of the room and the computers."]]], ["Person A", "Person A", [["Und ich übernehme den Trainer und die Anmeldung der Teilnehmer.", "And I'll do the trainer and the participants' registration."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-kinderkrankenhaus", "type": "plan", "title": "Besuch in einem Kinderkrankenhaus", "en": "Visit to a children's hospital", "task": "Sie organisieren einen Besuch in einem Kinderkrankenhaus. Überlegen Sie, wie der Besuch ablaufen soll und wie Sie den Kindern eine Freude machen können.", "task_en": "You are organising a visit to a children's hospital. Think about how the visit should go and how you can bring the children some joy.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, wollen wir mit unserem Verein die Kinder im Kinderkrankenhaus besuchen.", "Hi! As you know, we want to visit the children in the children's hospital with our club."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst mit dem Krankenhaus sprechen, was erlaubt ist.", "In my opinion, we should first talk to the hospital about what is allowed."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Programm angeht, würde ich ein kleines Puppentheater vorschlagen, weil Kinder das lieben und dabei lachen können.", "As for the programme, I'd suggest a small puppet show, because children love it and can laugh."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Geschenke betrifft, finde ich kleine Spielsachen und Bücher passend, denn der Alltag im Krankenhaus ist oft langweilig.", "As far as presents are concerned, I think small toys and books are suitable, because hospital life is often boring."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Hygiene schlage ich vor, die Regeln des Krankenhauses genau zu befolgen, damit kein Kind krank wird.", "Regarding hygiene, I suggest following the hospital's rules exactly so that no child gets ill."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Kinder angeht, wäre es sinnvoll, vorher nach Allergien zu fragen, weil manche bestimmte Süßigkeiten nicht essen dürfen.", "As for the children, it would make sense to ask about allergies beforehand, because some aren't allowed certain sweets."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings sind manche Kinder sehr krank und müssen im Bett bleiben. Vielleicht besuchen wir sie direkt in ihren Zimmern?", "However, some children are very ill and have to stay in bed. Maybe we could visit them directly in their rooms?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Dann sollten wir in kleinen Gruppen gehen, damit es in den Zimmern nicht zu laut wird.", "Then we should go in small groups so that it doesn't get too loud in the rooms."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um den Termin mit dem Krankenhaus.", "I'll take care of the appointment with the hospital."]]], ["Person A", "Person A", [["Und ich übernehme das Puppentheater und die Geschenke.", "And I'll do the puppet show and the presents."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-sportfest", "type": "plan", "title": "Ein kulturelles Sportfest planen", "en": "Planning a cultural sports festival", "task": "Ihre Stadt plant ein Sportfest, auf dem auch verschiedene Kulturen vorgestellt werden. Sie sollen bei der Planung helfen.", "task_en": "Your town is planning a sports festival where different cultures will also be presented. You are supposed to help with the planning.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, plant unsere Stadt ein Sportfest, bei dem auch verschiedene Kulturen vorgestellt werden.", "Hi! As you know, our town is planning a sports festival where different cultures will also be presented."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, welche Sportarten wir anbieten.", "In my opinion, we should first think about which sports we will offer."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Sportarten angeht, würde ich Fußball, Volleyball und traditionelle Spiele aus verschiedenen Ländern vorschlagen, weil so alle mitmachen können.", "As for the sports, I'd suggest football, volleyball and traditional games from different countries, because then everyone can take part."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was das Essen betrifft, finde ich es schön, wenn Familien typische Gerichte aus ihrer Heimat anbieten, denn so lernen die Besucher andere Kulturen kennen.", "As far as food is concerned, I think it's nice if families offer typical dishes from home, because visitors get to know other cultures."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Musik schlage ich eine kleine Bühne mit Tänzen aus aller Welt vor, damit das Fest am Abend weitergeht.", "Regarding music, I suggest a small stage with dances from around the world so that the festival continues into the evening."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Werbung angeht, wären Plakate in mehreren Sprachen sinnvoll, weil wir alle Kulturen in der Stadt erreichen wollen.", "As for advertising, posters in several languages would make sense, because we want to reach all cultures in town."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings kann das Wetter schlecht sein. Vielleicht sollten wir eine Turnhalle als Alternative reservieren?", "However, the weather might be bad. Maybe we should book a sports hall as an alternative?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Wir sollten die Turnhalle schon jetzt reservieren, weil sie im Sommer oft ausgebucht ist.", "We should book the sports hall now, because it's often fully booked in summer."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Sportarten und die Turnhalle.", "I'll take care of the sports and the sports hall."]]], ["Person A", "Person A", [["Und ich übernehme das Essen und die Bühne.", "And I'll do the food and the stage."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-blutspende", "type": "plan", "title": "Eine Blutspendeaktion organisieren", "en": "Organising a blood donation event", "task": "In einem Gesundheitszentrum in Ihrer Stadt soll eine Blutspendeaktion stattfinden. Sie helfen bei der Planung. Denken Sie zum Beispiel an Informationsmaterial oder Poster.", "task_en": "A blood donation event is taking place at a health centre in your town. You are helping with the planning. Think, for example, about information material or posters.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, soll im Gesundheitszentrum eine Blutspendeaktion stattfinden, und wir sollen bei der Planung helfen.", "Hi! As you know, there's going to be a blood donation event at the health centre, and we're supposed to help with the planning."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, wie wir viele Spender finden.", "In my opinion, we should first think about how to find lots of donors."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Information angeht, würde ich vorschlagen zu erklären, warum Blutspenden Leben rettet, weil viele Menschen das nicht genau wissen.", "As for information, I'd suggest explaining why donating blood saves lives, because many people don't know exactly."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Werbung betrifft, finde ich Poster in Supermärkten, Schulen und Arztpraxen sinnvoll, denn dort kommen jeden Tag viele Menschen vorbei.", "As far as advertising is concerned, I think posters in supermarkets, schools and doctors' surgeries make sense, because many people pass by every day."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Spender schlage ich vor, jedem nach der Spende ein kleines Frühstück zu geben, damit sie sich gut fühlen und wiederkommen.", "Regarding donors, I suggest giving everyone a small breakfast after donating so that they feel good and come back."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Ärzte angeht, wäre genug Personal sinnvoll, weil die Spender sonst lange warten müssen.", "As for the doctors, enough staff would make sense, because otherwise donors have to wait a long time."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings dürfen nicht alle Menschen Blut spenden. Vielleicht machen wir einen Flyer mit den wichtigsten Regeln?", "However, not everyone is allowed to donate blood. Maybe we could make a flyer with the most important rules?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Auf dem Flyer sollten auch die Uhrzeiten und die Adresse des Gesundheitszentrums stehen.", "The flyer should also show the times and the address of the health centre."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Poster und den Flyer.", "I'll take care of the posters and the flyer."]]], ["Person A", "Person A", [["Und ich übernehme das Frühstück und spreche mit den Ärzten.", "And I'll do the breakfast and talk to the doctors."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-nachhilfe", "type": "plan", "title": "Dem Sohn eines Freundes beim Lernen helfen", "en": "Helping a friend's son with his studies", "task": "Der Sohn Ihres Freundes hat Probleme in der Schule. Sie möchten ihm beim Lernen helfen. Überlegen Sie gemeinsam, wie Sie das organisieren.", "task_en": "Your friend's son has problems at school. You want to help him learn. Think together about how to organise it.", "sections": [["Person A", "Person A", [["Hallo! Unser Freund Ali hat erzählt, dass sein Sohn schlechte Noten in Mathe und Deutsch hat.", "Hi! Our friend Ali told me that his son has bad grades in maths and German."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir ihm helfen, bevor er die Lust an der Schule verliert.", "In my opinion, we should help him before he loses interest in school."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was Mathe angeht, würde ich vorschlagen, dass ich zweimal pro Woche mit ihm übe, weil ich in Mathe gut bin.", "As for maths, I'd suggest I practise with him twice a week, because I'm good at maths."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was Deutsch betrifft, finde ich es wichtig, dass er viel liest und schreibt, denn so wird er auch in anderen Fächern besser.", "As far as German is concerned, I think it's important that he reads and writes a lot, because then he'll get better in other subjects too."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Motivation schlage ich vor, mit Spielen und kleinen Belohnungen zu arbeiten, damit er wieder Spaß am Lernen hat.", "Regarding motivation, I suggest working with games and small rewards so that he enjoys learning again."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Zeit angeht, wäre höchstens eine Stunde pro Tag sinnvoll, weil er sich sonst nicht mehr konzentrieren kann.", "As for time, at most an hour a day would make sense, because otherwise he can't concentrate any more."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings sollten wir auch mit seinem Lehrer sprechen. Vielleicht weiß er genau, wo die Probleme liegen?", "However, we should also talk to his teacher. Maybe he knows exactly where the problems are?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Wenn wir wissen, was ihm schwerfällt, können wir viel gezielter mit ihm üben.", "If we know what he finds difficult, we can practise with him in a much more targeted way."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um Mathe und spreche mit dem Lehrer.", "I'll take care of maths and talk to the teacher."]]], ["Person A", "Person A", [["Und ich übernehme Deutsch und die Lernspiele.", "And I'll do German and the learning games."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-strassenfest", "type": "plan", "title": "Ein Straßenfest im Sommer organisieren", "en": "Organising a summer street party", "task": "In vielen deutschen Städten gibt es im Sommer Straßenfeste mit Essen, Musik und Spielen. Sie möchten auch in Ihrer Straße ein Fest mit allen Nachbarn organisieren.", "task_en": "In many German towns there are street parties in summer with food, music and games. You want to organise a party with all the neighbours in your street too.", "sections": [["Person A", "Person A", [["Hallo! Ich finde die Idee mit den Straßenfesten toll und möchte auch in unserer Straße ein Fest organisieren.", "Hi! I love the idea of street parties and would like to organise one in our street too."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst alle Nachbarn informieren und fragen, wer mitmachen möchte.", "In my opinion, we should first inform all the neighbours and ask who would like to take part."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Einladung angeht, würde ich einen Zettel in jedem Briefkasten und eine Chatgruppe vorschlagen, weil wir so alle Nachbarn erreichen.", "As for the invitation, I'd suggest a note in every letterbox and a chat group, because that way we reach all the neighbours."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was das Essen betrifft, finde ich es gut, wenn jede Familie etwas Selbstgemachtes mitbringt, denn das kostet wenig und schmeckt besser.", "As far as food is concerned, I think it's good if each family brings something homemade, because it costs little and tastes better."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Kinder schlage ich Spiele wie Sackhüpfen und Kinderschminken vor, damit auch die Kleinen Spaß haben.", "Regarding the children, I suggest games like sack races and face painting so that the little ones have fun too."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Musik angeht, wäre ein Musiker aus der Nachbarschaft sinnvoll, weil Live-Musik für gute Stimmung sorgt.", "As for music, a musician from the neighbourhood would make sense, because live music creates a good atmosphere."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings brauchen wir eine Genehmigung, weil die Straße gesperrt werden muss. Vielleicht fragen wir gleich beim Ordnungsamt?", "However, we need permission because the street has to be closed. Maybe we could ask the public order office straight away?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Wir sollten uns beeilen, weil die Genehmigung ein paar Wochen dauern kann.", "We should hurry, because permission can take a few weeks."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Genehmigung, die Tische und die Bänke.", "I'll take care of the permission, the tables and the benches."]]], ["Person A", "Person A", [["Und ich übernehme die Einladungen und die Spiele für die Kinder.", "And I'll do the invitations and the games for the children."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-buecherspende", "type": "plan", "title": "Eine Bücherspende für die Bibliothek", "en": "A book donation for the library", "task": "Sie organisieren eine Veranstaltung, bei der Sie in Ihrer Straße Bücher für die Bibliothek sammeln. Sammeln Sie Ideen und verteilen Sie die Aufgaben.", "task_en": "You are organising an event where you collect books in your street for the library. Collect ideas and divide up the tasks.", "sections": [["Person A", "Person A", [["Hallo! Unsere Stadtbibliothek braucht neue Bücher, und ich möchte eine Bücherspende in unserer Straße organisieren.", "Hi! Our town library needs new books, and I'd like to organise a book donation in our street."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst fragen, welche Bücher die Bibliothek wirklich braucht.", "In my opinion, we should first ask which books the library really needs."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Bücher angeht, würde ich vor allem Kinderbücher und Romane vorschlagen, weil die Bibliothek diese am meisten braucht.", "As for the books, I'd mainly suggest children's books and novels, because the library needs those most."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Veranstaltung betrifft, finde ich eine kleine Party mit Kaffee, Kuchen und einer Lesung schön, denn dann kommen mehr Nachbarn.", "As far as the event is concerned, I think a small party with coffee, cake and a reading is nice, because then more neighbours will come."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Werbung schlage ich vor, Plakate aufzuhängen und in der Chatgruppe zu schreiben, damit jeder rechtzeitig Bescheid weiß.", "Regarding advertising, I suggest hanging up posters and writing in the chat group so that everyone knows in time."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was den Zustand angeht, wäre es sinnvoll, nur gute Bücher anzunehmen, weil die Bibliothek kaputte Bücher nicht ausleihen kann.", "As for condition, it would make sense to accept only books in good condition, because the library can't lend out damaged ones."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings können nicht alle Nachbarn zur Party kommen. Vielleicht stellen wir zusätzlich eine Sammelbox auf?", "However, not all the neighbours can come to the party. Maybe we could also set up a collection box?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Die Sammelbox könnten wir zum Beispiel im Eingang vom Supermarkt aufstellen.", "We could put the collection box in the supermarket entrance, for example."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Plakate und die Sammelbox.", "I'll take care of the posters and the collection box."]]], ["Person A", "Person A", [["Und ich übernehme den Kuchen und spreche mit der Bibliothek.", "And I'll do the cake and talk to the library."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-lehrerfest", "type": "plan", "title": "Ein Überraschungsfest für die Lehrerin", "en": "A surprise party for the teacher", "task": "Ihr Kurs möchte ein Überraschungsfest für Ihre Lehrerin organisieren. Sie helfen bei der Planung. Überlegen Sie gemeinsam, was Sie tun können.", "task_en": "Your course wants to organise a surprise party for your teacher. You are helping with the planning. Think together about what you can do.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, möchte unser Kurs ein Überraschungsfest für unsere Lehrerin organisieren.", "Hi! As you know, our course wants to organise a surprise party for our teacher."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst einen Termin finden, an dem alle Zeit haben.", "In my opinion, we should first find a date when everyone has time."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was den Termin angeht, würde ich den letzten Kurstag vorschlagen, weil wir uns dann bei der Lehrerin bedanken können.", "As for the date, I'd suggest the last day of the course, because then we can thank the teacher."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was das Geschenk betrifft, finde ich ein Fotoalbum mit Grüßen von allen sehr persönlich, denn so hat sie eine schöne Erinnerung an uns.", "As far as the present is concerned, I think a photo album with greetings from everyone is very personal, because she'll have a lovely memory of us."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich des Essens schlage ich vor, dass jeder ein Gericht aus seinem Heimatland mitbringt, damit das Fest bunt und international wird.", "Regarding food, I suggest everyone brings a dish from their home country so that the party is colourful and international."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Dekoration angeht, wären Ballons und Blumen sinnvoll, weil das wenig kostet und festlich aussieht.", "As for decorations, balloons and flowers would make sense, because they cost little and look festive."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings darf die Lehrerin nichts merken. Vielleicht bitten wir die Schulleitung, sie kurz abzulenken?", "However, the teacher mustn't notice anything. Maybe we could ask the school management to distract her briefly?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Vielleicht kann die Schulleiterin sie für zehn Minuten zu einem Gespräch ins Büro bitten.", "Maybe the head teacher could ask her into the office for a ten-minute chat."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um das Fotoalbum und die Dekoration.", "I'll take care of the photo album and the decorations."]]], ["Person A", "Person A", [["Und ich übernehme das Essen und spreche mit der Schulleitung.", "And I'll do the food and talk to the school management."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-kochparty", "type": "plan", "title": "Eine Kochparty im Deutschkurs", "en": "A cooking party in the German course", "task": "Sie organisieren einen Kochnachmittag in Ihrem Deutschkurs. Planen Sie gemeinsam ein Programm und machen Sie Vorschläge.", "task_en": "You are organising a cooking afternoon in your German course. Plan a programme together and make suggestions.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, wollen wir in unserem Deutschkurs einen Kochnachmittag organisieren.", "Hi! As you know, we want to organise a cooking afternoon in our German course."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst einen Ort mit einer großen Küche finden.", "In my opinion, we should first find a place with a big kitchen."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was den Ort angeht, würde ich die Küche im Gemeinschaftszentrum vorschlagen, weil sie groß und modern ist.", "As for the place, I'd suggest the kitchen in the community centre, because it's big and modern."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Gerichte betrifft, finde ich es spannend, wenn jede Gruppe ein Gericht aus einem anderen Land kocht, denn so probieren wir viel Neues.", "As far as the dishes are concerned, I think it's exciting if each group cooks a dish from a different country, because we try lots of new things."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Zutaten schlage ich vor, dass jeder fünf Euro bezahlt und wir zusammen einkaufen, damit es für alle fair ist.", "Regarding ingredients, I suggest everyone pays five euros and we shop together so that it's fair for everyone."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was das Ende angeht, wäre ein gemeinsames Essen sinnvoll, weil wir dann über die Gerichte sprechen können.", "As for the end, a meal together would make sense, because then we can talk about the dishes."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings haben manche Teilnehmer Allergien oder essen kein Fleisch. Vielleicht kochen wir auch vegetarische Gerichte?", "However, some participants have allergies or don't eat meat. Maybe we could also cook vegetarian dishes?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Wir sollten vorher eine Liste machen, damit wir wissen, wer was nicht essen darf.", "We should make a list beforehand so that we know who can't eat what."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Küche und das Einkaufen.", "I'll take care of the kitchen and the shopping."]]], ["Person A", "Person A", [["Und ich übernehme die Rezepte und schreibe sie auf Deutsch auf.", "And I'll do the recipes and write them down in German."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-medientag", "type": "plan", "title": "Infotag zum Thema Neue Medien", "en": "Info day on new media", "task": "An einer Bildungseinrichtung in Ihrer Stadt soll ein Infotag zum Thema „Neue Medien: Internet, Handy, Smartphone“ stattfinden. Denken Sie an Informationsmaterial, Vorträge und Werbung.", "task_en": "An info day on 'New media: internet, mobile phones, smartphones' is taking place at an educational institution in your town. Think about information material, talks and advertising.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, soll ein Infotag zum Thema Neue Medien stattfinden, und wir sollen bei der Planung helfen.", "Hi! As you know, there's going to be an info day on new media, and we're supposed to help with the planning."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, welche Themen für die Besucher am interessantesten sind.", "In my opinion, we should first think about which topics are most interesting for the visitors."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Themen angeht, würde ich Sicherheit im Internet, Datenschutz und Handys für Kinder vorschlagen, weil sich viele Eltern darüber Sorgen machen.", "As for the topics, I'd suggest internet safety, data protection and phones for children, because many parents worry about them."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Vorträge betrifft, finde ich einen Experten von der Polizei wichtig, denn er kennt echte Beispiele.", "As far as talks are concerned, I think an expert from the police is important, because he knows real examples."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Werbung schlage ich Poster und Beiträge in den sozialen Medien vor, damit auch junge Leute kommen.", "Regarding advertising, I suggest posters and social media posts so that young people come too."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Schüler angeht, wäre es sinnvoll, dass sie ihre Lieblings-Apps vorstellen, weil sie sich oft besser auskennen als Erwachsene.", "As for the students, it would make sense for them to present their favourite apps, because they often know more than adults."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings sind nicht alle Besucher technisch fit. Vielleicht bieten wir auch einen Kurs für Anfänger an?", "However, not all visitors are good with technology. Maybe we could also offer a beginners' course?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Im Anfängerkurs könnten wir ganz einfach erklären, wie man E-Mails schreibt oder im Internet sucht.", "In the beginners' course we could explain very simply how to write emails or search the internet."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um den Experten und den Anfängerkurs.", "I'll take care of the expert and the beginners' course."]]], ["Person A", "Person A", [["Und ich übernehme die Poster und die Werbung im Internet.", "And I'll do the posters and the online advertising."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-museum", "type": "plan", "title": "Einen Museumsbesuch planen", "en": "Planning a museum visit", "task": "Sie wollen mit Ihren Kolleginnen und Kollegen aus dem Sprachkurs ein Museum besuchen. Entwickeln Sie gemeinsam Vorschläge für den Besuch.", "task_en": "You want to visit a museum with your classmates from the language course. Develop ideas for the visit together.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, wollen wir mit unserem Sprachkurs ein Museum besuchen.", "Hi! As you know, we want to visit a museum with our language course."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst entscheiden, welches Museum für alle interessant ist.", "In my opinion, we should first decide which museum is interesting for everyone."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Museum angeht, würde ich das Stadtmuseum vorschlagen, weil wir dort viel über die Geschichte unserer Stadt lernen.", "As for the museum, I'd suggest the town museum, because we learn a lot about our town's history there."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Führung betrifft, finde ich eine Führung auf einfachem Deutsch wichtig, denn so verstehen alle Kursteilnehmer etwas.", "As far as the tour is concerned, I think a tour in simple German is important, because then everyone understands something."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Kosten schlage ich vor, nach einem Gruppenrabatt zu fragen, damit der Besuch für alle bezahlbar ist.", "Regarding costs, I suggest asking for a group discount so that the visit is affordable for everyone."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was den Termin angeht, wäre ein Samstag sinnvoll, weil dann alle frei haben.", "As for the date, a Saturday would make sense, because everyone is free then."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings dauert eine Führung nur eine Stunde. Vielleicht gehen wir danach noch zusammen in ein Café?", "However, a tour only lasts an hour. Maybe we could go to a café together afterwards?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Im Café können wir dann über die Ausstellung sprechen und unser Deutsch üben.", "In the café we can then talk about the exhibition and practise our German."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Reservierung der Führung.", "I'll take care of booking the tour."]]], ["Person A", "Person A", [["Und ich übernehme das Café und informiere den Kurs.", "And I'll do the café and let the course know."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-berufsinfo", "type": "plan", "title": "Infoveranstaltung über Schule, Ausbildung und Beruf", "en": "Information event on school, training and careers", "task": "Sie wollen an einer Schule eine Informationsveranstaltung zum Thema Schule, Ausbildung und Beruf organisieren. Überlegen Sie, welche Experten Sie einladen möchten.", "task_en": "You want to organise an information event at a school on school, vocational training and careers. Think about which experts you'd like to invite.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, wollen wir an unserer Schule eine Infoveranstaltung über Ausbildung und Beruf organisieren.", "Hi! As you know, we want to organise an info event about training and careers at our school."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, welche Experten wir einladen.", "In my opinion, we should first think about which experts to invite."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Experten angeht, würde ich jemanden von der Arbeitsagentur vorschlagen, weil er viele Ausbildungsberufe kennt.", "As for experts, I'd suggest someone from the employment agency, because they know many trainee occupations."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was den Ablauf betrifft, finde ich zuerst Vorträge und danach Infostände gut, denn so können die Schüler direkt Fragen stellen.", "As far as the schedule is concerned, I think talks first and then info stands is good, because students can ask questions directly."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Firmen schlage ich vor, Azubis einzuladen, damit die Schüler hören, wie eine Ausbildung wirklich ist.", "Regarding companies, I suggest inviting trainees so that students hear what training is really like."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Schüler angeht, wäre ein Fragebogen vorher sinnvoll, weil sie sich dann besser vorbereiten können.", "As for the students, a questionnaire beforehand would make sense, because then they can prepare better."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings sind viele Eltern tagsüber bei der Arbeit. Vielleicht machen wir die Veranstaltung am Abend?", "However, many parents are at work during the day. Maybe we could hold the event in the evening?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Achtzehn Uhr wäre eine gute Zeit, dann können auch berufstätige Eltern kommen.", "Six o'clock would be a good time, so that working parents can come too."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Arbeitsagentur und die Firmen.", "I'll take care of the employment agency and the companies."]]], ["Person A", "Person A", [["Und ich übernehme die Einladungen an Schüler und Eltern.", "And I'll do the invitations to students and parents."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-studienreise", "type": "plan", "title": "Eine Studienreise für eine Schülergruppe", "en": "A study trip for a group of students", "task": "Eine Gruppe von Schülern macht eine Studienreise in Ihre Stadt. Planen Sie zusammen das Programm. Denken Sie an Schulen, Universitäten, Bibliotheken und Vorträge.", "task_en": "A group of students is making a study trip to your town. Plan the programme together. Think about schools, universities, libraries and talks.", "sections": [["Person A", "Person A", [["Hallo! Mein Chef hat mir gesagt, dass nächste Woche eine Schülergruppe für eine Studienreise in unsere Stadt kommt.", "Hi! My boss told me that a group of students is coming to our town next week for a study trip."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst fragen, wofür sich die Schüler besonders interessieren.", "In my opinion, we should first ask what the students are particularly interested in."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was den ersten Tag angeht, würde ich die Universität und die Bibliothek vorschlagen, weil sich die Schüler für das Studium interessieren.", "As for the first day, I'd suggest the university and the library, because the students are interested in studying."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Schule betrifft, finde ich ein Treffen mit deutschen Schülern wichtig, denn so können sie Kontakte knüpfen.", "As far as the school is concerned, I think meeting German students is important, because they can make contacts."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Vorträge schlage ich vor, einen Professor einzuladen, damit die Schüler Informationen aus erster Hand bekommen.", "Regarding talks, I suggest inviting a professor so that the students get first-hand information."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Freizeit angeht, wären eine Stadtführung und ein Musikabend sinnvoll, weil die Schüler auch Spaß haben möchten.", "As for free time, a city tour and a music evening would make sense, because the students want to have fun too."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings kommen die Schüler aus verschiedenen Ländern. Vielleicht brauchen wir manchmal einen Dolmetscher?", "However, the students come from different countries. Maybe we'll sometimes need an interpreter?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Vielleicht kann uns auch ein Student helfen, der mehrere Sprachen spricht.", "Maybe a student who speaks several languages could help us too."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Universität und den Professor.", "I'll take care of the university and the professor."]]], ["Person A", "Person A", [["Und ich übernehme die Stadtführung und den Musikabend.", "And I'll do the city tour and the music evening."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-buchmesse", "type": "plan", "title": "Eine Buchmesse organisieren", "en": "Organising a book fair", "task": "In einem Kulturzentrum in Ihrer Stadt soll eine Buchmesse stattfinden. Sie wollen bei der Planung helfen. Denken Sie zum Beispiel an Informationsmaterial oder Poster.", "task_en": "A book fair is taking place at a cultural centre in your town. You want to help with the planning. Think, for example, about information material or posters.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, soll im Kulturzentrum eine Buchmesse stattfinden, und wir möchten bei der Planung helfen.", "Hi! As you know, there's going to be a book fair at the cultural centre, and we'd like to help with the planning."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst klären, an welchen Tagen und zu welchen Uhrzeiten die Messe stattfindet.", "In my opinion, we should first clarify on which days and at what times the fair takes place."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Programm angeht, würde ich Lesungen mit bekannten Autoren vorschlagen, weil sie viele Besucher anziehen.", "As for the programme, I'd suggest readings by well-known authors, because they attract many visitors."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Kinder betrifft, finde ich eine Ecke mit Bilderbüchern und Vorlesestunden wichtig, denn dann kommen auch Familien.", "As far as children are concerned, I think a corner with picture books and story times is important, because then families come too."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Werbung schlage ich vor, Poster zu drucken und die Messe im Radio anzukündigen, damit viele Leute davon erfahren.", "Regarding advertising, I suggest printing posters and announcing the fair on the radio so that many people hear about it."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was das Informationsmaterial angeht, wäre ein Plan mit allen Ständen sinnvoll, weil sich die Besucher so besser orientieren.", "As for information material, a plan of all the stands would make sense, because visitors find their way better."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings brauchen die Besucher auch Pausen. Vielleicht organisieren wir ein kleines Café?", "However, visitors also need breaks. Maybe we could organise a small café?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Im Café könnten Besucher dann in Ruhe in ihren neuen Büchern lesen.", "In the café visitors could then read their new books in peace."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Autoren und die Kinderecke.", "I'll take care of the authors and the children's corner."]]], ["Person A", "Person A", [["Und ich übernehme die Poster, den Plan und das Café.", "And I'll do the posters, the plan and the café."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-krankenhaus", "type": "plan", "title": "Einen Freund im Krankenhaus aufmuntern", "en": "Cheering up a friend in hospital", "task": "Ihr Freund Valentin hat sich das Bein gebrochen und muss noch eine Woche im Krankenhaus bleiben. Er langweilt sich. Überlegen Sie, wie Sie ihn aufmuntern können, und planen Sie die Woche.", "task_en": "Your friend Valentin has broken his leg and has to stay in hospital for another week. He is bored. Think about how you can cheer him up and plan the week.", "sections": [["Person A", "Person A", [["Hallo! Hast du gehört, dass Valentin sich das Bein gebrochen hat und noch eine Woche im Krankenhaus bleiben muss?", "Hi! Have you heard that Valentin has broken his leg and has to stay in hospital for another week?"], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir ihn so oft wie möglich besuchen, damit er sich nicht langweilt.", "In my opinion, we should visit him as often as possible so that he doesn't get bored."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Besuche angeht, würde ich einen Besuchsplan vorschlagen, weil Valentin dann jeden Tag Gesellschaft hat.", "As for visits, I'd suggest a visiting schedule, because then Valentin has company every day."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Unterhaltung betrifft, finde ich Brettspiele, Bücher und Filme gut, denn im Bett vergeht die Zeit sonst sehr langsam.", "As far as entertainment is concerned, I think board games, books and films are good, because otherwise time passes very slowly in bed."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich des Essens schlage ich vor, ihm ab und zu sein Lieblingsessen mitzubringen, damit er sich freut.", "Regarding food, I suggest bringing him his favourite food now and then so that he's happy."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die anderen Freunde angeht, wäre es sinnvoll, sie auch zu fragen, weil Valentin sich über jeden Besuch freut.", "As for the other friends, it would make sense to ask them too, because Valentin is happy about every visit."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings braucht er auch Ruhe. Vielleicht sollten wir nicht länger als zwei Stunden bleiben?", "However, he also needs rest. Maybe we shouldn't stay longer than two hours?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Zwei Stunden sind genug, und wir sollten auf die Besuchszeiten des Krankenhauses achten.", "Two hours are enough, and we should keep to the hospital's visiting hours."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um den Besuchsplan und frage die anderen Freunde.", "I'll take care of the visiting schedule and ask the other friends."]]], ["Person A", "Person A", [["Und ich übernehme die Spiele, die Filme und das Essen.", "And I'll do the games, the films and the food."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-bewerbung", "type": "plan", "title": "Tipps für ein Vorstellungsgespräch", "en": "Tips for a job interview", "task": "Ihr Freund hat bald ein wichtiges Vorstellungsgespräch. Überlegen Sie, welche Tipps Sie ihm für einen guten ersten Eindruck geben können.", "task_en": "Your friend has an important job interview soon. Think about what tips you can give him to make a good first impression.", "sections": [["Person A", "Person A", [["Hallo! Unser Freund Samir hat nächste Woche ein wichtiges Vorstellungsgespräch und ist sehr nervös.", "Hi! Our friend Samir has an important job interview next week and is very nervous."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir ihm helfen, sich gut vorzubereiten.", "In my opinion, we should help him prepare well."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Vorbereitung angeht, würde ich vorschlagen, dass er sich genau über die Firma informiert, weil der Chef bestimmt danach fragt.", "As for preparation, I'd suggest he finds out exactly about the company, because the boss will surely ask about it."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Kleidung betrifft, finde ich etwas Ordentliches und Passendes wichtig, denn der erste Eindruck zählt.", "As far as clothes are concerned, I think something neat and appropriate is important, because first impressions count."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Pünktlichkeit schlage ich vor, zehn Minuten früher da zu sein, damit er nicht gestresst ist.", "Regarding punctuality, I suggest being there ten minutes early so that he isn't stressed."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Fragen angeht, wäre es sinnvoll, dass er selbst zwei Fragen vorbereitet, weil das Interesse an der Stelle zeigt.", "As for questions, it would make sense for him to prepare two questions himself, because it shows interest in the job."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings ist er sehr nervös. Vielleicht üben wir das Gespräch vorher zusammen als Rollenspiel?", "However, he is very nervous. Maybe we could practise the interview together beforehand as a role play?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["So kann er typische Fragen üben und wird im echten Gespräch weniger nervös sein.", "That way he can practise typical questions and will be less nervous in the real interview."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um das Rollenspiel und spiele den Chef.", "I'll take care of the role play and play the boss."]]], ["Person A", "Person A", [["Und ich übernehme die Fragen über die Firma und helfe ihm bei der Kleidung.", "And I'll do the questions about the company and help him with his clothes."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-exkursion", "type": "plan", "title": "Eine Exkursion zu einem Museum", "en": "An excursion to a museum", "task": "Sie wollen mit Ihrem Sprachkurs eine Exkursion zu einem Museum im deutschsprachigen Raum machen, zum Beispiel zur Pinakothek der Moderne in München. Denken Sie an eine Führung und daran, was Sie sonst am Zielort unternehmen können.", "task_en": "You want to make an excursion with your language course to a museum in a German-speaking country, for example the Pinakothek der Moderne in Munich. Think about a guided tour and what else you can do at the destination.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, wollen wir mit unserem Sprachkurs eine Exkursion zu einem Museum machen.", "Hi! As you know, we want to go on an excursion to a museum with our language course."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir uns schnell auf ein Ziel einigen.", "In my opinion, we should quickly agree on a destination."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Ziel angeht, würde ich die Pinakothek der Moderne in München vorschlagen, weil sie sehr bekannt ist und moderne Kunst zeigt.", "As for the destination, I'd suggest the Pinakothek der Moderne in Munich, because it's very famous and shows modern art."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Anreise betrifft, finde ich den Zug am besten, denn für Gruppen gibt es günstige Tickets.", "As far as getting there is concerned, I think the train is best, because there are cheap group tickets."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Führung schlage ich eine Führung auf Deutsch vor, damit wir gleichzeitig unsere Sprache üben.", "Regarding the tour, I suggest a tour in German so that we practise the language at the same time."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Kosten angeht, wäre ein Gruppenrabatt im Museum sinnvoll, weil dann mehr Teilnehmer mitkommen können.", "As for costs, a group discount at the museum would make sense, because then more participants can come."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings ist ein Tag sehr kurz. Vielleicht besuchen wir am Nachmittag noch den Englischen Garten?", "However, one day is very short. Maybe we could also visit the English Garden in the afternoon?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Danach könnten wir noch in einem typischen bayerischen Restaurant zu Abend essen.", "Afterwards we could have dinner in a typical Bavarian restaurant."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Zugtickets.", "I'll take care of the train tickets."]]], ["Person A", "Person A", [["Und ich übernehme die Führung und das Programm am Nachmittag.", "And I'll do the tour and the afternoon programme."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-buchvorstellung", "type": "plan", "title": "Ein Buch in der Klasse vorstellen", "en": "Presenting a book in class", "task": "Sie sollen gemeinsam ein Buch in Ihrer Klasse vorstellen. Überlegen Sie, welches Buch Sie präsentieren, wie Sie die Präsentation strukturieren und wer welche Schwerpunkte übernimmt.", "task_en": "You are to present a book in your class together. Think about which book to present, how to structure the presentation and who takes on which parts.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, sollen wir zusammen ein Buch in unserer Klasse vorstellen.", "Hi! As you know, we are supposed to present a book together in our class."], ["Ich habe m
