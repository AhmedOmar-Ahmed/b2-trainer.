<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B2 Mündlich – Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f3ec; --card:#fffdf9; --ink:#1f1b16; --muted:#6f665b; --line:#e6ddd0;
  --accent:#8b2e2e; --accent-soft:#f3e3df; --ok:#2f6b4f; --ok-soft:#e1efe7; --hl:#ffe08a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.6}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:#211c17;color:#efe6d8;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:Fraunces,serif;font-size:22px;font-weight:700;margin:0 8px 4px}
.brand-sub{font-size:13px;color:#b9ab97;margin:0 8px 22px}
.topic-btn{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:12px;border-radius:10px;margin-bottom:4px}
.topic-btn:hover{background:#2e2721}
.topic-btn.active{background:#3a2f27;box-shadow:inset 3px 0 0 #e0a26b}
.topic-btn .t{font-weight:600;font-size:14.5px;display:block}
.topic-btn .p{font-size:12px;color:#b9ab97}
.bar{height:4px;background:#3d342c;border-radius:4px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#e0a26b;width:0;transition:width .3s}
.side-note{font-size:12.5px;color:#b9ab97;margin:22px 8px 0;line-height:1.5;border-top:1px solid #3a322b;padding-top:16px}
main{padding:32px clamp(16px,4vw,56px) 80px;max-width:980px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:Fraunces,serif;font-size:clamp(28px,4vw,40px);line-height:1.15;margin:6px 0 4px}
.h1-en{color:var(--muted);margin:0 0 20px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.btn{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:#cbbca8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#742424}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.vb{border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.vb.good{background:var(--ok-soft)}.vb.bad{background:#fff1d6;border:1px solid #f0c66b}.vb .icon-btn{margin-left:auto}
.tip{background:var(--accent-soft);border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:22px}
.section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px;transition:border-color .2s}
.section.done{border-color:#a9cbb8;background:#fbfefc}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}
.section.done .num{background:var(--ok-soft);color:var(--ok)}
.sec-title{font-family:Fraunces,serif;font-size:19px;font-weight:600;flex:1}
.sec-title small{display:block;font-family:Inter,sans-serif;font-size:12.5px;color:var(--muted);font-weight:400}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.icon-btn:hover{border-color:#cbbca8}
.done-btn.is{background:var(--ok);border-color:var(--ok);color:#fff}
.sent{margin:6px 0;font-size:17px;line-height:1.75}
.sent .say{border:0;background:none;color:var(--muted);font-size:14px;padding:0 4px;vertical-align:1px}
.sent .say:hover{color:var(--accent)}
.sent.q{color:var(--accent);font-weight:500}
.en{display:none;font-size:14px;color:var(--muted);margin:-2px 0 8px;font-style:italic}
.show-en .en{display:block}
.w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .15s}
.w:hover{background:var(--hl)}
.w.speaking{background:var(--hl)}
.redemittel{background:#211c17;color:#efe6d8;border-radius:16px;padding:22px;margin-top:28px}
.redemittel h3{font-family:Fraunces,serif;margin:0 0 12px;font-size:20px}
.rm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rm{background:#2e2721;border-radius:10px;padding:10px 12px;font-size:14px}
.rm b{display:block;color:#f3c99d;font-weight:600}
.rm span{color:#b9ab97;font-size:13px}
/* popup */
#pop{position:fixed;z-index:60;width:min(340px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:14px 16px;display:none}
#pop .pw{font-family:Fraunces,serif;font-size:22px;font-weight:700}
#pop .pg{font-size:16px;margin:2px 0 10px;color:var(--accent);font-weight:600}
#pop .pg.none{color:var(--muted);font-weight:400;font-size:14px}
#pop .ps{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
#pop .prow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#pop a{font-size:13px;color:var(--accent);font-weight:600;text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:999px}
#pop .x{position:absolute;right:10px;top:8px;border:0;background:none;font-size:18px;color:var(--muted)}
/* video player */
#player{position:fixed;inset:0;z-index:50;background:rgba(15,12,10,.92);display:none;align-items:center;justify-content:center;padding:16px}
#player.open{display:flex}
.pv{width:min(1100px,100%);}
.stage{position:relative;aspect-ratio:16/9;max-height:78vh;width:100%;border-radius:18px;overflow:hidden;background:radial-gradient(120% 120% at 0% 0%,#5a2a26 0%,#2a1d18 45%,#14100d 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:clamp(18px,5%,64px)}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 85% 90%,rgba(224,162,107,.25),transparent 70%);pointer-events:none}
.st-top{position:absolute;top:clamp(12px,3%,28px);left:clamp(18px,5%,64px);right:clamp(18px,5%,64px);display:flex;justify-content:space-between;align-items:center;font-size:clamp(11px,1.4vw,15px);color:#e7d6c4;z-index:2}
.st-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);padding:4px 12px;border-radius:999px}
.st-head{font-family:Fraunces,serif;font-size:clamp(16px,2.6vw,30px);color:#f3c99d;margin-bottom:clamp(8px,2%,20px);z-index:2;animation:rise .5s ease}
.st-text{font-size:clamp(18px,3.3vw,40px);line-height:1.4;font-weight:500;z-index:2;animation:rise .5s ease}
.st-text .w{padding:0 2px;border-radius:6px}
.st-text .w:hover{background:rgba(255,224,138,.25)}
.st-text .w.speaking{background:#ffe08a;color:#1f1b16}
.st-en{margin-top:clamp(8px,2%,18px);font-size:clamp(13px,1.8vw,20px);color:#cdbba7;font-style:italic;z-index:2}
.st-en.hide{visibility:hidden}
.st-timer{position:absolute;bottom:clamp(14px,4%,34px);right:clamp(18px,5%,64px);z-index:2;display:none;align-items:center;gap:10px;background:rgba(0,0,0,.35);padding:8px 14px;border-radius:999px;font-weight:600;font-size:clamp(13px,1.6vw,18px)}
.st-timer.show{display:flex}
.avatar{position:absolute;bottom:clamp(14px,4%,34px);left:clamp(18px,5%,64px);z-index:2;display:flex;align-items:center;gap:10px;font-size:clamp(11px,1.3vw,14px);color:#e7d6c4}
.av{width:clamp(30px,4vw,46px);height:clamp(30px,4vw,46px);border-radius:50%;background:linear-gradient(135deg,#e0a26b,#8b2e2e);position:relative}
.av::before,.av::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #e0a26b;opacity:0}
.talking .av::before{animation:ring 1.4s infinite}
.talking .av::after{animation:ring 1.4s .7s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.prog{height:5px;background:rgba(255,255,255,.12);border-radius:5px;margin:12px 0;overflow:hidden}
.prog i{display:block;height:100%;background:#e0a26b;width:0;transition:width .3s}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#efe6d8}
.cb{background:#2e2721;color:#efe6d8;border:1px solid #463b31;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.cb:hover{background:#3a2f27}
.cb.big{background:#e0a26b;color:#1f1b16;border-color:#e0a26b;min-width:110px}
.cb.on{background:#efe6d8;color:#1f1b16}
select.cb{appearance:auto;max-width:260px}
.spacer{flex:1}
.vnote{font-size:12.5px;color:#b9ab97;margin-top:10px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:relative;height:auto;padding:16px}
  #topics{display:flex;gap:6px;overflow-x:auto}
  .topic-btn{min-width:180px}
  .side-note{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">B2 Mündlich</div>
    <div class="brand-sub">Prüfungstraining · 17 Themen</div>
    <div id="topics"></div>
    <div class="side-note">💡 <b>Tipp:</b> Klicke auf jedes deutsche Wort, um die englische Bedeutung zu sehen.<br><br>🎧 Für die natürlichste Stimme öffne die Seite in <b>Microsoft Edge</b> (Stimmen „Katja“ / „Conrad“ Natural).</div>
  </aside>
  <main id="main"></main>
</div>

<div id="pop" role="dialog"><button class="x" onclick="hidePop()">×</button><div class="pw"></div><div class="pg"></div><div class="ps"></div><div class="prow"></div></div>

<div id="player">
  <div class="pv">
    <div class="stage" id="stage">
      <div class="st-top"><span class="st-chip" id="stTopic"></span><span class="st-chip" id="stCount"></span></div>
      <div class="st-head" id="stHead"></div>
      <div class="st-text" id="stText"></div>
      <div class="st-en" id="stEn"></div>
      <div class="avatar" id="avatar"><div class="av"></div><span id="avLabel">Sprecherin</span></div>
      <div class="st-timer" id="stTimer"><span id="stTimerLabel">Sprich jetzt</span><span id="stTimerNum">60</span></div>
    </div>
    <div class="prog"><i id="progBar"></i></div>
    <div class="ctrls">
      <button class="cb" onclick="P.prev()" title="Zurück">⏮</button>
      <button class="cb big" id="playBtn" onclick="P.toggle()">▶ Abspielen</button>
      <button class="cb" onclick="P.next()" title="Weiter">⏭</button>
      <button class="cb" id="modeBtn" onclick="P.cycleMode()">Modus: Lektion</button>
      <button class="cb" id="rateBtn" onclick="P.cycleRate()">Tempo 1×</button>
      <button class="cb on" id="enBtn" onclick="P.toggleEn()">EN-Untertitel</button>
      <select class="cb" id="voiceSel" onchange="P.setVoice(this.value)"></select>
      <span class="spacer"></span>
      <button class="cb" onclick="P.close()">✕ Schließen</button>
    </div>
    <div class="vnote" id="vnote"></div>
  </div>
</div>

eits bin ich der Ansicht, dass ein Verbot allein das Problem nicht lösen kann.", "On the other hand, I am of the view that a ban alone cannot solve the problem."], ["Jugendliche könnten solche Spiele trotzdem im Internet finden.", "Young people could still find such games on the internet."], ["Deshalb wäre es meiner Meinung nach sinnvoller, sie über die Risiken aufzuklären.", "That's why, in my opinion, it would make more sense to educate them about the risks."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Einfluss auf das Verhalten", "Influence on behaviour", [["Ein weiterer wichtiger Punkt ist, dass gewalttätige Spiele manche Jugendliche negativ beeinflussen könnten.", "Another important point is that violent games could influence some young people negatively."], ["Besonders wenn sie sehr viel Zeit damit verbringen, kann das problematisch werden.", "Especially if they spend a lot of time on it, that can become problematic."], ["Allerdings bedeutet das nicht, dass jeder Spieler automatisch aggressiv wird.", "However, that doesn't mean that every player automatically becomes aggressive."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Verantwortung der Eltern", "Parents' responsibility", [["Was die Verantwortung der Eltern betrifft, bin ich der Meinung, dass sie darauf achten sollten, welche Spiele ihre Kinder spielen.", "As far as the parents' responsibility is concerned, I believe they should pay attention to which games their children play."], ["Außerdem sollten sie klare Regeln für die Spielzeit festlegen und regelmäßig mit ihren Kindern sprechen.", "They should also set clear rules for playing time and talk to their children regularly."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Rolle der Schule", "Role of the school", [["Ich halte es für besonders wichtig, dass Schulen Jugendliche über die möglichen Folgen von Gewaltspielen informieren.", "I consider it especially important that schools inform young people about the possible consequences of violent games."], ["Zum Beispiel könnten Lehrer Workshops organisieren und gemeinsam mit den Schülern über Medien und Gewalt diskutieren.", "For example, teachers could organise workshops and discuss media and violence together with the students."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass Computerspiele für viele Menschen eine beliebte Freizeitbeschäftigung sind.", "From my own experience I can say that computer games are a popular leisure activity for many people."], ["Ich kenne auch Leute, die solche Spiele spielen und trotzdem freundlich und ruhig sind.", "I also know people who play such games and are still friendly and calm."], ["Deshalb glaube ich, dass man nicht alle Spieler gleich beurteilen sollte.", "That's why I believe that you shouldn't judge all players the same way."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Statt Gewaltspiele vollständig zu verbieten, würde ich vorschlagen, dass wir die Altersbeschränkungen besser kontrollieren.", "Instead of banning violent games completely, I would suggest that we check age restrictions better."], ["Außerdem könnten Eltern ihre Kinder motivieren, mehr Sport zu treiben oder Zeit mit Freunden zu verbringen.", "In addition, parents could motivate their children to do more sport or spend time with friends."], ["Auf diese Weise könnten Jugendliche ihre Freizeit abwechslungsreicher gestalten.", "In this way, young people could make their free time more varied."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Gewaltspiele sowohl positive als auch negative Seiten haben können.", "In summary, violent games can have both positive and negative sides."], ["Ich bin davon überzeugt, dass Aufklärung, klare Regeln und die Unterstützung der Eltern sinnvoller sind als ein vollständiges Verbot.", "I am convinced that education, clear rules and the support of the parents make more sense than a complete ban."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "rauchen", "title": "Wie entwickelt sich das Rauchen in Deutschland?", "en": "How is smoking developing in Germany?", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frage, wie sich das Rauchen in Deutschland entwickelt.", "The text is about how smoking is developing in Germany."], ["Zwar gibt es insgesamt weniger Raucher, aber Jugendliche fangen immer früher mit dem Rauchen an.", "Although there are fewer smokers overall, young people are starting to smoke earlier and earlier."], ["Gründe dafür sind zum Beispiel Gruppendruck, Werbung und Neugier.", "Reasons for this are, for example, peer pressure, advertising and curiosity."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach ist Rauchen eine der schädlichsten Gewohnheiten überhaupt.", "In my opinion, smoking is one of the most harmful habits of all."], ["Ich finde es besonders bedenklich, dass immer mehr Jugendliche damit anfangen.", "I find it especially worrying that more and more young people are starting."], ["Wie siehst du das?", "How do you see it?"]]], ["Warum Jugendliche rauchen", "Why young people smoke", [["Einerseits kann ich verstehen, dass Jugendliche erwachsen und cool wirken möchten.", "On the one hand, I can understand that young people want to seem grown-up and cool."], ["Außerdem wollen viele in ihrer Gruppe dazugehören und nicht als Außenseiter gelten.", "In addition, many want to belong to their group and not be seen as outsiders."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Gesundheitliche Folgen", "Health consequences", [["Andererseits darf man nicht vergessen, dass Rauchen schwere Krankheiten wie Lungenkrebs oder Herzprobleme verursachen kann.", "On the other hand, you must not forget that smoking can cause serious illnesses like lung cancer or heart problems."], ["Jedes Jahr sterben viele Menschen an den Folgen des Rauchens.", "Every year many people die from the consequences of smoking."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Einfluss von Werbung und Medien", "Influence of advertising and media", [["Ein weiterer wichtiger Punkt ist der Einfluss von Filmen und Werbung.", "Another important point is the influence of films and advertising."], ["Dort wirken Raucher oft schick, lässig und selbstbewusst.", "There, smokers often seem stylish, cool and self-confident."], ["In Wirklichkeit ist das jedoch nur eine Illusion.", "In reality, however, that is only an illusion."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Verantwortung der Eltern", "Parents' responsibility", [["Was die Rolle der Eltern betrifft, bin ich der Meinung, dass sie ein gutes Vorbild sein sollten.", "As far as the role of parents is concerned, I believe they should be a good role model."], ["Wenn Eltern selbst rauchen, ist es schwer, den Kindern das Rauchen zu verbieten.", "If parents smoke themselves, it is hard to forbid the children from smoking."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Rolle der Schule", "Role of the school", [["Ich halte es für sehr wichtig, dass Schulen früh über die Gefahren des Rauchens aufklären.", "I consider it very important that schools educate early about the dangers of smoking."], ["Zum Beispiel könnten Ärzte oder ehemalige Raucher in die Schule kommen und von ihren Erfahrungen erzählen.", "For example, doctors or former smokers could come to the school and talk about their experiences."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass es sehr schwer ist, mit dem Rauchen aufzuhören.", "From my own experience I can say that it is very hard to quit smoking."], ["Ich kenne Leute, die es mehrmals versucht haben und immer wieder rückfällig geworden sind.", "I know people who have tried several times and relapsed again and again."], ["Deshalb ist es am besten, gar nicht erst anzufangen.", "That's why it is best not to start in the first place."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Um das Problem zu lösen, würde ich vorschlagen, dass Zigaretten noch teurer werden und Werbung für Tabak komplett verboten wird.", "To solve the problem, I would suggest that cigarettes become even more expensive and tobacco advertising is completely banned."], ["Außerdem sollte der Verkauf an Jugendliche strenger kontrolliert werden.", "In addition, sales to young people should be controlled more strictly."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Rauchen viele Risiken und keine echten Vorteile hat.", "In summary, smoking has many risks and no real advantages."], ["Ich bin davon überzeugt, dass Aufklärung, gute Vorbilder und strenge Regeln am meisten helfen.", "I am convinced that education, good role models and strict rules help the most."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "hochzeit", "title": "Hochzeit nur zu zweit", "en": "A wedding for just two", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um ein Ehepaar, das ganz ohne Gäste geheiratet hat.", "The text is about a married couple who got married without any guests."], ["Christiane und Olaf Witte haben an der Nordseeküste geheiratet und nur etwa 1.800 Euro ausgegeben.", "Christiane and Olaf Witte got married on the North Sea coast and spent only about 1,800 euros."], ["Laut einer Umfrage wünschen sich viele Deutsche eine kleine und günstige Hochzeit.", "According to a survey, many Germans want a small and inexpensive wedding."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach sollte jedes Paar selbst entscheiden, wie es heiraten möchte.", "In my opinion, every couple should decide for themselves how they want to get married."], ["Ich persönlich finde eine kleine Hochzeit sehr romantisch, aber ich würde meine Familie gern dabeihaben.", "Personally, I find a small wedding very romantic, but I would like to have my family there."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile einer kleinen Hochzeit", "Advantages of a small wedding", [["Einerseits spart man sehr viel Geld, das man zum Beispiel für eine Wohnung oder eine schöne Reise nutzen kann.", "On the one hand, you save a lot of money that you can use, for example, for a flat or a nice trip."], ["Außerdem hat man weniger Stress bei der Planung.", "In addition, you have less stress with the planning."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile einer kleinen Hochzeit", "Disadvantages of a small wedding", [["Andererseits könnten Familie und Freunde enttäuscht oder sogar verletzt sein, wenn sie nicht eingeladen werden.", "On the other hand, family and friends could be disappointed or even hurt if they are not invited."], ["Eine Hochzeit ist schließlich auch ein Fest für die ganze Familie.", "After all, a wedding is also a celebration for the whole family."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Die Kosten einer Hochzeit", "The cost of a wedding", [["Ein weiterer wichtiger Punkt sind die Kosten.", "Another important point is the cost."], ["Eine große Hochzeit kann schnell mehr als 10.000 Euro kosten, und manche Paare nehmen dafür sogar einen Kredit auf.", "A big wedding can quickly cost more than 10,000 euros, and some couples even take out a loan for it."], ["Das halte ich nicht für sinnvoll.", "I don't think that is sensible."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Die Rolle der Familie", "The role of the family", [["Was die Familie betrifft, bin ich der Meinung, dass man die Eltern zumindest informieren sollte.", "As far as the family is concerned, I believe you should at least inform the parents."], ["Vielleicht kann man später eine kleine Feier mit der Familie organisieren.", "Maybe you can organise a small party with the family later."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Hochzeit in meinem Heimatland", "Weddings in my home country", [["In meinem Heimatland ist eine Hochzeit normalerweise ein sehr großes Fest mit vielen Gästen.", "In my home country, a wedding is usually a very big celebration with many guests."], ["Oft werden mehrere hundert Personen eingeladen, und die Feier dauert manchmal mehrere Tage.", "Often several hundred people are invited, and the celebration sometimes lasts several days."], ["Eine Hochzeit nur zu zweit wäre bei uns ziemlich ungewöhnlich.", "A wedding for just two would be quite unusual where I come from."], ["Wie ist das in deinem Heimatland?", "How is it in your home country?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass große Hochzeiten sehr schön, aber auch sehr anstrengend sind.", "From my own experience I can say that big weddings are very beautiful but also very exhausting."], ["Das Brautpaar hat oft kaum Zeit, den Tag selbst zu genießen.", "The bride and groom often hardly have time to enjoy the day themselves."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Kompromisse", "Solutions and compromises", [["Ich würde vorschlagen, einen Kompromiss zu finden, zum Beispiel eine kleine Feier nur mit der engsten Familie und den besten Freunden.", "I would suggest finding a compromise, for example a small party with only the closest family and best friends."], ["So spart man Geld, und niemand fühlt sich ausgeschlossen.", "That way you save money, and nobody feels left out."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass eine Hochzeit zu zweit sowohl Vorteile als auch Nachteile hat.", "In summary, a wedding for two has both advantages and disadvantages."], ["Ich bin davon überzeugt, dass nicht das Geld, sondern die Liebe das Wichtigste ist.", "I am convinced that the most important thing is not money but love."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "solarium", "title": "Solarium im Winter – Gut für die Gesundheit?", "en": "Tanning beds in winter – good for your health?", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frage, ob ein Solarium im Winter gut für die Gesundheit ist.", "The text is about whether a tanning bed in winter is good for your health."], ["Einerseits brauchen Menschen Sonnenlicht für ihr Wohlbefinden und für die Produktion von Vitamin D.", "On the one hand, people need sunlight for their well-being and for the production of vitamin D."], ["Andererseits warnen Ärzte, dass das künstliche Licht die Haut schädigen und sogar Hautkrebs auslösen kann.", "On the other hand, doctors warn that the artificial light can damage the skin and even cause skin cancer."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach ist ein Solarium nicht die beste Lösung für den Winter.", "In my opinion, a tanning bed is not the best solution for winter."], ["Ich denke, dass die Risiken für die Haut größer sind als der Nutzen.", "I think that the risks for the skin are greater than the benefit."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile des Solariums", "Advantages of the tanning bed", [["Einerseits kann ich verstehen, dass viele Menschen im Winter ins Solarium gehen.", "On the one hand, I can understand that many people go to a tanning salon in winter."], ["Das Licht kann die Stimmung verbessern und gegen Lustlosigkeit helfen.", "The light can improve your mood and help against listlessness."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile des Solariums", "Disadvantages of the tanning bed", [["Andererseits sind die Strahlen im Solarium oft sehr stark.", "On the other hand, the rays in a tanning bed are often very strong."], ["Sie können die Hautzellen schädigen, die Haut schneller altern lassen und das Risiko für Hautkrebs erhöhen.", "They can damage skin cells, make the skin age faster and increase the risk of skin cancer."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Das Schönheitsideal", "The beauty ideal", [["Ein weiterer wichtiger Punkt ist, dass die meisten Besucher das Solarium nur nutzen, um braun zu sein.", "Another important point is that most visitors only use the tanning bed to be tanned."], ["Braune Haut gilt bei vielen als schön und gesund.", "Many people regard tanned skin as beautiful and healthy."], ["Ich finde aber, dass Gesundheit wichtiger ist als Aussehen.", "But I think health is more important than appearance."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Kinder und Jugendliche", "Children and young people", [["Was Kinder und Jugendliche betrifft, bin ich der Meinung, dass sie auf keinen Fall ins Solarium gehen sollten, weil ihre Haut besonders empfindlich ist.", "As for children and teenagers, I believe they should under no circumstances use tanning beds, because their skin is particularly sensitive."], ["Deshalb finde ich das Verbot für Minderjährige richtig.", "That's why I think the ban for minors is right."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Alternativen im Winter", "Alternatives in winter", [["Ich halte es für sinnvoller, im Winter möglichst viel Zeit draußen zu verbringen, zum Beispiel bei einem Spaziergang in der Mittagszeit.", "I think it makes more sense to spend as much time outside as possible in winter, for example on a walk at lunchtime."], ["Außerdem kann man Vitamin D über die Ernährung oder nach Rücksprache mit dem Arzt als Tablette aufnehmen.", "You can also get vitamin D through your diet or, after consulting a doctor, as a tablet."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass der Winter in Deutschland sehr lang und dunkel sein kann.", "From my own experience I can say that winter in Germany can be very long and dark."], ["In meinem Heimatland scheint die Sonne viel öfter, deshalb musste ich mich erst daran gewöhnen.", "In my home country the sun shines much more often, so I had to get used to it first."], ["Sport und Treffen mit Freunden helfen mir dabei sehr.", "Sport and meeting friends help me a lot with that."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Tipps", "Solutions and tips", [["Wer trotzdem ins Solarium gehen möchte, sollte sich vorher von einem Arzt beraten lassen.", "Anyone who still wants to use a tanning bed should get advice from a doctor first."], ["Außerdem sollte man ein Gerät mit niedriger Strahlenbelastung wählen und nicht zu oft gehen.", "You should also choose a device with low radiation exposure and not go too often."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass ein Solarium zwar die Stimmung verbessern kann, aber auch ernste Risiken hat.", "In summary, a tanning bed can improve your mood, but it also has serious risks."], ["Ich bin davon überzeugt, dass frische Luft, Bewegung und eine gesunde Ernährung die bessere Wahl sind.", "I am convinced that fresh air, exercise and a healthy diet are the better choice."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "nahrung", "title": "Wie sinnvoll sind Nahrungsergänzungsmittel?", "en": "How useful are dietary supplements?", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frage, wie sinnvoll Nahrungsergänzungsmittel sind.", "The text is about how useful dietary supplements are."], ["Das Angebot an Vitaminen und Mineralstoffen in Form von Tabletten, Kapseln oder Pulver wird immer größer.", "The range of vitamins and minerals in the form of tablets, capsules or powder keeps getting bigger."], ["Viele Experten meinen jedoch, dass eine ausgewogene Ernährung völlig ausreicht.", "However, many experts think that a balanced diet is completely sufficient."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach brauchen die meisten gesunden Menschen keine Nahrungsergänzungsmittel.", "In my opinion, most healthy people don't need dietary supplements."], ["Ich denke, dass man mit frischem Obst und Gemüse alle wichtigen Nährstoffe bekommt.", "I think that with fresh fruit and vegetables you get all the important nutrients."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile", "Advantages", [["Einerseits können Nahrungsergänzungsmittel in bestimmten Situationen sinnvoll sein.", "On the one hand, dietary supplements can be useful in certain situations."], ["Zum Beispiel brauchen Veganer oft Vitamin B12, und Schwangere nehmen häufig Folsäure.", "For example, vegans often need vitamin B12, and pregnant women often take folic acid."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile", "Disadvantages", [["Andererseits sind diese Produkte oft sehr teuer.", "On the other hand, these products are often very expensive."], ["Außerdem können zu viele Vitamine sogar schädlich sein, wenn man sie in hoher Dosis nimmt.", "Moreover, too many vitamins can even be harmful if you take them in a high dose."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Stress und Zeitmangel", "Stress and lack of time", [["Ein weiterer wichtiger Punkt ist, dass viele Menschen keine Zeit haben, gesund zu kochen.", "Another important point is that many people don't have time to cook healthily."], ["Deshalb greifen sie lieber zu Tabletten.", "That's why they prefer to reach for pills."], ["Aber eine Pille kann eine ungesunde Lebensweise nicht ausgleichen.", "But a pill cannot make up for an unhealthy lifestyle."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Werbung und Industrie", "Advertising and industry", [["Was die Werbung betrifft, bin ich der Meinung, dass die Hersteller mit der Angst der Menschen viel Geld verdienen.", "As far as advertising is concerned, I believe the manufacturers earn a lot of money from people's fears."], ["Die Werbung verspricht oft mehr, als die Produkte halten können.", "The advertising often promises more than the products can deliver."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Die Rolle der Ärzte", "The role of doctors", [["Ich halte es für besonders wichtig, dass man vor der Einnahme mit einem Arzt spricht.", "I think it is especially important to talk to a doctor before taking them."], ["Ein Bluttest kann zeigen, ob einem wirklich ein Vitamin fehlt.", "A blood test can show whether you are really missing a vitamin."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass viele Menschen in Deutschland im Winter Vitamin D nehmen.", "From my own experience I can say that many people in Germany take vitamin D in winter."], ["Ich habe das auch einmal gemacht, nachdem mein Arzt einen Mangel festgestellt hatte.", "I did that once too, after my doctor had found a deficiency."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Statt viel Geld für Tabletten auszugeben, würde ich vorschlagen, mehr auf eine gesunde Ernährung zu achten.", "Instead of spending a lot of money on pills, I would suggest paying more attention to a healthy diet."], ["Man könnte zum Beispiel am Wochenende für die ganze Woche vorkochen.", "For example, you could cook ahead at the weekend for the whole week."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Nahrungsergänzungsmittel nur in bestimmten Fällen sinnvoll sind.", "In summary, dietary supplements only make sense in certain cases."], ["Ich bin davon überzeugt, dass eine ausgewogene Ernährung durch keine Tablette ersetzt werden kann.", "I am convinced that a balanced diet cannot be replaced by any pill."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "eauto", "title": "Elektroautos – Verkehrsmittel der näheren Zukunft?", "en": "Electric cars – the transport of the near future?", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frage, ob Elektroautos das Verkehrsmittel der Zukunft sind.", "The text is about whether electric cars are the means of transport of the future."], ["Der Autor nennt Vorteile wie die niedrigen Kosten pro Kilometer und die Umweltfreundlichkeit.", "The author names advantages like the low costs per kilometre and environmental friendliness."], ["Es gibt aber auch Nachteile, zum Beispiel den hohen Kaufpreis, die geringe Reichweite und die wenigen Ladestationen.", "But there are also disadvantages, for example the high purchase price, the short range and the few charging stations."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach gehört den Elektroautos die Zukunft, aber es gibt noch einige Probleme.", "In my opinion, the future belongs to electric cars, but there are still some problems."], ["Ich denke, dass sie heute vor allem für Menschen in der Stadt geeignet sind.", "I think that today they are mainly suitable for people in the city."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile von Elektroautos", "Advantages of electric cars", [["Einerseits sind Elektroautos umweltfreundlich, weil sie keine schädlichen Abgase produzieren.", "On the one hand, electric cars are environmentally friendly because they don't produce harmful exhaust fumes."], ["Außerdem sind sie sehr leise, und die Kosten für Strom, Steuer und Versicherung sind niedriger.", "They are also very quiet, and the costs for electricity, tax and insurance are lower."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile von Elektroautos", "Disadvantages of electric cars", [["Andererseits ist der Kaufpreis eines Elektroautos immer noch sehr hoch.", "On the other hand, the purchase price of an electric car is still very high."], ["Zudem dauert das Aufladen oft mehrere Stunden, und die Akkus halten nur einige Jahre.", "In addition, charging often takes several hours, and the batteries only last a few years."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Sicherheit im Verkehr", "Road safety", [["Ein weiterer wichtiger Punkt ist die Sicherheit.", "Another important point is safety."], ["Weil Elektroautos fast keine Geräusche machen, könnten Fußgänger und Radfahrer sie überhören.", "Because electric cars make almost no noise, pedestrians and cyclists might not hear them."], ["Das könnte zu mehr Unfällen führen.", "That could lead to more accidents."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Die Rolle des Staates", "The role of the state", [["Was den Staat betrifft, bin ich der Meinung, dass er Elektroautos stärker fördern sollte.", "As far as the state is concerned, I believe it should support electric cars more."], ["Zum Beispiel könnte er mehr Ladestationen bauen und den Kauf finanziell unterstützen.", "For example, it could build more charging stations and support the purchase financially."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Stadt und Land", "City and countryside", [["Ich halte es für wichtig, zwischen Stadt und Land zu unterscheiden.", "I think it is important to distinguish between city and countryside."], ["In der Stadt fährt man meistens kurze Strecken, deshalb reicht die Reichweite völlig aus.", "In the city you mostly drive short distances, so the range is completely sufficient."], ["Auf dem Land oder bei langen Reisen ist ein Elektroauto dagegen oft noch unpraktisch.", "In the countryside or on long journeys, however, an electric car is often still impractical."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass man in Deutschland immer mehr Elektroautos auf den Straßen sieht.", "From my own experience I can say that you see more and more electric cars on the roads in Germany."], ["Ein Bekannter von mir fährt seit zwei Jahren ein Elektroauto und ist sehr zufrieden, weil er zu Hause laden kann.", "An acquaintance of mine has been driving an electric car for two years and is very satisfied because he can charge at home."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Statt nur auf Elektroautos zu setzen, würde ich vorschlagen, auch Bus und Bahn auszubauen.", "Instead of relying only on electric cars, I would suggest also expanding buses and trains."], ["Außerdem könnte man in der Stadt öfter mit dem Fahrrad fahren.", "In addition, people could cycle more often in the city."], ["So würde man die Umwelt noch mehr schonen.", "That way the environment would be protected even more."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Elektroautos viele Vorteile haben, aber noch nicht perfekt sind.", "In summary, electric cars have many advantages but are not perfect yet."], ["Ich bin davon überzeugt, dass sie in Zukunft immer wichtiger werden, wenn Preise sinken und es mehr Ladestationen gibt.", "I am convinced that they will become more and more important in the future if prices fall and there are more charging stations."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "rente75", "title": "Arbeiten bis 75 – eine utopische Vorstellung?", "en": "Working until 75 – a utopian idea?", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frage, ob man in Deutschland bis 75 arbeiten sollte.", "The text is about whether people in Germany should work until 75."], ["Die Menschen leben heute viel länger und bekommen deshalb auch viel länger Rente, sodass das Rentensystem auf Dauer kaum finanzierbar ist.", "People live much longer today and therefore receive a pension for much longer, so the pension system can hardly be financed in the long run."], ["Viele Experten schlagen deshalb ein flexibles Rentenalter vor, aber es gibt auch Kritiker.", "Many experts therefore suggest a flexible retirement age, but there are also critics."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach ist Arbeiten bis 75 für die meisten Menschen keine realistische Lösung.", "In my opinion, working until 75 is not a realistic solution for most people."], ["Ich denke, dass viele Berufe körperlich zu anstrengend sind, um so lange zu arbeiten.", "I think many jobs are physically too demanding to work that long."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile eines späteren Rentenalters", "Advantages of a later retirement age", [["Einerseits kann ich verstehen, dass der Staat das Rentenalter erhöhen möchte, weil die Lebenserwartung steigt.", "On the one hand, I can understand that the state wants to raise the retirement age because life expectancy is rising."], ["Außerdem könnten ältere Menschen ihr Wissen an die Jüngeren weitergeben und sich noch gebraucht fühlen.", "In addition, older people could pass on their knowledge to younger people and still feel needed."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile eines späteren Rentenalters", "Disadvantages of a later retirement age", [["Andererseits haben ältere Arbeitnehmer es schon heute schwer, eine Stelle zu finden.", "On the other hand, older employees already find it hard to get a job today."], ["Zudem steigt ab 65 das Risiko für Krankheiten deutlich, auch wenn die Menschen länger gesund bleiben.", "Moreover, the risk of illness rises significantly from 65, even if people stay healthy longer."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Unterschiedliche Berufe", "Different jobs", [["Ein weiterer wichtiger Punkt ist, dass nicht jeder Beruf gleich ist.", "Another important point is that not every job is the same."], ["Ein Professor kann vielleicht bis 75 arbeiten, aber für einen Bauarbeiter oder eine Krankenschwester ist das kaum möglich.", "A professor might be able to work until 75, but for a construction worker or a nurse that is hardly possible."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Ein flexibles Rentenalter", "A flexible retirement age", [["Was das flexible Rentenalter betrifft, bin ich der Meinung, dass das eine gute Idee ist.", "As far as a flexible retirement age is concerned, I believe it is a good idea."], ["Jeder sollte selbst entscheiden können, wann er in Rente geht, mit entsprechenden Zuschlägen oder Abschlägen.", "Everyone should be able to decide for themselves when to retire, with corresponding bonuses or reductions."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Rente in meinem Heimatland", "Retirement in my home country", [["In meinem Heimatland gehen die Menschen meistens früher in Rente als in Deutschland.", "In my home country, people usually retire earlier than in Germany."], ["Außerdem kümmern sich dort oft die Kinder um ihre Eltern, wenn diese alt sind.", "In addition, children there often take care of their parents when they are old."], ["Wie ist das in deinem Heimatland?", "How is it in your home country?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass viele ältere Menschen gern aktiv bleiben möchten.", "From my own experience, I can say that many older people would like to stay active."], ["Ich kenne zum Beispiel einen Rentner, der noch ein paar Stunden pro Woche arbeitet, weil es ihm Spaß macht.", "For example, I know a pensioner who still works a few hours a week because he enjoys it."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Statt das Rentenalter für alle auf 75 zu erhöhen, würde ich vorschlagen, Teilzeitmodelle für ältere Arbeitnehmer anzubieten.", "Instead of raising the retirement age to 75 for everyone, I would suggest offering part-time models for older employees."], ["Außerdem sollte man mehr in die Gesundheit am Arbeitsplatz investieren und die private Altersvorsorge fördern.", "In addition, more should be invested in health at the workplace, and private pension provision should be supported."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass das Rentensystem dringend reformiert werden muss.", "In summary, the pension system urgently needs to be reformed."], ["Ich bin davon überzeugt, dass ein flexibles Modell gerechter ist als ein festes Rentenalter von 75 für alle.", "I am convinced that a flexible model is fairer than a fixed retirement age of 75 for everyone."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "haustausch", "title": "Haustausch – Urlaub im fremden Zuhause", "en": "House swap – a holiday in someone else's home", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um den Haustausch als Urlaubsform.", "The text is about house swapping as a type of holiday."], ["Dabei wohnen zwei Familien während des Urlaubs gegenseitig in ihren Häusern oder Wohnungen.", "Two families live in each other's houses or flats during the holiday."], ["Der Autor nennt Vorteile wie niedrige Kosten und das Kennenlernen einer anderen Kultur, aber auch Nachteile wie fehlendes Vertrauen und rechtliche Probleme.", "The author names advantages such as low costs and getting to know another culture, but also disadvantages such as lack of trust and legal problems."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach ist ein Haustausch eine interessante Idee, aber nicht für jeden geeignet.", "In my opinion, a house swap is an interesting idea, but not suitable for everyone."], ["Ich persönlich hätte ein Problem damit, fremde Menschen in meiner Wohnung wohnen zu lassen.", "Personally, I would have a problem letting strangers live in my flat."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile eines Haustauschs", "Advantages of a house swap", [["Einerseits spart man viel Geld, weil man nichts für ein Hotel bezahlen muss.", "On the one hand, you save a lot of money because you don't have to pay for a hotel."], ["Außerdem kann man den Ferienort so erleben, als würde man selbst dort wohnen, und die Kultur besser kennenlernen.", "In addition, you can experience the holiday destination as if you lived there yourself, and get to know the culture better."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile eines Haustauschs", "Disadvantages of a house swap", [["Andererseits weiß man nie genau, was einen erwartet.", "On the other hand, you never know exactly what to expect."], ["Vielleicht ist die Wohnung schmutzig oder ganz anders als auf den Fotos.", "Maybe the flat is dirty or completely different from the photos."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Vertrauen", "Trust", [["Ein weiterer wichtiger Punkt ist das Vertrauen.", "Another important point is trust."], ["Man gibt einer fremden Person den Schlüssel zu seinem Zuhause und zu seinen persönlichen Sachen.", "You give a stranger the key to your home and your personal things."], ["Ohne großes Vertrauen funktioniert ein Haustausch nicht.", "Without a lot of trust, a house swap doesn't work."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Rechtliche Probleme", "Legal problems", [["Was die rechtliche Seite betrifft, bin ich der Meinung, dass das der größte Nachteil ist.", "As far as the legal side is concerned, I believe that is the biggest disadvantage."], ["Weil es meistens keinen Vertrag gibt, ist unklar, wer bezahlt, wenn etwas kaputtgeht.", "Because there is usually no contract, it is unclear who pays if something breaks."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Tipps für einen Haustausch", "Tips for a house swap", [["Ich halte es für sehr wichtig, dass man sich vorher gut informiert.", "I think it is very important to get good information beforehand."], ["Zum Beispiel sollte man Fotos verlangen, ausführlich telefonieren und klare Regeln schriftlich festlegen.", "For example, you should ask for photos, have a detailed phone call and set clear rules in writing."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass ich im Urlaub lieber in einem Hotel oder einer Ferienwohnung übernachte.", "From my own experience, I can say that on holiday I prefer to stay in a hotel or a holiday flat."], ["Dort habe ich einen Ansprechpartner, wenn es ein Problem gibt.", "There I have a contact person if there is a problem."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Ich würde vorschlagen, dass die Internetportale die Tauschpartner besser prüfen und Musterverträge anbieten.", "I would suggest that the internet portals check the swap partners better and offer sample contracts."], ["Außerdem könnte man eine Versicherung für mögliche Schäden abschließen.", "In addition, you could take out insurance for possible damage."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass ein Haustausch günstig und spannend sein kann, aber auch Risiken hat.", "In summary, a house swap can be cheap and exciting, but it also has risks."], ["Ich bin davon überzeugt, dass er nur mit Vertrauen, Menschenkenntnis und klaren Regeln funktioniert.", "I am convinced that it only works with trust, a good knowledge of people and clear rules."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "schule", "title": "Ist Schulqualität messbar?", "en": "Can school quality be measured?", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frage, ob man die Qualität von Schulen messen kann.", "The text is about whether the quality of schools can be measured."], ["In Deutschland gibt es viele Tests wie PISA oder Ländervergleiche, die die Leistungen der Schüler in Fächern wie Deutsch und Mathematik prüfen.", "In Germany there are many tests like PISA or comparisons between the federal states that check students' performance in subjects like German and maths."], ["Kritiker meinen jedoch, dass solche Tests nur einen kleinen Teil der Schulqualität zeigen.", "However, critics believe that such tests show only a small part of school quality."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach kann man Schulqualität nur teilweise messen.", "In my opinion, school quality can only be partly measured."], ["Ich denke, dass Tests zwar nützlich sind, aber nicht alles zeigen, was eine gute Schule ausmacht.", "I think tests are useful, but they don't show everything that makes a good school."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile von Tests", "Advantages of tests", [["Einerseits zeigen Tests die Stärken und Schwächen des Bildungssystems.", "On the one hand, tests show the strengths and weaknesses of the education system."], ["Außerdem kann man die Ergebnisse vergleichen und die Schulen gezielt verbessern.", "In addition, you can compare the results and improve schools in a targeted way."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile von Tests", "Disadvantages of tests", [["Andererseits achten Lehrer dann oft nur noch auf die Testergebnisse in wenigen Fächern.", "On the other hand, teachers then often only pay attention to test results in a few subjects."], ["Kunst, Musik oder Sport werden dabei weniger wichtig genommen.", "Art, music or sport are taken less seriously as a result."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Was macht eine gute Schule aus?", "What makes a good school?", [["Ein weiterer wichtiger Punkt ist die Frage, was eine gute Schule eigentlich ausmacht.", "Another important point is the question of what actually makes a good school."], ["Für mich gehören nicht nur gute Noten dazu, sondern auch Toleranz, Teamfähigkeit und ein gutes Klima in der Klasse.", "For me, that includes not only good grades but also tolerance, teamwork and a good atmosphere in the class."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Schwächere Schüler", "Weaker students", [["Was schwächere Schüler betrifft, bin ich der Meinung, dass sie besondere Unterstützung brauchen.", "As far as weaker students are concerned, I believe they need special support."], ["Ein Test zeigt aber nicht, ob eine Schule diesen Schülern wirklich hilft.", "But a test doesn't show whether a school really helps these students."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Die Rolle der Lehrer", "The role of teachers", [["Ich halte es für besonders wichtig, dass Lehrer motiviert sind und gut erklären können.", "I think it is especially important that teachers are motivated and can explain things well."], ["Ein guter Lehrer kann Schüler für ein Fach begeistern, und das kann kein Test messen.", "A good teacher can inspire students for a subject, and no test can measure that."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass ich mich an meine Lieblingslehrer viel besser erinnere als an meine Noten.", "From my own experience, I can say that I remember my favourite teachers much better than my grades."], ["Sie haben mir nicht nur Wissen vermittelt, sondern auch Selbstvertrauen gegeben.", "They not only taught me knowledge but also gave me self-confidence."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Ich würde vorschlagen, dass man neben Tests auch Schüler und Eltern regelmäßig befragt.", "I would suggest that, besides tests, students and parents are also surveyed regularly."], ["So könnte man auch erfahren, ob sich die Schüler an ihrer Schule wohlfühlen.", "That way you could also find out whether the students feel comfortable at their school."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Tests ein nützliches Werkzeug sind, aber nicht das ganze Bild zeigen.", "In summary, tests are a useful tool but don't show the whole picture."], ["Ich bin davon überzeugt, dass eine gute Schule mehr ist als gute Testergebnisse.", "I am convinced that a good school is more than good test results."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "trinkgeld", "title": "Trinkgeld geben", "en": "Giving tips", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um das Thema Trinkgeld.", "The text is about tipping."], ["In Deutschland ist es üblich, zum Beispiel im Restaurant, im Taxi oder beim Friseur Trinkgeld zu geben.", "In Germany it is common to give a tip, for example in a restaurant, in a taxi or at the hairdresser."], ["Der Autor fragt, warum man für eine Dienstleistung, die man sowieso bezahlt, noch extra Geld geben sollte.", "The author asks why you should give extra money for a service that you pay for anyway."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach ist Trinkgeld eine schöne Geste, um sich für guten Service zu bedanken.", "In my opinion, a tip is a nice gesture to say thank you for good service."], ["Ich denke aber, dass es freiwillig bleiben sollte.", "But I think it should remain voluntary."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile des Trinkgelds", "Advantages of tipping", [["Einerseits zeigt man mit einem Trinkgeld Anerkennung für freundliche und kompetente Arbeit.", "On the one hand, a tip shows appreciation for friendly and competent work."], ["Außerdem motiviert es die Angestellten, sich Mühe zu geben.", "In addition, it motivates the employees to make an effort."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile des Trinkgelds", "Disadvantages of tipping", [["Andererseits verdienen manche Angestellte so wenig, dass sie vom Trinkgeld abhängig sind.", "On the other hand, some employees earn so little that they depend on tips."], ["Das finde ich ungerecht, denn der Arbeitgeber sollte einen fairen Lohn bezahlen.", "I find that unfair, because the employer should pay a fair wage."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Wer bekommt Trinkgeld?", "Who gets a tip?", [["Ein weiterer wichtiger Punkt ist, dass es oft schwer nachvollziehbar ist, wer Trinkgeld bekommt.", "Another important point is that it is often hard to understand who gets a tip."], ["Die Kellnerin bekommt zum Beispiel eins, die Stewardess im Flugzeug aber nicht.", "The waitress gets one, for example, but the flight attendant on the plane does not."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Wie viel Trinkgeld?", "How much to tip?", [["Was die Höhe des Trinkgelds betrifft, bin ich der Meinung, dass etwa fünf bis zehn Prozent angemessen sind.", "As far as the amount of the tip is concerned, I believe about five to ten percent is appropriate."], ["Wer schlecht oder unfreundlich bedient wurde, hat aber auch das Recht, kein Trinkgeld zu geben.", "But anyone who was served badly or unkindly also has the right not to give a tip."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Trinkgeld in meinem Heimatland", "Tipping in my home country", [["In meinem Heimatland ist Trinkgeld ebenfalls üblich, aber die Regeln sind anders als in Deutschland.", "In my home country tipping is also common, but the rules are different from Germany."], ["Deshalb ist es gut, sich vor einer Reise über die Gewohnheiten im jeweiligen Land zu informieren.", "That's why it's good to find out about the customs in the respective country before a trip."], ["Wie ist das in deinem Heimatland?", "How is it in your home country?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass ich am Anfang in Deutschland unsicher war, wie viel Trinkgeld ich geben sollte.", "From my own experience, I can say that at the beginning in Germany I was unsure how much to tip."], ["Inzwischen runde ich im Restaurant meistens auf und sage dem Kellner den Betrag direkt.", "Now I usually round up in restaurants and tell the waiter the amount directly."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Ich würde vorschlagen, dass die Angestellten einen höheren Grundlohn bekommen.", "I would suggest that employees get a higher basic wage."], ["Dann wäre das Trinkgeld wirklich nur ein kleines Extra und kein fester Teil des Lohns.", "Then the tip would really be just a small extra and not a fixed part of the wage."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Trinkgeld eine gute Tradition ist, aber auch Probleme hat.", "In summary, tipping is a good tradition, but it also has problems."], ["Ich bin davon überzeugt, dass es freiwillig bleiben und von der Qualität des Service abhängen sollte.", "I am convinced that it should remain voluntary and depend on the quality of the service."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "wohnen", "title": "Stadtwohnung oder Haus im Grünen", "en": "City flat or house in the countryside", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frage, ob man lieber in einer Stadtwohnung oder in einem Haus im Grünen wohnen möchte.", "The text is about whether people prefer to live in a city flat or in a house in the countryside."], ["Junge Singles und Paare ohne Kinder entscheiden sich oft für die Stadt, weil dort Arbeit, Kultur und Freizeitangebote in der Nähe sind.", "Young singles and couples without children often choose the city because work, culture and leisure activities are nearby."], ["Familien mit Kindern wünschen sich dagegen oft ein eigenes Haus mit Garten, aber das hat auch Folgen für die Umwelt.", "Families with children, on the other hand, often want their own house with a garden, but that also has consequences for the environment."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach hängt die Entscheidung von der Lebenssituation ab.", "In my opinion, the decision depends on your life situation."], ["Ich persönlich würde mit Kindern lieber am Stadtrand wohnen, wo es ruhig ist, aber die Stadt trotzdem nah ist.", "Personally, with children I would prefer to live on the outskirts, where it is quiet but the city is still close."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile der Stadt", "Advantages of the city", [["Einerseits hat man in der Stadt kurze Wege zur Arbeit, zur Schule und zum Einkaufen.", "On the one hand, in the city you have short distances to work, school and shopping."], ["Außerdem gibt es viele kulturelle Angebote und gute öffentliche Verkehrsmittel, sodass man oft kein Auto braucht.", "In addition, there are many cultural offerings and good public transport, so you often don't need a car."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Vorteile des Hauses im Grünen", "Advantages of a house in the countryside", [["Andererseits ist das Leben auf dem Land ruhiger und gesünder, ohne Lärm und Abgase.", "On the other hand, life in the countryside is quieter and healthier, without noise and exhaust fumes."], ["Die Kinder können frei im Garten spielen, und man hat mehr Platz.", "The children can play freely in the garden, and you have more space."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Folgen für die Umwelt", "Consequences for the environment", [["Ein weiterer wichtiger Punkt ist die Umwelt.", "Another important point is the environment."], ["Für neue Häuser werden Wiesen und Wälder bebaut, und die Natur wird zerstört.", "Meadows and forests are built on for new houses, and nature is destroyed."], ["Außerdem braucht man auf dem Land oft zwei Autos, was den Verkehr erhöht.", "In addition, you often need two cars in the countryside, which increases traffic."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Die Kinder", "The children", [["Was die Kinder betrifft, bin ich der Meinung, dass das Leben auf dem Land nicht immer so frei ist, wie man denkt.", "As far as the children are concerned, I believe life in the countryside is not always as free as people think."], ["Oft müssen die Eltern sie überallhin fahren, zum Beispiel zum Sport, zur Musikschule oder zu Freunden.", "The parents often have to drive them everywhere, for example to sport, music school or to friends."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Die Kosten", "The costs", [["Ich halte es für wichtig, auch an die Kosten zu denken.", "I think it is important to also think about the costs."], ["In der Stadt sind die Mieten sehr hoch, aber auf dem Land kommen die Kosten für das Auto und die langen Fahrten dazu.", "In the city the rents are very high, but in the countryside there are extra costs for the car and the long journeys."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass es in deutschen Großstädten sehr schwer ist, eine bezahlbare Wohnung zu finden.", "From my own experience, I can say that it is very hard to find an affordable flat in large German cities."], ["Trotzdem gefällt mir das Leben in der Stadt, weil alles schnell erreichbar ist.", "Nevertheless, I like living in the city because everything can be reached quickly."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Ich würde vorschlagen, dass Städte mehr grüne Flächen und familienfreundliche Wohnungen schaffen.", "I would suggest that cities create more green spaces and family-friendly flats."], ["Außerdem sollte man auf dem Land die Busverbindungen verbessern, damit man weniger auf das Auto angewiesen ist.", "In addition, bus connections in the countryside should be improved so that people are less dependent on the car."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass beide Wohnformen Vor- und Nachteile haben.", "In summary, both ways of living have advantages and disadvantages."], ["Ich bin davon überzeugt, dass jeder die Lösung wählen sollte, die am besten zu seiner Familie und seinem Alltag passt.", "I am convinced that everyone should choose the solution that best suits their family and everyday life."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "frauenquote", "title": "Gleiche Chancen für Männer und Frauen – per Gesetz geregelt", "en": "Equal opportunities for men and women – regulated by law", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frauenquote und die Frage, ob gleiche Chancen für Männer und Frauen per Gesetz geregelt werden sollten.", "The text is about the women's quota and whether equal opportunities for men and women should be regulated by law."], ["Die Frauenquote bedeutet, dass bei gleicher Qualifikation eine Frau eingestellt werden muss, wenn in einem Bereich weniger als die Hälfte der Beschäftigten Frauen sind.", "The women's quota means that, with equal qualifications, a woman must be hired if less than half of the employees in an area are women."], ["Befürworter sagen, dass Frauen im Beruf immer noch benachteiligt werden, aber Kritiker befürchten, dass die Qualifikation weniger wichtig wird.", "Supporters say women are still disadvantaged at work, but critics fear that qualifications will become less important."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach sollten Männer und Frauen auf jeden Fall die gleichen Chancen haben.", "In my opinion, men and women should definitely have the same opportunities."], ["Ich denke, dass eine Frauenquote helfen kann, aber allein nicht ausreicht.", "I think a women's quota can help, but on its own it is not enough."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile der Frauenquote", "Advantages of the women's quota", [["Einerseits sorgt die Quote dafür, dass mehr Frauen in Führungspositionen und in die Politik kommen.", "On the one hand, the quota ensures that more women get into leadership positions and politics."], ["Außerdem können diese Frauen ein Vorbild für junge Mädchen sein.", "In addition, these women can be a role model for young girls."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile der Frauenquote", "Disadvantages of the women's quota", [["Andererseits könnten manche Menschen denken, dass eine Frau ihre Stelle nur wegen der Quote bekommen hat.", "On the other hand, some people might think a woman only got her job because of the quota."], ["Das wäre unfair gegenüber Frauen, die sehr gut qualifiziert sind.", "That would be unfair to women who are very well qualified."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Gleiche Bezahlung", "Equal pay", [["Ein weiterer wichtiger Punkt ist die Bezahlung.", "Another important point is pay."], ["Frauen arbeiten oft in schlechter bezahlten Berufen und verdienen für die gleiche Arbeit manchmal weniger als Männer.", "Women often work in lower-paid jobs and sometimes earn less than men for the same work."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Familie und Beruf", "Family and work", [["Was Familie und Beruf betrifft, bin ich der Meinung, dass sich Väter und Mütter die Elternzeit teilen sollten.", "As far as family and work are concerned, I believe fathers and mothers should share parental leave."], ["Dann hätten Arbeitgeber weniger Angst, eine Frau einzustellen, weil sie vielleicht schwanger wird.", "Then employers would be less afraid to hire a woman because she might get pregnant."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Die Situation in meinem Heimatland", "The situation in my home country", [["In meinem Heimatland hat sich die Situation der Frauen in den letzten Jahren verbessert.", "In my home country, the situation of women has improved in recent years."], ["Immer mehr Frauen studieren und arbeiten, aber in Führungspositionen sind sie immer noch selten.", "More and more women study and work, but they are still rare in leadership positions."], ["Wie ist das in deinem Heimatland?", "How is it in your home country?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass Frauen oft genauso gut oder sogar besser qualifiziert sind als Männer.", "From my own experience, I can say that women are often just as well or even better qualified than men."], ["Trotzdem habe ich erlebt, dass sie bei Beförderungen manchmal übersehen werden.", "Nevertheless, I have seen them sometimes overlooked for promotions."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Neben der Quote würde ich vorschlagen, mehr Kitaplätze zu schaffen und flexible Arbeitszeiten anzubieten.", "Besides the quota, I would suggest creating more childcare places and offering flexible working hours."], ["Außerdem sollten Gehälter transparenter sein, damit man ungleiche Bezahlung erkennen kann.", "In addition, salaries should be more transparent so that unequal pay can be recognised."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass ein Gesetz wichtig ist, aber nicht alle Probleme lösen kann.", "In summary, a law is important but cannot solve all problems."], ["Ich bin davon überzeugt, dass sich die Gleichberechtigung auch in den Köpfen der Menschen durchsetzen muss.", "I am convinced that equality also has to take hold in people's minds."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "tattoo", "title": "Tattoo – Schmuck für die Ewigkeit", "en": "Tattoos – jewellery for eternity", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um Tätowierungen, die in Deutschland immer beliebter werden.", "The text is about tattoos, which are becoming more and more popular in Germany."], ["Viele Prominente wie Fußballspieler und Musiker haben Tattoos, und heute gibt es etwa 5.000 Tattoostudios in Deutschland.", "Many celebrities such as footballers and musicians have tattoos, and today there are about 5,000 tattoo studios in Germany."], ["Der Autor warnt aber, dass man die Entscheidung gut überlegen sollte, weil ein Tattoo für immer bleibt.", "But the author warns that you should think the decision over carefully, because a tattoo stays forever."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach muss jeder selbst entscheiden, ob er ein Tattoo haben möchte.", "In my opinion, everyone has to decide for themselves whether they want a tattoo."], ["Ich persönlich würde mir kein Tattoo machen lassen, weil sich der Geschmack mit der Zeit ändern kann.", "Personally, I wouldn't get a tattoo, because your taste can change over time."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile eines Tattoos", "Advantages of a tattoo", [["Einerseits kann ein Tattoo eine schöne Möglichkeit sein, seine Persönlichkeit zu zeigen.", "On the one hand, a tattoo can be a nice way to show your personality."], ["Außerdem erinnert es vielleicht an einen wichtigen Menschen oder ein besonderes Erlebnis.", "In addition, it might remind you of an important person or a special experience."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile eines Tattoos", "Disadvantages of a tattoo", [["Andererseits ist ein Tattoo eine Entscheidung für das ganze Leben.", "On the other hand, a tattoo is a decision for your whole life."], ["Was man mit zwanzig schön findet, gefällt einem mit fünfzig vielleicht gar nicht mehr.", "What you find beautiful at twenty, you might not like at all at fifty."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Tattoos im Beruf", "Tattoos at work", [["Ein weiterer wichtiger Punkt ist der Beruf.", "Another important point is your job."], ["In manchen Berufen, zum Beispiel in einer Bank oder bei der Polizei, sind sichtbare Tattoos nicht gern gesehen.", "In some jobs, for example in a bank or with the police, visible tattoos are not welcome."], ["Deshalb sollte man eine Körperstelle wählen, die man mit Kleidung bedecken kann.", "That's why you should choose a part of the body that can be covered by clothing."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Das richtige Motiv", "The right design", [["Was das Motiv betrifft, bin ich der Meinung, dass man keine Namen tätowieren lassen sollte.", "As far as the design is concerned, I believe you shouldn't get names tattooed."], ["Wenn die Beziehung zu Ende geht, hat man ein großes Problem.", "If the relationship ends, you have a big problem."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Gesundheit und Entfernung", "Health and removal", [["Ich halte es für wichtig, dass man ein gutes und sauberes Tattoostudio wählt, weil es sonst gesundheitliche Risiken gibt.", "I think it's important to choose a good and clean tattoo studio, because otherwise there are health risks."], ["Außerdem ist die Entfernung mit dem Laser teuer, langwierig und schmerzhaft.", "In addition, laser removal is expensive, lengthy and painful."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass in Deutschland viel mehr Menschen Tattoos haben als in meinem Heimatland.", "From my own experience, I can say that many more people in Germany have tattoos than in my home country."], ["Ich kenne auch jemanden, der sein Tattoo heute bereut.", "I also know someone who regrets their tattoo today."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Ich würde vorschlagen, dass man mindestens ein Jahr über das Motiv nachdenkt, bevor man sich tätowieren lässt.", "I would suggest thinking about the design for at least a year before getting a tattoo."], ["Wer unsicher ist, kann zuerst ein Tattoo zum Abwaschen oder ein Henna-Tattoo ausprobieren.", "Anyone who is unsure can first try a wash-off tattoo or a henna tattoo."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Tattoos heute gesellschaftlich akzeptiert sind, aber gut überlegt sein müssen.", "In summary, tattoos are socially accepted today, but they need to be carefully considered."], ["Ich bin davon überzeugt, dass man diese Entscheidung nie spontan treffen sollte.", "I am convinced that you should never make this decision spontaneously."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "uniform", "title": "Die Schuluniform – Pro und Kontra", "en": "School uniforms – pros and cons", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frage, ob Schuluniformen gegen den Gruppenzwang unter Jugendlichen helfen können.", "The text is about whether school uniforms can help against peer pressure among young people."], ["Viele Schüler tragen teure Markenkleidung, und wer nicht mithalten kann, wird oft ausgegrenzt.", "Many students wear expensive brand-name clothes, and those who can't keep up are often excluded."], ["Befürworter meinen, dass Uniformen das Gemeinschaftsgefühl stärken, aber Kritiker sagen, dass sie kein Allheilmittel sind.", "Supporters think uniforms strengthen the sense of community, but critics say they are not a cure-all."], ["Was
