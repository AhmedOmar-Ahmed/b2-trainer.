 carefully, because a tattoo stays forever."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach muss jeder selbst entscheiden, ob er ein Tattoo haben möchte.", "In my opinion, everyone has to decide for themselves whether they want a tattoo."], ["Ich persönlich würde mir kein Tattoo machen lassen, weil sich der Geschmack mit der Zeit ändern kann.", "Personally, I wouldn't get a tattoo, because your taste can change over time."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile eines Tattoos", "Advantages of a tattoo", [["Einerseits kann ein Tattoo eine schöne Möglichkeit sein, seine Persönlichkeit zu zeigen.", "On the one hand, a tattoo can be a nice way to show your personality."], ["Außerdem erinnert es vielleicht an einen wichtigen Menschen oder ein besonderes Erlebnis.", "In addition, it might remind you of an important person or a special experience."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile eines Tattoos", "Disadvantages of a tattoo", [["Was die andere Seite angeht, muss man aber auch einiges bedenken.", "As for the other side, you also have to consider a few things."], ["Andererseits ist ein Tattoo eine Entscheidung für das ganze Leben.", "On the other hand, a tattoo is a decision for your whole life."], ["Was man mit zwanzig schön findet, gefällt einem mit fünfzig vielleicht gar nicht mehr.", "What you find beautiful at twenty, you might not like at all at fifty."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Tattoos im Beruf", "Tattoos at work", [["Ein weiterer wichtiger Punkt ist der Beruf.", "Another important point is your job."], ["In manchen Berufen, zum Beispiel in einer Bank oder bei der Polizei, sind sichtbare Tattoos nicht gern gesehen.", "In some jobs, for example in a bank or with the police, visible tattoos are not welcome."], ["Deshalb sollte man eine Körperstelle wählen, die man mit Kleidung bedecken kann.", "That's why you should choose a part of the body that can be covered by clothing."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Das richtige Motiv", "The right design", [["Was das Motiv betrifft, bin ich der Meinung, dass man keine Namen tätowieren lassen sollte.", "As far as the design is concerned, I believe you shouldn't get names tattooed."], ["Wenn die Beziehung zu Ende geht, hat man ein großes Problem.", "If the relationship ends, you have a big problem."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Gesundheit und Entfernung", "Health and removal", [["Ich halte es für wichtig, dass man ein gutes und sauberes Tattoostudio wählt, weil es sonst gesundheitliche Risiken gibt.", "I think it's important to choose a good and clean tattoo studio, because otherwise there are health risks."], ["Außerdem ist die Entfernung mit dem Laser teuer, langwierig und schmerzhaft.", "In addition, laser removal is expensive, lengthy and painful."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass in Deutschland viel mehr Menschen Tattoos haben als in meinem Heimatland.", "From my own experience, I can say that many more people in Germany have tattoos than in my home country."], ["Ich kenne auch jemanden, der sein Tattoo heute bereut.", "I also know someone who regrets their tattoo today."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Bezüglich möglicher Lösungen habe ich folgenden Vorschlag.", "Regarding possible solutions, I have the following suggestion."], ["Ich würde vorschlagen, dass man mindestens ein Jahr über das Motiv nachdenkt, bevor man sich tätowieren lässt.", "I would suggest thinking about the design for at least a year before getting a tattoo."], ["Wer unsicher ist, kann zuerst ein Tattoo zum Abwaschen oder ein Henna-Tattoo ausprobieren.", "Anyone who is unsure can first try a wash-off tattoo or a henna tattoo."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Tattoos heute gesellschaftlich akzeptiert sind, aber gut überlegt sein müssen.", "In summary, tattoos are socially accepted today, but they need to be carefully considered."], ["Ich bin davon überzeugt, dass man diese Entscheidung nie spontan treffen sollte.", "I am convinced that you should never make this decision spontaneously."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "uniform", "title": "Die Schuluniform – Pro und Kontra", "en": "School uniforms – pros and cons", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frage, ob Schuluniformen gegen den Gruppenzwang unter Jugendlichen helfen können.", "The text is about whether school uniforms can help against peer pressure among young people."], ["Viele Schüler tragen teure Markenkleidung, und wer nicht mithalten kann, wird oft ausgegrenzt.", "Many students wear expensive brand-name clothes, and those who can't keep up are often excluded."], ["Befürworter meinen, dass Uniformen das Gemeinschaftsgefühl stärken, aber Kritiker sagen, dass sie kein Allheilmittel sind.", "Supporters think uniforms strengthen the sense of community, but critics say they are not a cure-all."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach hat eine Schuluniform mehr Vorteile als Nachteile.", "In my opinion, a school uniform has more advantages than disadvantages."], ["Ich denke, dass Schüler sich dann mehr auf den Unterricht konzentrieren als auf ihre Kleidung.", "I think students would then concentrate more on lessons than on their clothes."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile der Schuluniform", "Advantages of school uniforms", [["Einerseits sehen alle Schüler gleich aus, und niemand wird wegen seiner Kleidung ausgelacht.", "On the one hand, all students look the same, and nobody is laughed at because of their clothes."], ["Außerdem können Kinder aus ärmeren Familien besser integriert werden.", "In addition, children from poorer families can be better integrated."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile der Schuluniform", "Disadvantages of school uniforms", [["Was die andere Seite angeht, muss man aber auch einiges bedenken.", "As for the other side, you also have to consider a few things."], ["Andererseits können die Schüler ihre Persönlichkeit dann weniger durch Kleidung zeigen.", "On the other hand, students can then express their personality less through their clothes."], ["Zudem muss die Uniform bezahlt werden, und das kann für manche Familien teuer sein.", "Moreover, the uniform has to be paid for, and that can be expensive for some families."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Markendruck und Ausgrenzung", "Brand pressure and exclusion", [["Ein weiterer wichtiger Punkt ist der Druck, teure Marken zu tragen.", "Another important point is the pressure to wear expensive brands."], ["Dieser Druck ist für viele Jugendliche sehr hoch und kann sogar zu Mobbing führen.", "This pressure is very high for many young people and can even lead to bullying."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Konflikte lösen", "Solving conflicts", [["Was Konflikte zwischen Schülern betrifft, bin ich der Meinung, dass eine Uniform allein sie nicht lösen kann.", "As far as conflicts between students are concerned, I believe a uniform alone cannot solve them."], ["Probleme müssen offen besprochen und gemeinsam gelöst werden.", "Problems have to be discussed openly and solved together."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Schuluniformen in meinem Heimatland", "School uniforms in my home country", [["In meinem Heimatland tragen viele Schüler eine Schuluniform, und das ist ganz normal.", "In my home country, many students wear a school uniform, and that is completely normal."], ["Ich finde, dass dadurch morgens viel Zeit und Stress gespart wird.", "I think it saves a lot of time and stress in the morning."], ["Wie ist das in deinem Heimatland?", "How is it in your home country?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass Kleidung für Jugendliche sehr wichtig ist.", "From my own experience, I can say that clothes are very important for young people."], ["Ich erinnere mich, dass manche Mitschüler wegen ihrer Kleidung ausgelacht wurden.", "I remember that some classmates were laughed at because of their clothes."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Bezüglich möglicher Lösungen habe ich folgenden Vorschlag.", "Regarding possible solutions, I have the following suggestion."], ["Ich würde vorschlagen, dass die Schüler beim Design der Uniform mitbestimmen dürfen.", "I would suggest that students be allowed to have a say in the design of the uniform."], ["Außerdem sollte die Schule Familien mit wenig Geld finanziell unterstützen.", "In addition, the school should support families with little money financially."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Schuluniformen viele Vorteile haben, aber nicht alle Probleme lösen.", "In summary, school uniforms have many advantages but don't solve all problems."], ["Ich bin davon überzeugt, dass Respekt und Toleranz vor allem im Gespräch gelernt werden.", "I am convinced that respect and tolerance are learned above all through conversation."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "handy", "title": "Kinder unterschätzen Gefahren von Handy und Internet", "en": "Children underestimate the dangers of mobile phones and the internet", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um eine Befragung der EU-Kommission zur Handy- und Internetnutzung von Kindern und Jugendlichen.", "The text is about an EU Commission survey on mobile phone and internet use by children and young people."], ["Das Ergebnis zeigt, dass die jungen Nutzer selbstbewusst mit den neuen Medien umgehen, aber die Gefahren unterschätzen.", "The result shows that young users handle the new media confidently but underestimate the dangers."], ["Bei Problemen würden die meisten Kinder ihre Eltern nur als letzten Ausweg um Hilfe bitten.", "If they have problems, most children would only ask their parents for help as a last resort."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach sind Handy und Internet für Kinder sowohl nützlich als auch gefährlich.", "In my opinion, mobile phones and the internet are both useful and dangerous for children."], ["Ich denke, dass Kinder nicht zu früh ein eigenes Smartphone bekommen sollten.", "I think children shouldn't get their own smartphone too early."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile von Handy und Internet", "Advantages of phones and the internet", [["Einerseits können Kinder im Internet viel lernen und schnell Informationen finden.", "On the one hand, children can learn a lot on the internet and find information quickly."], ["Außerdem können die Eltern ihr Kind jederzeit anrufen, was ein Gefühl von Sicherheit gibt.", "In addition, parents can call their child at any time, which gives a feeling of security."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Gefahren", "Dangers", [["Was die andere Seite angeht, muss man aber auch einiges bedenken.", "As for the other side, you also have to consider a few things."], ["Andererseits können Kinder im Internet leicht Gewaltvideos oder ungeeignete Inhalte finden.", "On the other hand, children can easily find violent videos or unsuitable content on the internet."], ["Außerdem kommen Beleidigungen, Drohungen und Cybermobbing immer häufiger vor.", "In addition, insults, threats and cyberbullying are becoming more and more common."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Fotos und Privatsphäre", "Photos and privacy", [["Ein weiterer wichtiger Punkt sind Fotos.", "Another important point is photos."], ["Viele Jugendliche teilen private Bilder, ohne an die Folgen zu denken.", "Many young people share private pictures without thinking about the consequences."], ["Was einmal im Internet ist, kann man kaum wieder löschen.", "Once something is on the internet, it can hardly be deleted."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Verantwortung der Eltern", "Parents' responsibility", [["Was die Eltern betrifft, bin ich der Meinung, dass sie mit ihren Kindern offen über die Risiken sprechen sollten.", "As far as the parents are concerned, I believe they should talk openly with their children about the risks."], ["Die Kinder sollten wissen, dass sie bei Problemen immer zu ihren Eltern kommen können.", "Children should know that they can always come to their parents with problems."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Rolle der Schule", "Role of the school", [["Ich halte es für besonders wichtig, dass Medienkompetenz in der Schule unterrichtet wird.", "I think it is especially important that media literacy is taught at school."], ["Zum Beispiel könnten Schüler lernen, wie man sichere Passwörter benutzt und gefälschte Nachrichten erkennt.", "For example, students could learn how to use secure passwords and recognise fake news."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass schon sehr kleine Kinder heute ein Smartphone benutzen.", "From my own experience, I can say that even very young children use a smartphone today."], ["Ich sehe oft Kinder im Restaurant, die nur auf ihr Handy schauen, statt mit ihrer Familie zu sprechen.", "I often see children in restaurants who only look at their phone instead of talking to their family."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Bezüglich möglicher Lösungen habe ich folgenden Vorschlag.", "Regarding possible solutions, I have the following suggestion."], ["Ich würde vorschlagen, dass Eltern Kinderschutz-Apps nutzen und feste Handyzeiten vereinbaren.", "I would suggest that parents use child-protection apps and agree on fixed phone times."], ["Außerdem sollten die Eltern selbst ein gutes Vorbild sein und nicht ständig am Handy sein.", "In addition, parents should be a good role model themselves and not be on their phone all the time."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Handy und Internet zum Leben der Kinder gehören, aber auch Gefahren haben.", "In summary, phones and the internet are part of children's lives but also have dangers."], ["Ich bin davon überzeugt, dass Aufklärung und Vertrauen zwischen Eltern und Kindern der beste Schutz sind.", "I am convinced that education and trust between parents and children are the best protection."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "fernsehen", "title": "Fernsehen macht Kinder dumm", "en": "Television makes children stupid", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text geht es um die Frage, welchen Einfluss das Fernsehen auf Kinder hat.", "The text is about what influence television has on children."], ["Neue Studien zeigen, dass Kinder, die viel fernsehen, später oft schlechtere Schulabschlüsse haben.", "New studies show that children who watch a lot of TV often have worse school qualifications later."], ["Außerdem kann zu viel Fernsehen der Gesundheit schaden, weil die Kinder sich zu wenig bewegen.", "In addition, too much television can harm health because children move too little."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach macht Fernsehen Kinder nicht automatisch dumm, aber zu viel Fernsehen ist schädlich.", "In my opinion, television doesn't automatically make children stupid, but too much television is harmful."], ["Ich denke, dass es vor allem darauf ankommt, was und wie lange die Kinder schauen.", "I think it mainly depends on what children watch and for how long."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile des Fernsehens", "Advantages of television", [["Einerseits gibt es viele gute Kindersendungen, mit denen Kinder etwas lernen können.", "On the one hand, there are many good children's programmes from which children can learn something."], ["Außerdem kann Fernsehen bei der Entspannung helfen und Kindern neue Länder und Kulturen zeigen.", "In addition, television can help children relax and show them new countries and cultures."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile des Fernsehens", "Disadvantages of television", [["Was die andere Seite angeht, muss man aber auch einiges bedenken.", "As for the other side, you also have to consider a few things."], ["Andererseits sitzen viele Kinder stundenlang vor dem Fernseher, statt draußen zu spielen.", "On the other hand, many children sit in front of the TV for hours instead of playing outside."], ["Das kann zu Übergewicht, Konzentrationsproblemen und schlechteren Noten führen.", "That can lead to being overweight, concentration problems and worse grades."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Fernseher im Kinderzimmer", "A TV in the child's bedroom", [["Ein weiterer wichtiger Punkt ist der Fernseher im Kinderzimmer.", "Another important point is the TV in the child's bedroom."], ["Laut den Studien haben Kinder mit eigenem Fernseher im Durchschnitt schlechtere Noten.", "According to the studies, children with their own TV have worse grades on average."], ["Deshalb finde ich, dass ein Fernseher nicht ins Kinderzimmer gehört.", "That's why I think a TV doesn't belong in a child's bedroom."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Verantwortung der Eltern", "Parents' responsibility", [["Was die Eltern betrifft, bin ich der Meinung, dass sie klare Regeln für die Fernsehzeit festlegen sollten.", "As far as the parents are concerned, I believe they should set clear rules for TV time."], ["Experten empfehlen höchstens eine Stunde pro Tag, und Hausaufgaben sollten nie vor dem Fernseher gemacht werden.", "Experts recommend at most one hour a day, and homework should never be done in front of the TV."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Schlaf und Lernen", "Sleep and learning", [["Ich halte es für sehr wichtig, dass Kinder vor dem Schlafengehen nicht fernsehen.", "I think it's very important that children don't watch TV before going to bed."], ["Die Bilder und Geräusche lenken ab, und das Gehirn kann sich den Lernstoff schlechter merken.", "The pictures and sounds are distracting, and the brain remembers the learning material less well."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass ich als Kind auch gern ferngesehen habe.", "From my own experience, I can say that I also liked watching TV as a child."], ["Meine Eltern haben aber darauf geachtet, dass ich zuerst meine Hausaufgaben mache und genug draußen spiele.", "But my parents made sure that I did my homework first and played outside enough."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Bezüglich möglicher Lösungen habe ich folgenden Vorschlag.", "Regarding possible solutions, I have the following suggestion."], ["Statt den Fernseher ganz zu verbieten, würde ich vorschlagen, gemeinsam mit den Kindern gute Sendungen auszuwählen.", "Instead of banning the TV completely, I would suggest choosing good programmes together with the children."], ["Außerdem sollten Eltern Alternativen anbieten, zum Beispiel Sport, Bücher oder Spiele mit der Familie.", "In addition, parents should offer alternatives, for example sport, books or family games."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass Fernsehen in Maßen in Ordnung ist, aber zu viel Fernsehen schadet.", "In summary, television in moderation is fine, but too much television is harmful."], ["Ich bin davon überzeugt, dass die Eltern hier die wichtigste Rolle spielen.", "I am convinced that parents play the most important role here."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "ohneinternet", "title": "Eine Woche ohne Internet", "en": "A week without the internet", "sections": [["Zusammenfassung des Textes", "Summary of the text", [["Im Text erzählt ein Autor von seinem Experiment, eine Woche lang ohne Internet zu leben.", "In the text, an author describes his experiment of living without the internet for a week."], ["Er konnte keine Informationen schnell nachschauen, nichts online bestellen und musste am Bahnhof lange für Fahrkarten anstehen.", "He couldn't quickly look up information, couldn't order anything online and had to queue for a long time at the station for tickets."], ["Am Ende stellt er fest, dass das Internet Menschen zusammenbringt und das Leben sehr erleichtert.", "In the end, he finds that the internet brings people together and makes life much easier."], ["Was hältst du von diesem Thema?", "What do you think of this topic?"]]], ["Eigene Meinung", "Own opinion", [["Meiner Meinung nach ist das Internet heute aus unserem Alltag nicht mehr wegzudenken.", "In my opinion, today it is impossible to imagine our everyday life without the internet."], ["Ich denke aber, dass eine kurze Pause ab und zu sehr guttun kann.", "But I think a short break now and then can do you a lot of good."], ["Wie siehst du das?", "How do you see it?"]]], ["Vorteile des Internets", "Advantages of the internet", [["Einerseits spart das Internet viel Zeit, zum Beispiel beim Einkaufen, beim Kaufen von Fahrkarten oder bei Bankgeschäften.", "On the one hand, the internet saves a lot of time, for example when shopping, buying tickets or doing banking."], ["Außerdem kann man jederzeit mit Familie und Freunden in Kontakt bleiben, auch wenn sie weit weg wohnen.", "In addition, you can stay in contact with family and friends at any time, even if they live far away."], ["Stimmst du mir da zu?", "Do you agree with me on that?"]]], ["Nachteile des Internets", "Disadvantages of the internet", [["Was die andere Seite angeht, muss man aber auch einiges bedenken.", "As for the other side, you also have to consider a few things."], ["Andererseits verbringen viele Menschen zu viel Zeit online und haben weniger echte Kontakte.", "On the other hand, many people spend too much time online and have fewer real contacts."], ["Außerdem kann man durch die ständige Erreichbarkeit leicht in Stress geraten.", "In addition, being constantly reachable can easily cause stress."], ["Was denkst du darüber?", "What do you think about it?"]]], ["Abhängigkeit vom Internet", "Dependence on the internet", [["Ein weiterer wichtiger Punkt ist, dass wir sehr abhängig vom Internet geworden sind.", "Another important point is that we have become very dependent on the internet."], ["Viele Menschen wissen gar nicht mehr, wie man eine Karte liest oder ohne Handy eine Adresse findet.", "Many people no longer know how to read a map or find an address without a phone."], ["Siehst du das genauso?", "Do you see it the same way?"]]], ["Kinder und das Internet", "Children and the internet", [["Was die Kinder betrifft, bin ich der Meinung, dass sie lernen sollten, auch ohne Internet Antworten zu finden.", "As far as children are concerned, I believe they should learn to find answers without the internet too."], ["Zum Beispiel können sie Bücher lesen oder ihre Eltern und Lehrer fragen.", "For example, they can read books or ask their parents and teachers."], ["Wie denkst du darüber?", "What's your view on that?"]]], ["Eine digitale Pause", "A digital break", [["Ich halte es für sinnvoll, ab und zu eine digitale Pause zu machen, zum Beispiel am Wochenende oder im Urlaub.", "I think it makes sense to take a digital break now and then, for example at the weekend or on holiday."], ["So hat man mehr Zeit für Gespräche, Bewegung und Hobbys.", "That way you have more time for conversations, exercise and hobbies."], ["Was hältst du davon?", "What do you think of that?"]]], ["Persönliche Erfahrung", "Personal experience", [["Aus meiner eigenen Erfahrung kann ich sagen, dass mir das Internet in Deutschland sehr geholfen hat.", "From my own experience, I can say that the internet has helped me a lot in Germany."], ["Ich lerne online Deutsch, finde Wege mit dem Navi und telefoniere per Video mit meiner Familie im Heimatland.", "I learn German online, find my way with navigation and make video calls with my family in my home country."], ["Hast du ähnliche Erfahrungen gemacht?", "Have you had similar experiences?"]]], ["Lösungen und Alternativen", "Solutions and alternatives", [["Bezüglich möglicher Lösungen habe ich folgenden Vorschlag.", "Regarding possible solutions, I have the following suggestion."], ["Ich würde vorschlagen, feste Zeiten ohne Handy einzuführen, zum Beispiel beim Essen oder vor dem Schlafengehen.", "I would suggest introducing fixed phone-free times, for example during meals or before going to bed."], ["Außerdem kann man Benachrichtigungen ausschalten, damit man nicht ständig abgelenkt wird.", "In addition, you can turn off notifications so that you aren't constantly distracted."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Persönliches Fazit", "Personal conclusion", [["Zusammenfassend lässt sich sagen, dass das Internet unser Leben sehr erleichtert, aber man es bewusst nutzen sollte.", "In summary, the internet makes our lives much easier, but it should be used consciously."], ["Ich bin davon überzeugt, dass eine gesunde Balance zwischen online und offline am besten ist.", "I am convinced that a healthy balance between online and offline is best."], ["Bist du auch dieser Meinung?", "Are you of the same opinion?"]]]]}, {"id": "bausteine", "type": "blocks", "title": "Bausteine", "en": "Building blocks", "sections": [["Einstieg", "Opening", [["Hallo! Wie du weißt, sollen wir bei der Planung helfen.", "Hi! As you know, we're supposed to help with the planning."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Zusagen & Meinung: „Meiner Meinung nach …“", "Agreeing & giving your opinion", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, was wir alles brauchen.", "In my opinion, we should first think about everything we need."]]], ["Vorschlag mit „Was … betrifft“", "Suggesting with 'As far as … is concerned'", [["Was das Programm betrifft, schlage ich vor, dass wir einen kurzen Vortrag machen.", "As far as the programme is concerned, I suggest we give a short talk."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Vorschlag mit „Was … angeht“", "Suggesting with 'As for …'", [["Was die Werbung angeht, könnten wir Plakate aufhängen.", "As for advertising, we could hang up posters."], ["Wie findest du das?", "What do you think of that?"]]], ["Vorschlag mit „Bezüglich …“", "Suggesting with 'Regarding …'", [["Bezüglich des Essens würde ich vorschlagen, dass jeder etwas mitbringt.", "Regarding the food, I would suggest that everyone brings something."]]], ["Zustimmen", "Agreeing", [["Einverstanden.", "Agreed."], ["Das finde ich gut.", "I think that's good."], ["Da stimme ich dir zu.", "I agree with you on that."]]], ["Höflich widersprechen", "Disagreeing politely", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings kostet das viel Geld. Vielleicht finden wir einen Sponsor?", "However, that costs a lot of money. Maybe we can find a sponsor?"]]], ["Aufgaben verteilen", "Dividing up the tasks", [["Du hast recht, so machen wir es.", "You're right, let's do it that way."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Einladungen.", "I'll take care of the invitations."], ["Und ich übernehme das Essen.", "And I'll take on the food."]]], ["Abschluss & Termin", "Wrapping up & arranging to meet", [["Dann haben wir alles besprochen.", "Then we've discussed everything."], ["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"], ["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]], ["Werbung", "Advertising", [["Was die Werbung angeht, könnten wir Plakate aufhängen und Flyer verteilen.", "As for advertising, we could hang up posters and hand out flyers."], ["Außerdem könnten wir die Veranstaltung in den sozialen Medien und in der Zeitung bekannt machen.", "We could also promote the event on social media and in the newspaper."]]], ["Essen & Getränke", "Food & drinks", [["Bezüglich des Essens würde ich vorschlagen, dass jeder etwas mitbringt.", "Regarding the food, I would suggest that everyone brings something."], ["Zum Beispiel könnte jeder ein typisches Gericht aus seinem Heimatland kochen.", "For example, everyone could cook a typical dish from their home country."]]], ["Kosten & Geld", "Costs & money", [["Was die Kosten betrifft, sollten wir zuerst ein Budget festlegen.", "As far as the costs are concerned, we should first set a budget."], ["Vielleicht finden wir einen Sponsor, oder jeder bezahlt einen kleinen Beitrag.", "Maybe we can find a sponsor, or everyone pays a small contribution."]]], ["Genehmigung", "Permission", [["Allerdings brauchen wir dafür eine Genehmigung.", "However, we need permission for that."], ["Vielleicht fragen wir zuerst bei der Stadt oder bei der Schulleitung nach?", "Maybe we should ask the town or the school management first?"]]], ["Technik", "Technology", [["Bezüglich der Technik würde ich vorschlagen, dass wir einen Laptop und einen Beamer benutzen.", "Regarding the technology, I would suggest that we use a laptop and a projector."], ["Wir sollten alles vorher testen, damit es keine Probleme gibt.", "We should test everything beforehand so that there are no problems."]]], ["Ort & Termin", "Place & date", [["Meiner Meinung nach sollten wir zuerst einen passenden Ort und einen Termin finden.", "In my opinion, we should first find a suitable place and date."], ["Am besten wählen wir einen Tag, an dem alle Zeit haben.", "Ideally we should choose a day when everyone has time."]]], ["Helfer finden", "Finding helpers", [["Allerdings brauchen wir viele Helfer.", "However, we need lots of helpers."], ["Vielleicht fragen wir Freunde, Nachbarn oder Freiwillige, ob sie mitmachen möchten?", "Maybe we could ask friends, neighbours or volunteers whether they'd like to join in?"]]], ["Wetter & Plan B", "Weather & plan B", [["Allerdings kann das Wetter schlecht sein.", "However, the weather might be bad."], ["Vielleicht planen wir eine Alternative, falls es regnet?", "Maybe we should plan an alternative in case it rains?"]]], ["Experten & Vorträge", "Experts & talks", [["Was das Programm betrifft, schlage ich vor, dass wir einen Experten zu einem kurzen Vortrag einladen.", "As far as the programme is concerned, I suggest we invite an expert to give a short talk."], ["Danach können die Besucher Fragen stellen.", "Afterwards the visitors can ask questions."]]], ["Angebote für Kinder", "Activities for children", [["Für die Kinder könnten wir Spiele anbieten, zum Beispiel Malen, Basteln oder Kinderschminken.", "For the children we could offer games, for example painting, crafts or face painting."], ["So haben auch die Eltern Zeit, sich in Ruhe umzuschauen.", "That way the parents also have time to look around in peace."]]], ["Einladen & informieren", "Inviting & informing people", [["Was die Einladung betrifft, schlage ich vor, dass wir eine Chatgruppe gründen.", "As far as the invitation is concerned, I suggest we start a chat group."], ["Außerdem können wir allen eine E-Mail schreiben, damit niemand etwas verpasst.", "We can also write everyone an email so that nobody misses anything."]]], ["Transport & Anreise", "Transport & getting there", [["Was den Transport angeht, könnten wir mit dem Zug fahren oder einen Bus mieten.", "As for transport, we could go by train or rent a bus."], ["Für Gruppen gibt es oft günstige Tickets.", "There are often cheap tickets for groups."]]], ["Übernachtung", "Accommodation", [["Bezüglich der Übernachtung würde ich vorschlagen, dass wir eine günstige Jugendherberge buchen.", "Regarding accommodation, I would suggest we book a cheap youth hostel."], ["Wir sollten früh reservieren, weil die Zimmer schnell ausgebucht sind.", "We should book early, because the rooms get booked up quickly."]]], ["Pausen & Freizeit", "Breaks & free time", [["Allerdings brauchen alle auch etwas Freizeit.", "However, everyone also needs some free time."], ["Vielleicht planen wir eine Pause mit Kaffee und Kuchen oder einen freien Nachmittag?", "Maybe we could plan a break with coffee and cake or a free afternoon?"]]]]}, {"id": "pl-infotag", "type": "plan", "title": "Infotag zum Arbeitsalltag", "en": "Info day on working life", "task": "An einer Schule in Ihrer Stadt soll ein Infotag zum Arbeitsalltag in verschiedenen Berufen stattfinden. Überlegen Sie gemeinsam, welche Berufe Sie vorstellen, wie Sie den Arbeitsalltag präsentieren und welches Material Sie brauchen.", "task_en": "A school in your town is holding an info day about everyday working life in different jobs. Plan together which jobs to present, how to present them and what materials you need.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, soll an der Schule in unserer Stadt ein Infotag zum Arbeitsalltag in verschiedenen Berufen stattfinden.", "Hi! As you know, the school in our town is holding an info day about everyday working life in different jobs."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst entscheiden, welche Berufe wir vorstellen.", "In my opinion, we should first decide which jobs we will present."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Berufe angeht, würde ich vorschlagen, dass ich meinen Beruf als Köchin und du deinen Beruf als Physiotherapeut vorstellst, weil wir beide viel Erfahrung haben.", "As for the jobs, I'd suggest that I present my job as a cook and you yours as a physiotherapist, because we both have a lot of experience."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Präsentation betrifft, finde ich es wichtig, dass wir kurze Videos zeigen und danach Fragen beantworten, denn so wird es nicht langweilig.", "As far as the presentation is concerned, I think it's important that we show short videos and then answer questions, because that way it won't be boring."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich des Materials schlage ich vor, einen Laptop, einen Beamer und Informationsblätter mitzubringen, damit die Schüler später alles nachlesen können.", "Regarding the materials, I suggest bringing a laptop, a projector and information sheets so that the students can read everything again later."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Schüler angeht, wäre es sinnvoll, dass sie selbst etwas ausprobieren und mitmachen, weil man durch Praxis am besten lernt.", "As for the students, it would make sense for them to try things out and join in, because you learn best through practice."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings sollten wir nicht zu lange reden, sonst langweilen sich die Schüler. Vielleicht machen wir am Ende ein kleines Quiz?", "However, we shouldn't talk for too long, otherwise the students will get bored. Maybe we could do a little quiz at the end?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Ein Quiz ist eine tolle Idee, und dem Gewinner könnten wir ein kleines Geschenk geben.", "A quiz is a great idea, and we could give the winner a small present."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Videos und den Beamer.", "I'll take care of the videos and the projector."]]], ["Person A", "Person A", [["Und ich übernehme die Informationsblätter und das Quiz.", "And I'll take on the information sheets and the quiz."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-interview", "type": "plan", "title": "Interview mit einem berühmten Sänger", "en": "Interview with a famous singer", "task": "Sie haben als Journalisten die Chance, einen sehr bekannten Sänger zu interviewen. Einigen Sie sich auf eine Person und bereiten Sie gemeinsam einen Fragenkatalog vor.", "task_en": "As journalists you have the chance to interview a very well-known singer. Agree on a person and prepare a list of questions together.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, haben wir die Chance, für unsere Zeitung einen bekannten Sänger zu interviewen.", "Hi! As you know, we have the chance to interview a famous singer for our newspaper."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst entscheiden, wen wir interviewen möchten.", "In my opinion, we should first decide whom we want to interview."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Person angeht, würde ich Mark Forster vorschlagen, weil er sehr bekannt ist und viele junge Leser ihn mögen.", "As for the person, I'd suggest Mark Forster, because he is very famous and many young readers like him."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Fragen betrifft, finde ich es wichtig, dass wir über seine Karriere und seine Pläne sprechen, denn das interessiert unsere Leser am meisten.", "As far as the questions are concerned, I think it's important that we talk about his career and his plans, because that interests our readers most."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich seines Privatlebens schlage ich vor, nur nach Hobbys und Familie zu fragen, damit das Interview höflich bleibt.", "Regarding his private life, I suggest asking only about hobbies and family so that the interview stays polite."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was den Ort angeht, wäre ein ruhiges Hotel sinnvoll, weil wir dort ungestört sprechen und gut aufnehmen können.", "As for the place, a quiet hotel would make sense, because we can talk undisturbed and record well there."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings dürfen wir nicht zu viele Fragen stellen, sonst wird das Interview zu lang. Vielleicht reichen zehn Fragen?", "However, we mustn't ask too many questions, otherwise the interview will be too long. Maybe ten questions are enough?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Zehn Fragen sind genug, und wir sollten die wichtigsten Fragen an den Anfang stellen.", "Ten questions are enough, and we should put the most important questions at the beginning."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um den Termin und schreibe seinem Management eine E-Mail.", "I'll take care of the appointment and write an email to his management."]]], ["Person A", "Person A", [["Und ich übernehme die Fragenliste und recherchiere im Internet.", "And I'll do the list of questions and research on the internet."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-sprachen", "type": "plan", "title": "Vortrag über das Lernen von Fremdsprachen", "en": "Talk about learning foreign languages", "task": "Sie sind an eine Schule eingeladen, um über Ihre Erfahrungen beim Lernen von Fremdsprachen zu berichten. Erstellen Sie zusammen eine Liste mit Stichpunkten für eine 15-minütige Präsentation.", "task_en": "You have been invited to a school to talk about your experience learning foreign languages. Together, make a list of key points for a 15-minute presentation.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, hat uns die Schule eingeladen, über unsere Erfahrungen mit Fremdsprachen zu sprechen.", "Hi! As you know, the school has invited us to talk about our experiences with foreign languages."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, wie wir die 15 Minuten aufteilen.", "In my opinion, we should first think about how to divide up the 15 minutes."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was den Anfang angeht, würde ich vorschlagen, dass wir erklären, warum Fremdsprachen für Arbeit und Reisen wichtig sind, weil das die Schüler motiviert.", "As for the beginning, I'd suggest we explain why foreign languages matter for work and travel, because that motivates the students."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Beispiele betrifft, finde ich es gut, lustige Situationen aus unserem Leben zu erzählen, denn so hören die Schüler gern zu.", "As far as examples are concerned, I think it's good to tell funny situations from our lives, because then the students like listening."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Lerntipps schlage ich vor, Filme, Musik und Apps zu empfehlen, damit die Schüler auch zu Hause leicht weiterlernen können.", "Regarding learning tips, I suggest recommending films, music and apps so that the students can easily keep learning at home."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Technik angeht, wäre ein Laptop mit Beamer sinnvoll, weil Bilder den Vortrag lebendiger machen.", "As for the technology, a laptop with a projector would make sense, because pictures make the talk livelier."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings haben wir nur wenig Zeit. Vielleicht lassen wir am Ende nur drei Minuten für Fragen?", "However, we only have a little time. Maybe we leave just three minutes for questions at the end?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Drei Minuten reichen, und wer noch Fragen hat, kann uns danach persönlich ansprechen.", "Three minutes are enough, and anyone with more questions can talk to us personally afterwards."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Folien für die Präsentation.", "I'll take care of the slides for the presentation."]]], ["Person A", "Person A", [["Und ich übernehme die Lerntipps und die lustigen Geschichten.", "And I'll take on the learning tips and the funny stories."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-strassenkinder", "type": "plan", "title": "Spendenaktion für Straßenkinder", "en": "Fundraiser for street children", "task": "Sie wollen gemeinsam Geld für Straßenkinder sammeln. Sprechen Sie über Ihre Ideen und einigen Sie sich, wer was wann macht.", "task_en": "You want to collect money for street children together. Discuss your ideas and agree who does what and when.", "sections": [["Person A", "Person A", [["Hallo! Mir ist aufgefallen, dass es in unserer Stadt viele Straßenkinder gibt, und ich möchte gern Geld für sie sammeln.", "Hi! I've noticed that there are many street children in our town, and I'd like to collect money for them."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, wie wir möglichst viele Menschen erreichen.", "In my opinion, we should first think about how we can reach as many people as possible."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was den Ort angeht, würde ich den Stadtpark vorschlagen, weil am Wochenende viele Familien dort sind und gern spenden.", "As for the place, I'd suggest the town park, because many families are there at the weekend and like to donate."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Aktion betrifft, finde ich es gut, Kuchen und Getränke zu verkaufen und das ganze Geld zu spenden, denn so macht jeder gern mit.", "As far as the event is concerned, I think it's good to sell cake and drinks and donate all the money, because then everyone is happy to join in."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Werbung schlage ich vor, Plakate aufzuhängen und eine Anzeige in die Zeitung zu setzen, damit möglichst viele Leute davon erfahren.", "Regarding advertising, I suggest hanging up posters and putting an ad in the newspaper so that as many people as possible hear about it."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was das Geld angeht, wäre es sinnvoll, mit einer bekannten Hilfsorganisation zusammenzuarbeiten, weil die Spender ihr vertrauen und das Geld sicher ankommt.", "As for the money, it would make sense to work with a well-known charity, because donors trust it and the money arrives safely."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings brauchen wir eine Genehmigung von der Stadt. Vielleicht sollten wir gleich morgen beim Rathaus anrufen?", "However, we need permission from the town. Maybe we should call the town hall tomorrow?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Am besten rufen wir gleich morgen früh an, weil die Genehmigung manchmal ein paar Wochen dauert.", "It's best to call first thing tomorrow, because permission sometimes takes a few weeks."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Genehmigung und die Hilfsorganisation.", "I'll take care of the permission and the charity."]]], ["Person A", "Person A", [["Und ich übernehme die Plakate, die Anzeige und den Kuchenverkauf.", "And I'll do the posters, the ad and the cake sale."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-spielemesse", "type": "plan", "title": "Eine Spielemesse organisieren", "en": "Organising a games fair", "task": "In einem Kulturzentrum in Ihrer Stadt soll eine Spielemesse stattfinden. Sie helfen bei der Planung. Denken Sie zum Beispiel an Informationsmaterial oder Poster.", "task_en": "A games fair is taking place at a cultural centre in your town. You are helping with the planning. Think, for example, about information material or posters.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, soll im Kulturzentrum eine Spielemesse stattfinden, und wir sollen bei der Planung helfen.", "Hi! As you know, there's going to be a games fair at the cultural centre, and we're supposed to help with the planning."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, für wen die Messe gedacht ist.", "In my opinion, we should first think about who the fair is for."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Publikum angeht, würde ich vorschlagen, Spiele für Kinder, Jugendliche und Familien anzubieten, weil dann mehr Besucher kommen.", "As for the audience, I'd suggest offering games for children, teenagers and families, because then more visitors will come."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Werbung betrifft, finde ich bunte Poster in Schulen und Supermärkten gut, denn dort sehen sie viele Familien.", "As far as advertising is concerned, I think colourful posters in schools and supermarkets are good, because many families see them there."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich des Informationsmaterials schlage ich vor, einen kleinen Flyer mit dem Programm zu drucken, damit die Besucher wissen, wann was stattfindet.", "Regarding information material, I suggest printing a small flyer with the programme so that visitors know what happens when."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Großeltern angeht, wäre eine Ecke mit alten Brettspielen sinnvoll, weil sie dort mit ihren Enkeln spielen können.", "As for grandparents, a corner with old board games would make sense, because they can play there with their grandchildren."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings kostet das Drucken Geld. Vielleicht fragen wir einen Spieleladen, ob er uns als Sponsor unterstützt?", "However, printing costs money. Maybe we could ask a games shop whether it would support us as a sponsor?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Als Dankeschön könnten wir das Logo des Sponsors auf unsere Poster drucken.", "As a thank-you, we could print the sponsor's logo on our posters."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um den Sponsor und den Druck der Flyer.", "I'll take care of the sponsor and printing the flyers."]]], ["Person A", "Person A", [["Und ich übernehme die Poster und das Programm.", "And I'll do the posters and the programme."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-austausch", "type": "plan", "title": "Planung eines Schüleraustauschs", "en": "Planning a student exchange", "task": "Ihre Schule nimmt an einem Austauschprogramm mit deutschen Schülern teil. Die Gastschüler bleiben vier Wochen in Ihrem Land. Planen Sie den Aufenthalt mit Programmvorschlägen.", "task_en": "Your school is taking part in an exchange programme with German students. The guest students will stay in your country for four weeks. Plan their stay with programme ideas.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, kommen bald deutsche Gastschüler für vier Wochen an unsere Schule.", "Hi! As you know, German guest students are coming to our school soon for four weeks."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst klären, wo die Schüler wohnen.", "In my opinion, we should first clarify where the students will live."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Unterkunft angeht, würde ich Gastfamilien vorschlagen, weil die Schüler so unseren Alltag und unsere Sprache kennenlernen.", "As for accommodation, I'd suggest host families, because that way the students get to know our everyday life and our language."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was das Programm betrifft, finde ich es gut, dass sie vormittags am Unterricht teilnehmen und nachmittags Ausflüge machen, denn so lernen sie Schule und Land kennen.", "As far as the programme is concerned, I think it's good that they attend lessons in the morning and go on trips in the afternoon, because that way they get to know both the school and the country."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Ausflüge schlage ich vor, die Altstadt, ein Museum und ein typisches Dorf zu besuchen, damit sie ein vollständiges Bild bekommen.", "Regarding trips, I suggest visiting the old town, a museum and a typical village so that they get a complete picture."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Gastschüler angeht, wäre es sinnvoll, dass sie im Unterricht ihre Heimat vorstellen, weil unsere Schüler so auch etwas lernen.", "As for the guest students, it would make sense for them to present their home country in class, because our students learn something too."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings sollten die Schüler auch etwas Freizeit haben. Vielleicht planen wir die Wochenenden freier?", "However, the students should also have some free time. Maybe we could keep the weekends freer?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Am Wochenende können die Gastfamilien selbst entscheiden, was sie mit den Schülern unternehmen.", "At the weekend the host families can decide for themselves what to do with the students."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Gastfamilien.", "I'll take care of the host families."]]], ["Person A", "Person A", [["Und ich übernehme das Programm für die Ausflüge.", "And I'll do the programme for the trips."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-flohmarkt", "type": "plan", "title": "Einen Flohmarkt organisieren", "en": "Organising a flea market", "task": "Sie möchten in Ihrer Nachbarschaft einen Flohmarkt organisieren. Überlegen Sie gemeinsam, was Sie tun müssen, und verteilen Sie die Aufgaben.", "task_en": "You want to organise a flea market in your neighbourhood. Think together about what you need to do and divide up the tasks.", "sections": [["Person A", "Person A", [["Hallo! Ich habe eine Idee: Wir könnten in unserer Nachbarschaft einen Flohmarkt organisieren.", "Hi! I have an idea: we could organise a flea market in our neighbourhood."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst einen passenden Ort und ein Datum finden.", "In my opinion, we should first find a suitable place and date."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was den Ort angeht, würde ich den Schulhof vorschlagen, weil er groß ist und am Wochenende leer steht.", "As for the place, I'd suggest the school yard, because it's big and empty at weekends."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was den Termin betrifft, finde ich einen Samstag im Mai ideal, denn dann ist das Wetter meistens schön und viele Leute haben Zeit.", "As far as the date is concerned, I think a Saturday in May is ideal, because the weather is usually nice and many people have time."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Verkäufer schlage ich vor, alle Nachbarn einzuladen und für jeden Stand fünf Euro zu nehmen, damit wir die Kosten bezahlen können.", "Regarding sellers, I suggest inviting all the neighbours and charging five euros per stall so that we can cover the costs."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Werbung angeht, wären Plakate im Supermarkt und in der Bäckerei sinnvoll, weil dort viele Nachbarn einkaufen.", "As for advertising, posters in the supermarket and the bakery would make sense, because many neighbours shop there."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings brauchen wir auch etwas zu essen und zu trinken. Vielleicht machen wir einen kleinen Kaffee-und-Kuchen-Stand?", "However, we also need something to eat and drink. Maybe we could have a small coffee and cake stall?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Den Gewinn vom Kuchenstand könnten wir dann für einen guten Zweck spenden.", "We could then donate the profit from the cake stall to a good cause."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Erlaubnis von der Schule und die Tische.", "I'll take care of the permission from the school and the tables."]]], ["Person A", "Person A", [["Und ich übernehme die Einladungen und den Kuchenstand.", "And I'll do the invitations and the cake stall."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-nachbarkinder", "type": "plan", "title": "Die Kinder des kranken Nachbarn betreuen", "en": "Looking after a sick neighbour's children", "task": "Ihr Nachbar ist krank und muss für eine Woche ins Krankenhaus. Sie wollen sich um seine Kinder kümmern. Planen Sie gemeinsam die Woche.", "task_en": "Your neighbour is ill and has to go to hospital for a week. You want to look after the children. Plan the week together.", "sections": [["Person A", "Person A", [["Hallo! Hast du gehört, dass unser Nachbar krank ist und eine Woche ins Krankenhaus muss?", "Hi! Have you heard that our neighbour is ill and has to go to hospital for a week?"], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir ihm helfen und uns um seine zwei Kinder kümmern.", "In my opinion, we should help him and look after his two children."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Schule angeht, würde ich vorschlagen, dass ich die Kinder morgens hinbringe, weil ich erst später zur Arbeit gehe.", "As for school, I'd suggest that I take the children in the morning, because I go to work later."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was das Mittagessen betrifft, finde ich es wichtig, dass die Kinder etwas Warmes und Gesundes bekommen, denn sie sind den ganzen Vormittag in der Schule.", "As far as lunch is concerned, I think it's important that the children get something warm and healthy, because they're at school all morning."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Hausaufgaben schlage ich vor, dass wir uns abwechseln, damit keiner von uns zu viel Arbeit hat.", "Regarding homework, I suggest we take turns so that neither of us has too much work."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Freizeit angeht, wäre der Spielplatz sinnvoll, weil die Kinder sich dort bewegen und ein bisschen ablenken können.", "As for free time, the playground would make sense, because the children can move around and take their minds off things there."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings vermissen die Kinder bestimmt ihren Vater. Vielleicht besuchen wir ihn zusammen im Krankenhaus?", "However, the children are sure to miss their father. Maybe we could visit him together in hospital?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Das wäre schön, denn ein Besuch würde nicht nur den Kindern, sondern auch ihrem Vater guttun.", "That would be nice, because a visit would do good not only for the children but also for their father."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um das Mittagessen und die Hausaufgaben.", "I'll take care of lunch and homework."]]], ["Person A", "Person A", [["Und ich übernehme den Schulweg am Morgen und den Krankenhausbesuch.", "And I'll do the school run in the morning and the hospital visit."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-geburtstag", "type": "plan", "title": "Geburtstag eines Mitschülers", "en": "A classmate's birthday", "task": "Ein Mitschüler aus Ihrem Kurs hat bald Geburtstag. Sie möchten ihn überraschen. Planen Sie gemeinsam die Feier und das Geschenk.", "task_en": "A classmate from your course has a birthday soon. You want to surprise him. Plan the party and the present together.", "sections": [["Person A", "Person A", [["Hallo! Wusstest du, dass Ahmed aus unserem Kurs nächsten Freitag Geburtstag hat?", "Hi! Did you know that Ahmed from our course has his birthday next Friday?"], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir ihn überraschen, weil er immer so hilfsbereit ist.", "In my opinion, we should surprise him, because he is always so helpful."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Feier angeht, würde ich eine kleine Party im Kursraum nach dem Unterricht vorschlagen, weil dann alle da sind.", "As for the party, I'd suggest a small party in the classroom after the lesson, because then everyone is there."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was das Essen betrifft, finde ich es schön, wenn jeder ein typisches Gericht aus seinem Land mitbringt, denn so lernen wir uns besser kennen.", "As far as food is concerned, I think it's nice if everyone brings a typical dish from their country, because then we get to know each other better."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich des Geschenks schlage ich vor, Geld zu sammeln und einen Gutschein für eine Buchhandlung zu kaufen, damit er sich selbst etwas aussuchen kann.", "Regarding the present, I suggest collecting money and buying a bookshop voucher so that he can choose something himself."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Dekoration angeht, wären Ballons und eine große Karte sinnvoll, weil das wenig kostet und trotzdem schön aussieht.", "As for decorations, balloons and a big card would make sense, because they cost little and still look nice."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings müssen wir zuerst die Lehrerin fragen, ob wir den Raum benutzen dürfen.", "However, we first have to ask the teacher if we can use the room."]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Ich spreche morgen nach dem Unterricht mit ihr, wenn Ahmed schon gegangen ist.", "I'll talk to her tomorrow after class, when Ahmed has already left."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Lehrerin und die Dekoration.", "I'll take care of asking the teacher and the decorations."]]], ["Person A", "Person A", [["Und ich übernehme das Geldsammeln und kaufe den Gutschein.", "And I'll collect the money and buy the voucher."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-gesundheitstag", "type": "plan", "title": "Tag der Gesundheit", "en": "Health day", "task": "Ihre Sprachschule möchte einen Tag der Gesundheit organisieren. Überlegen Sie gemeinsam, welche Aktivitäten und Informationen Sie anbieten können.", "task_en": "Your language school wants to organise a health day. Think together about which activities and information you can offer.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, möchte unsere Sprachschule einen Tag der Gesundheit organisieren, und wir sollen helfen.", "Hi! As you know, our language school wants to organise a health day, and we're supposed to help."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, welche Themen am wichtigsten sind.", "In my opinion, we should first think about which topics are most important."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Themen angeht, würde ich gesunde Ernährung, Bewegung und Stressabbau vorschlagen, weil sie für fast alle Menschen wichtig sind.", "As for the topics, I'd suggest healthy eating, exercise and stress reduction, because they matter to almost everyone."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Vorträge betrifft, finde ich es wichtig, einen Arzt oder eine Ernährungsberaterin einzuladen, denn Experten wirken glaubwürdiger.", "As far as the talks are concerned, I think it's important to invite a doctor or a nutritionist, because experts are more credible."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Aktivitäten schlage ich einen Yogakurs und einen Lauf um den Park vor, damit sich die Teilnehmer auch bewegen.", "Regarding activities, I suggest a yoga class and a run around the park so that the participants also get moving."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was das Essen angeht, wäre ein Buffet mit Obst und Salaten sinnvoll, weil die Besucher so sehen, dass gesundes Essen lecker sein kann.", "As for food, a buffet with fruit and salads would make sense, because visitors see that healthy food can be tasty."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings haben nicht alle Teilnehmer Lust auf Sport. Vielleicht bieten wir auch einen Kochkurs an?", "However, not all participants feel like doing sport. Maybe we could also offer a cooking class?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Ein Kochkurs ist eine tolle Idee, so lernen die Teilnehmer, wie man schnell und gesund kocht.", "A cooking class is a great idea; that way participants learn how to cook quickly and healthily."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um den Arzt und den Yogakurs.", "I'll take care of the doctor and the yoga class."]]], ["Person A", "Person A", [["Und ich übernehme das Buffet und den Kochkurs.", "And I'll do the buffet and the cooking class."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-hochzeit-ueberraschung", "type": "plan", "title": "Die Hochzeitsfeier eines Freundes überraschen", "en": "Surprising a friend at his wedding party", "task": "Ein guter Freund heiratet bald. Sie möchten ihn auf der Hochzeitsfeier überraschen. Überlegen Sie gemeinsam, was Sie machen können.", "task_en": "A good friend is getting married soon. You want to surprise him at his wedding party. Think together about what you can do.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, heiratet unser Freund Karim nächsten Monat, und ich möchte ihn gern überraschen.", "Hi! As you know, our friend Karim is getting married next month, and I'd love to surprise him."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir etwas Persönliches machen, nicht nur ein Geschenk kaufen.", "In my opinion, we should do something personal, not just buy a present."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Überraschung angeht, würde ich ein kurzes Video mit Fotos und Grüßen von Freunden vorschlagen, weil das eine Erinnerung für das ganze Leben ist.", "As for the surprise, I'd suggest a short video with photos and greetings from friends, because it's a memory for life."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Musik betrifft, finde ich es lustig, wenn wir zusammen ein Lied über das Brautpaar singen, denn die Gäste lachen bestimmt.", "As far as music is concerned, I think it'd be fun to sing a song about the couple together, because the guests will surely laugh."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Technik schlage ich vor, vorher mit dem DJ zu sprechen, damit wir das Video ohne Probleme zeigen können.", "Regarding the technology, I suggest talking to the DJ beforehand so that we can show the video without problems."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was das Geschenk angeht, wäre Geld für die Hochzeitsreise sinnvoll, weil sich die beiden darüber am meisten freuen.", "As for the present, money for the honeymoon would make sense, because the two of them would like that most."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings darf Karim nichts davon wissen. Vielleicht gründen wir eine eigene Chatgruppe ohne ihn?", "However, Karim mustn't know anything about it. Maybe we could start our own chat group without him?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["In der Chatgruppe können wir auch die Fotos und Grüße für das Video sammeln.", "In the chat group we can also collect the photos and greetings for the video."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um das Video und die Chatgruppe.
