ir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst ein Buch auswählen, das nicht zu lang und gut verständlich ist.", "In my opinion, we should first choose a book that isn't too long and is easy to understand."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Buch angeht, würde ich „Tschick“ von Wolfgang Herrndorf vorschlagen, weil es spannend, lustig und nicht zu lang ist.", "As for the book, I'd suggest 'Tschick' by Wolfgang Herrndorf, because it's exciting, funny and not too long."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Struktur betrifft, finde ich die Reihenfolge Autor, Inhalt und Meinung logisch, denn so ist es übersichtlich.", "As far as the structure is concerned, I think the order author, content, opinion is logical, because it's clear."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich des Vorlesens schlage ich eine kurze, spannende Stelle vor, damit die Mitschüler Lust auf das Buch bekommen.", "Regarding reading aloud, I suggest a short, exciting passage so that our classmates want to read the book."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was den Film angeht, wäre eine kurze Szene am Ende sinnvoll, weil die Mitschüler das Buch dann besser verstehen.", "As for the film, a short scene at the end would make sense, because classmates then understand the book better."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings verstehen nicht alle Mitschüler jedes Wort. Vielleicht machen wir einen Handzettel mit wichtigen Wörtern?", "However, not all classmates understand every word. Maybe we could make a handout with important words?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Auf dem Handzettel könnten auch ein paar Fragen zum Buch stehen.", "The handout could also include a few questions about the book."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um den Autor und den Handzettel.", "I'll take care of the author and the handout."]]], ["Person A", "Person A", [["Und ich übernehme den Inhalt und das Vorlesen.", "And I'll do the content and the reading."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-theater", "type": "plan", "title": "Ein Theaterstück für einen guten Zweck", "en": "A play for a good cause", "task": "Sie organisieren ein Theaterstück und spenden das eingenommene Geld. Sie helfen bei der Planung. Überlegen Sie gemeinsam, was Sie organisieren können.", "task_en": "You are organising a play and will donate the money raised. You are helping with the planning. Think together about what you can organise.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, wollen wir ein Theaterstück aufführen und das Geld spenden.", "Hi! As you know, we want to put on a play and donate the money."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst entscheiden, für wen wir das Geld sammeln.", "In my opinion, we should first decide who we are collecting the money for."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Spende angeht, würde ich ein Kinderheim in unserer Stadt vorschlagen, weil die Leute dann sehen, dass ihr Geld hier hilft.", "As for the donation, I'd suggest a children's home in our town, because people see that their money helps here."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was den Ort betrifft, finde ich die Aula der Schule ideal, denn sie ist groß und hat eine Bühne.", "As far as the venue is concerned, I think the school hall is ideal, because it's big and has a stage."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Eintrittskarten schlage ich zehn Euro für Erwachsene und fünf Euro für Kinder vor, damit auch Familien kommen können.", "Regarding tickets, I suggest ten euros for adults and five for children so that families can come too."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Pause angeht, wäre ein Verkauf von Getränken und Snacks sinnvoll, weil wir so noch mehr Geld spenden können.", "As for the interval, selling drinks and snacks would make sense, because then we can donate even more money."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings brauchen wir viel Zeit für die Proben. Vielleicht sollten wir sofort mit dem Üben anfangen?", "However, we need a lot of time for rehearsals. Maybe we should start practising right away?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Wir könnten zweimal pro Woche proben, zum Beispiel dienstags und donnerstags am Abend.", "We could rehearse twice a week, for example on Tuesday and Thursday evenings."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Proben und die Kostüme.", "I'll take care of the rehearsals and the costumes."]]], ["Person A", "Person A", [["Und ich übernehme die Aula, die Karten und die Werbung.", "And I'll do the hall, the tickets and the advertising."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-landausstellung", "type": "plan", "title": "Eine Ausstellung über Ihr Land", "en": "An exhibition about your country", "task": "In einem Kulturzentrum in Ihrer Stadt soll eine Ausstellung über Ihr Land stattfinden. Sie helfen bei der Planung. Denken Sie zum Beispiel an Informationsmaterial oder Poster.", "task_en": "An exhibition about your country is taking place at a cultural centre in your town. You are helping with the planning. Think, for example, about information material or posters.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, soll im Kulturzentrum eine Ausstellung über unser Heimatland stattfinden.", "Hi! As you know, there's going to be an exhibition about our home country at the cultural centre."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, was die Besucher über unser Land lernen sollen.", "In my opinion, we should first think about what visitors should learn about our country."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Themen angeht, würde ich Geschichte, Landschaften, Essen und Traditionen vorschlagen, weil die Besucher so ein vollständiges Bild bekommen.", "As for the topics, I'd suggest history, landscapes, food and traditions, because visitors get a complete picture."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Präsentation betrifft, finde ich große Fotos und einen kurzen Film gut, denn Bilder sagen mehr als lange Texte.", "As far as the presentation is concerned, I think large photos and a short film are good, because pictures say more than long texts."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich des Essens schlage ich typische Spezialitäten zum Probieren vor, damit die Besucher unser Land auch schmecken können.", "Regarding food, I suggest typical specialities to try so that visitors can taste our country too."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Musik angeht, wären typische Lieder im Hintergrund sinnvoll, weil das eine gute Atmosphäre schafft.", "As for music, typical songs in the background would make sense, because they create a good atmosphere."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings verstehen nicht alle Besucher unsere Sprache. Vielleicht schreiben wir alle Texte auch auf Deutsch?", "However, not all visitors understand our language. Maybe we could write all the texts in German too?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Ich kann die Texte übersetzen, und du kannst sie noch einmal korrigieren.", "I can translate the texts, and you can check them again."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Fotos, den Film und die Texte.", "I'll take care of the photos, the film and the texts."]]], ["Person A", "Person A", [["Und ich übernehme das Essen und die Poster.", "And I'll do the food and the posters."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-amerika", "type": "plan", "title": "Ein Freund aus Amerika besucht Deutschland", "en": "A friend from America visits Germany", "task": "Ein Freund aus Amerika kommt nach Deutschland, um Urlaub zu machen. Sie möchten ihm helfen. Überlegen Sie gemeinsam, was Sie tun können.", "task_en": "A friend from America is coming to Germany on holiday. You want to help him. Think together about what you can do.", "sections": [["Person A", "Person A", [["Hallo! Unser Freund John kommt nächsten Monat aus Amerika und möchte zwei Wochen Urlaub in Deutschland machen.", "Hi! Our friend John is coming from America next month and wants to spend two weeks on holiday in Germany."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst fragen, was ihn besonders interessiert.", "In my opinion, we should first ask what particularly interests him."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Unterkunft angeht, würde ich vorschlagen, dass John bei mir wohnt, weil ich ein Gästezimmer habe und er so Geld spart.", "As for accommodation, I'd suggest John stays with me, because I have a guest room and he saves money."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Ausflüge betrifft, finde ich Berlin, München und den Rhein interessant, denn so sieht er ganz verschiedene Seiten von Deutschland.", "As far as trips are concerned, I think Berlin, Munich and the Rhine are interesting, because he sees very different sides of Germany."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich des Transports schlage ich ein Deutschlandticket vor, damit er günstig mit Bus und Bahn fahren kann.", "Regarding transport, I suggest a Deutschlandticket so that he can travel cheaply by bus and train."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was das Programm angeht, wäre ein Tag in einem typischen Dorf sinnvoll, weil er nicht nur Großstädte sehen sollte.", "As for the programme, a day in a typical village would make sense, because he shouldn't only see big cities."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings spricht er kein Deutsch. Vielleicht bringen wir ihm vorher ein paar wichtige Wörter bei?", "However, he doesn't speak German. Maybe we could teach him a few important words beforehand?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Ein paar Wörter wie „Danke“, „Bitte“ und „Entschuldigung“ helfen ihm sicher im Alltag.", "A few words like 'Danke', 'Bitte' and 'Entschuldigung' will certainly help him in everyday life."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um das Zimmer und die Fahrkarten.", "I'll take care of the room and the tickets."]]], ["Person A", "Person A", [["Und ich übernehme die Ausflüge und den kleinen Deutschkurs.", "And I'll do the trips and the little German course."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-betriebsausflug", "type": "plan", "title": "Einen Betriebsausflug organisieren", "en": "Organising a company outing", "task": "Organisieren Sie einen Betriebsausflug mit Ihren Kolleginnen und Kollegen. Überlegen Sie, was Sie dazu brauchen: Ziele, Kosten, Transport und Verpflegung.", "task_en": "Organise a company outing with your colleagues. Think about what you need: destinations, costs, transport and catering.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, sollen wir dieses Jahr den Betriebsausflug für unsere Abteilung organisieren.", "Hi! As you know, we're supposed to organise the company outing for our department this year."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst ein Ziel finden, das allen gefällt.", "In my opinion, we should first find a destination that everyone likes."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Ziel angeht, würde ich eine Schifffahrt auf dem See und eine kurze Wanderung vorschlagen, weil das eine schöne Abwechslung zum Büro ist.", "As for the destination, I'd suggest a boat trip on the lake and a short hike, because it's a nice change from the office."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was den Transport betrifft, finde ich einen gemieteten Bus praktisch, denn dann fahren alle zusammen und niemand muss Auto fahren.", "As far as transport is concerned, I think a rented bus is practical, because everyone travels together and nobody has to drive."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Verpflegung schlage ich ein Abendessen in einem Restaurant am See vor, damit wir den Tag gemütlich beenden.", "Regarding catering, I suggest dinner at a restaurant by the lake so that we end the day comfortably."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Kollegen angeht, wäre eine kurze Umfrage sinnvoll, weil wir dann wissen, wer mitkommt.", "As for colleagues, a short survey would make sense, because then we know who's coming."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings dürfen die Kosten nicht zu hoch sein. Vielleicht fragen wir die Firma, ob sie einen Teil bezahlt?", "However, the costs mustn't be too high. Maybe we could ask the company if it would pay part of it?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Wenn die Firma die Hälfte bezahlt, wäre es für alle bezahlbar.", "If the company pays half, it would be affordable for everyone."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um den Bus und die Schifffahrt.", "I'll take care of the bus and the boat trip."]]], ["Person A", "Person A", [["Und ich übernehme das Restaurant und frage nach dem Budget.", "And I'll do the restaurant and ask about the budget."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-multikulti", "type": "plan", "title": "Ein multikulturelles Fest an der Sprachschule", "en": "A multicultural festival at the language school", "task": "Ihre Sprachschule veranstaltet ein großes Fest, das den ganzen Tag dauert. Dieses Jahr soll es ein multikulturelles Fest sein. Planen Sie das Programm und verteilen Sie die Aufgaben.", "task_en": "Your language school is holding a big festival that lasts all day. This year it will be a multicultural festival. Plan the programme and divide up the tasks.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, soll das große Fest unserer Sprachschule dieses Jahr ein multikulturelles Fest werden.", "Hi! As you know, our language school's big festival is going to be a multicultural festival this year."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst ein Programm für den ganzen Tag machen.", "In my opinion, we should first make a programme for the whole day."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Programm angeht, würde ich am Vormittag Stände mit Informationen über jedes Land vorschlagen, weil die Besucher so viele Länder kennenlernen.", "As for the programme, I'd suggest stands with information about each country in the morning, because visitors get to know many countries."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was das Essen betrifft, finde ich es toll, wenn jeder ein typisches Gericht kocht, denn Essen verbindet Menschen.", "As far as food is concerned, I think it's great if everyone cooks a typical dish, because food brings people together."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich des Abends schlage ich ein Konzert mit Musik aus verschiedenen Ländern vor, damit das Fest einen schönen Abschluss hat.", "Regarding the evening, I suggest a concert with music from different countries so that the festival has a nice ending."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was den Nachmittag angeht, wäre ein Tanzkurs mit Tänzen aus aller Welt sinnvoll, weil dann alle zusammen Spaß haben.", "As for the afternoon, a dance class with dances from around the world would make sense, because then everyone has fun together."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings brauchen wir viele Helfer. Vielleicht fragen wir in jedem Kurs nach Freiwilligen?", "However, we need lots of helpers. Maybe we could ask for volunteers in every course?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["In jedem Kurs gibt es bestimmt ein paar Leute, die gern helfen.", "In every course there are surely a few people who'd like to help."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Stände und die Helfer.", "I'll take care of the stands and the helpers."]]], ["Person A", "Person A", [["Und ich übernehme das Essen, den Tanzkurs und das Konzert.", "And I'll do the food, the dance class and the concert."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-daf", "type": "plan", "title": "Eine Veranstaltung „Deutsch als Fremdsprache“", "en": "An event: 'German as a foreign language'", "task": "Ihre Lehrerin organisiert eine Veranstaltung mit dem Titel „Deutsch als Fremdsprache“ und bittet Sie um Hilfe. Überlegen Sie, wie Sie helfen können.", "task_en": "Your teacher is organising an event called 'German as a foreign language' and asks you for help. Think about how you can help.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, organisiert unsere Lehrerin eine Veranstaltung über Deutsch als Fremdsprache und hat uns um Hilfe gebeten.", "Hi! As you know, our teacher is organising an event about German as a foreign language and has asked us for help."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, wer die Besucher sind.", "In my opinion, we should first think about who the visitors are."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Besucher angeht, würde ich vor allem neue Deutschlerner vorschlagen, weil sie von unseren Erfahrungen am meisten profitieren.", "As for visitors, I'd mainly suggest new German learners, because they benefit most from our experiences."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Lerntipps betrifft, finde ich Apps, Podcasts und Tandempartner sehr hilfreich, denn damit kann man jeden Tag kostenlos üben.", "As far as learning tips are concerned, I think apps, podcasts and tandem partners are very helpful, because you can practise every day for free."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Prüfungen schlage ich vor, kurz die B1- und B2-Prüfung zu erklären, damit die Teilnehmer wissen, was sie erwartet.", "Regarding the exams, I suggest briefly explaining the B1 and B2 exams so that participants know what to expect."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was das Material angeht, wäre eine Liste mit kostenlosen Lernangeboten sinnvoll, weil viele Lernende wenig Geld haben.", "As for materials, a list of free learning resources would make sense, because many learners have little money."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings sollte die Veranstaltung nicht zu theoretisch sein. Vielleicht machen wir auch ein kleines Sprachspiel?", "However, the event shouldn't be too theoretical. Maybe we could also do a little language game?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Ein Spiel lockert die Atmosphäre auf, und alle können mitmachen.", "A game relaxes the atmosphere, and everyone can join in."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Lerntipps und das Sprachspiel.", "I'll take care of the learning tips and the language game."]]], ["Person A", "Person A", [["Und ich übernehme die Informationen über die Prüfungen.", "And I'll do the information about the exams."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-weltreise", "type": "plan", "title": "Eine Ausstellung „Weltreise“", "en": "An exhibition: 'Journey around the world'", "task": "Im Rathaus Ihrer Stadt soll eine Ausstellung mit dem Titel „Weltreise“ stattfinden. Sie helfen bei der Planung. Denken Sie zum Beispiel an Informationsmaterial oder Poster.", "task_en": "An exhibition called 'Journey around the world' is taking place at your town hall. You are helping with the planning. Think, for example, about information material or posters.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, soll im Rathaus eine Ausstellung mit dem Titel „Weltreise“ stattfinden, und wir helfen bei der Planung.", "Hi! As you know, there's going to be an exhibition called 'Journey around the world' at the town hall, and we're helping with the planning."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst entscheiden, welche Länder wir zeigen.", "In my opinion, we should first decide which countries to show."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Länder angeht, würde ich zwei Länder aus jedem Kontinent vorschlagen, weil die Ausstellung so übersichtlich bleibt.", "As for the countries, I'd suggest two from each continent, because the exhibition stays clear."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Gestaltung betrifft, finde ich Fotos, Landkarten und typische Gegenstände gut, denn so wird jeder Raum lebendig.", "As far as design is concerned, I think photos, maps and typical objects are good, because every room comes alive."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Besucher schlage ich vor, dass Menschen aus diesen Ländern von ihrer Heimat erzählen, damit die Ausstellung persönlicher wird.", "Regarding visitors, I suggest that people from these countries talk about their homeland so that the exhibition becomes more personal."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Videos angeht, wäre ein kurzer Film in jedem Raum sinnvoll, weil die Besucher so mehr über das Land erfahren.", "As for videos, a short film in each room would make sense, because visitors learn more about the country."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings kommen bestimmt auch viele Kinder. Vielleicht machen wir ein Quiz mit einem kleinen Preis?", "However, lots of children are sure to come too. Maybe we could do a quiz with a small prize?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Als Preis könnten wir zum Beispiel ein Kinderbuch über die Welt verschenken.", "As a prize we could give away a children's book about the world, for example."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Fotos, die Landkarten und das Quiz.", "I'll take care of the photos, the maps and the quiz."]]], ["Person A", "Person A", [["Und ich übernehme die Poster und suche Menschen, die erzählen möchten.", "And I'll do the posters and find people who'd like to tell their stories."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-schreibwettbewerb", "type": "plan", "title": "Einen Schreibwettbewerb organisieren", "en": "Organising a writing competition", "task": "Ihre Sprachschule möchte einen Schreibwettbewerb organisieren. Überlegen Sie gemeinsam, wie der Wettbewerb ablaufen soll.", "task_en": "Your language school wants to organise a writing competition. Think together about how the competition should work.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, möchte unsere Sprachschule einen Schreibwettbewerb organisieren, und wir sollen helfen.", "Hi! As you know, our language school wants to organise a writing competition, and we're supposed to help."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst ein Thema auswählen, zu dem alle etwas schreiben können.", "In my opinion, we should first choose a topic that everyone can write about."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Thema angeht, würde ich „Mein erster Tag in Deutschland“ vorschlagen, weil jeder dazu eine eigene Geschichte hat.", "As for the topic, I'd suggest 'My first day in Germany', because everyone has their own story about it."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Regeln betrifft, finde ich höchstens eine Seite pro Text wichtig, denn so ist es für alle machbar.", "As far as the rules are concerned, I think a maximum of one page per text is important, because it's manageable for everyone."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Jury schlage ich zwei Lehrer und einen Schüler vor, damit die Bewertung fair ist.", "Regarding the jury, I suggest two teachers and one student so that the judging is fair."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was den Abgabetermin angeht, wäre das Ende des Monats sinnvoll, weil alle genug Zeit zum Schreiben brauchen.", "As for the deadline, the end of the month would make sense, because everyone needs enough time to write."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings haben Anfänger weniger Chancen als Fortgeschrittene. Vielleicht machen wir zwei Gruppen nach Niveau?", "However, beginners have less of a chance than advanced learners. Maybe we could have two groups by level?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["So hat jeder eine faire Chance, und es gibt mehr Gewinner.", "That way everyone has a fair chance, and there are more winners."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Regeln und die Jury.", "I'll take care of the rules and the jury."]]], ["Person A", "Person A", [["Und ich übernehme die Preise und die Werbung in den Kursen.", "And I'll do the prizes and the advertising in the courses."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-kursraum", "type": "plan", "title": "Den Kursraum freundlicher machen", "en": "Making the classroom more welcoming", "task": "Ihre Kursleiterin will den Kursraum freundlicher machen und bittet Sie um Hilfe. Überlegen Sie gemeinsam, was Sie tun können. Denken Sie auch an die Kosten und daran, wer helfen könnte.", "task_en": "Your course leader wants to make the classroom more welcoming and asks you for help. Think together about what you can do. Also think about the costs and who could help.", "sections": [["Person A", "Person A", [["Hallo! Unsere Kursleiterin möchte den Kursraum freundlicher machen und hat uns um Hilfe gebeten.", "Hi! Our course leader wants to make the classroom more welcoming and has asked us for help."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, was uns im Moment am meisten stört.", "In my opinion, we should first think about what bothers us most at the moment."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Wände angeht, würde ich eine helle Farbe vorschlagen, weil der Raum dann freundlicher und größer wirkt.", "As for the walls, I'd suggest a light colour, because the room then looks friendlier and bigger."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Dekoration betrifft, finde ich Fotos und Poster aus unseren Heimatländern schön, denn so fühlt sich jeder willkommen.", "As far as decoration is concerned, I think photos and posters from our home countries are nice, because then everyone feels welcome."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Kosten schlage ich vor, dass jeder zwei Euro in eine Kasse gibt, damit wir Farbe und Pflanzen kaufen können.", "Regarding costs, I suggest everyone puts two euros in a kitty so that we can buy paint and plants."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Pflanzen angeht, wäre es schön, wenn jeder eine kleine Pflanze mitbringt, weil Grün den Raum gemütlicher macht.", "As for plants, it would be nice if everyone brings a small plant, because greenery makes the room cosier."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings dürfen wir die Wände vielleicht nicht einfach streichen. Vielleicht fragen wir zuerst die Schulleitung?", "However, we might not be allowed to just paint the walls. Maybe we should ask the school management first?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Vielleicht bezahlt die Schule sogar die Farbe, wenn wir selbst streichen.", "Maybe the school will even pay for the paint if we do the painting ourselves."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Schulleitung und die Farbe.", "I'll take care of the school management and the paint."]]], ["Person A", "Person A", [["Und ich übernehme die Pflanzen, die Poster und die Kasse.", "And I'll do the plants, the posters and the kitty."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-musik", "type": "plan", "title": "Infotag „Lernen mit Musik“", "en": "Info day: 'Learning with music'", "task": "Ihre Sprachschule möchte einen Infotag zum Thema „Lernen mit Musik“ durchführen. Sie helfen bei der Planung. Denken Sie zum Beispiel an Unterrichtsbeispiele.", "task_en": "Your language school wants to hold an info day on 'Learning with music'. You are helping with the planning. Think, for example, about sample lessons.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, möchte unsere Sprachschule einen Infotag zum Thema Lernen mit Musik machen.", "Hi! As you know, our language school wants to hold an info day on learning with music."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst zeigen, warum Musik beim Lernen hilft.", "In my opinion, we should first show why music helps with learning."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was den Vortrag angeht, würde ich vorschlagen zu erklären, warum man sich mit Musik Wörter besser merkt, weil das viele Besucher interessiert.", "As for the talk, I'd suggest explaining why music helps you remember words, because that interests many visitors."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Unterrichtsbeispiele betrifft, finde ich eine kurze Stunde mit Liedern gut, denn die Besucher können dann selbst mitmachen.", "As far as sample lessons are concerned, I think a short lesson with songs is good, because visitors can join in themselves."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Technik schlage ich gute Lautsprecher und einen Beamer für die Liedtexte vor, damit alle gut hören und mitlesen können.", "Regarding the technology, I suggest good speakers and a projector for the lyrics so that everyone can hear and read along."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was das Material angeht, wäre eine Liste mit deutschen Liedern für jedes Niveau sinnvoll, weil die Besucher zu Hause weiterlernen möchten.", "As for materials, a list of German songs for each level would make sense, because visitors want to keep learning at home."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings singen nicht alle gern vor anderen. Vielleicht machen wir auch ein Spiel, bei dem man nur zuhört?", "However, not everyone likes singing in front of others. Maybe we could also do a game where you only listen?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Zum Beispiel könnten die Teilnehmer Lücken in einem Liedtext ergänzen.", "For example, participants could fill in gaps in song lyrics."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um den Vortrag und die Technik.", "I'll take care of the talk and the technology."]]], ["Person A", "Person A", [["Und ich übernehme die Lieder und die Spiele.", "And I'll do the songs and the games."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-meer", "type": "plan", "title": "Eine 3-tägige Reise ans Meer", "en": "A 3-day trip to the sea", "task": "Sie möchten mit einigen Teilnehmern aus Ihrem Sprachkurs eine dreitägige Reise ans Meer machen. Überlegen Sie, was Sie brauchen, und planen Sie den Aufenthalt.", "task_en": "You want to take a three-day trip to the sea with some participants from your language course. Think about what you need and plan the stay.", "sections": [["Person A", "Person A", [["Hallo! Ich möchte gern mit ein paar Leuten aus unserem Sprachkurs eine dreitägige Reise ans Meer machen.", "Hi! I'd love to take a three-day trip to the sea with a few people from our language course."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst ein passendes Ziel und einen Termin finden.", "In my opinion, we should first find a suitable destination and date."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Ziel angeht, würde ich die Ostsee vorschlagen, weil sie nicht so weit weg ist und die Fahrt nicht viel kostet.", "As for the destination, I'd suggest the Baltic Sea, because it's not far and the journey doesn't cost much."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Unterkunft betrifft, finde ich eine Jugendherberge am besten, denn sie ist günstig und man lernt dort andere Leute kennen.", "As far as accommodation is concerned, I think a youth hostel is best, because it's cheap and you meet other people there."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich des Programms schlage ich Schwimmen, Fahrradfahren und abends Grillen vor, damit es abwechslungsreich wird.", "Regarding the programme, I suggest swimming, cycling and a barbecue in the evening so that it's varied."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was den Termin angeht, wäre der Juni sinnvoll, weil das Wetter dann meistens schön ist.", "As for the date, June would make sense, because the weather is usually nice then."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings kann es auch regnen. Vielleicht planen wir für schlechtes Wetter einen Museumsbesuch?", "However, it might also rain. Maybe we could plan a museum visit for bad weather?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Wir sollten auch Regenjacken einpacken, weil das Wetter am Meer schnell wechseln kann.", "We should also pack rain jackets, because the weather by the sea can change quickly."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Jugendherberge und die Zugtickets.", "I'll take care of the youth hostel and the train tickets."]]], ["Person A", "Person A", [["Und ich übernehme das Programm und das Grillen.", "And I'll do the programme and the barbecue."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-kindersport", "type": "plan", "title": "Eine Sportveranstaltung für Kinder", "en": "A sports event for children", "task": "In Ihrer Stadt soll eine Sportveranstaltung für Kinder stattfinden. Sie helfen bei der Planung. Überlegen Sie gemeinsam, was Sie organisieren können.", "task_en": "A sports event for children is taking place in your town. You are helping with the planning. Think together about what you can organise.", "sections": [["Person A", "Person A", [["Hallo! Wie du weißt, soll in unserer Stadt eine Sportveranstaltung für Kinder stattfinden, und wir sollen helfen.", "Hi! As you know, there's going to be a sports event for children in our town, and we're supposed to help."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst überlegen, für welches Alter die Veranstaltung ist.", "In my opinion, we should first think about what age the event is for."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Sportarten angeht, würde ich Fußball, Staffellauf und Seilspringen vorschlagen, weil sie einfach sind und allen Kindern Spaß machen.", "As for the sports, I'd suggest football, relay races and skipping, because they're simple and fun for all children."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die kleinen Kinder betrifft, finde ich einen Hindernisparcours gut, denn dabei können sie klettern und rennen.", "As far as small children are concerned, I think an obstacle course is good, because they can climb and run."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Preise schlage ich vor, jedem Kind eine Medaille zu geben, damit niemand traurig nach Hause geht.", "Regarding prizes, I suggest giving every child a medal so that nobody goes home sad."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Sicherheit angeht, wäre ein Erste-Hilfe-Team vor Ort sinnvoll, weil sich Kinder beim Sport leicht verletzen.", "As for safety, a first-aid team on site would make sense, because children easily get hurt during sport."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings brauchen wir viele Helfer. Vielleicht fragen wir die Eltern und den Sportverein?", "However, we need lots of helpers. Maybe we could ask the parents and the sports club?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Viele Eltern helfen bestimmt gern, wenn sie wissen, dass ihre Kinder mitmachen.", "Many parents will surely be happy to help if they know their children are taking part."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Sportarten und den Sportverein.", "I'll take care of the sports and the sports club."]]], ["Person A", "Person A", [["Und ich übernehme die Medaillen und das Erste-Hilfe-Team.", "And I'll do the medals and the first-aid team."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-kulturzentrum", "type": "plan", "title": "Geld für die Renovierung des Kulturzentrums", "en": "Raising money to renovate the cultural centre", "task": "Ein Kulturzentrum in Ihrer Stadt muss renoviert werden, aber die Stadt hat kein Geld dafür. Überlegen Sie, ob Sie Geld sammeln oder selbst renovieren möchten und wie Sie das machen können.", "task_en": "A cultural centre in your town needs renovating, but the town has no money for it. Think about whether you want to collect money or renovate it yourselves, and how you could do that.", "sections": [["Person A", "Person A", [["Hallo! Hast du gehört, dass unser Kulturzentrum renoviert werden muss, aber die Stadt kein Geld dafür hat?", "Hi! Have you heard that our cultural centre needs renovating, but the town has no money for it?"], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir helfen, weil das Zentrum für viele Menschen sehr wichtig ist.", "In my opinion, we should help, because the centre is very important for many people."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was das Geld angeht, würde ich ein Benefizkonzert mit Musikern aus unserer Stadt vorschlagen, weil viele Menschen das Zentrum unterstützen möchten.", "As for money, I'd suggest a charity concert with local musicians, because many people want to support the centre."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Renovierung betrifft, finde ich es gut, einfache Arbeiten wie Streichen selbst zu machen, denn so sparen wir viel Geld.", "As far as the renovation is concerned, I think it's good to do simple jobs like painting ourselves, because we save a lot of money."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der schwierigen Arbeiten schlage ich vor, eine Firma um einen günstigen Preis zu bitten, damit alles professionell gemacht wird.", "Regarding the difficult work, I suggest asking a company for a good price so that everything is done professionally."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was das Material angeht, wären Spenden von Firmen sinnvoll, zum Beispiel Farbe oder Werkzeug, weil das viele Kosten spart.", "As for materials, donations from companies would make sense, for example paint or tools, because that saves a lot of costs."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings brauchen wir viele Freiwillige. Vielleicht schreiben wir einen Artikel in der Lokalzeitung?", "However, we need lots of volunteers. Maybe we could write an article in the local newspaper?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["In dem Artikel können wir erklären, warum das Zentrum für unsere Stadt so wichtig ist.", "In the article we can explain why the centre is so important for our town."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um das Konzert und die Spendenaktion.", "I'll take care of the concert and the fundraiser."]]], ["Person A", "Person A", [["Und ich übernehme die Freiwilligen und den Artikel.", "And I'll do the volunteers and the article."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-ausland", "type": "plan", "title": "Einem Freund helfen, sich im Ausland einzuleben", "en": "Helping a friend settle in abroad", "task": "Ihr Freund hat ein Stellenangebot im Ausland bekommen, in einem Land, in dem Sie eine Weile gelebt haben. Überlegen Sie gemeinsam, welche Tipps Sie ihm geben können.", "task_en": "Your friend has received a job offer abroad, in a country where you have lived for a while. Think together about what tips you can give him.", "sections": [["Person A", "Person A", [["Hallo! Unser Freund Jan hat ein Stellenangebot in der Türkei bekommen, und wir haben ja lange dort gelebt.", "Hi! Our friend Jan has received a job offer in Turkey, and we lived there for a long time, after all."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir ihm helfen, damit er sich schnell einlebt.", "In my opinion, we should help him so that he settles in quickly."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Wohnung angeht, würde ich zuerst ein möbliertes Zimmer vorschlagen, weil Jan dann in Ruhe eine gute Wohnung suchen kann.", "As for housing, I'd first suggest a furnished room, because Jan can then calmly look for a good flat."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was die Sprache betrifft, finde ich einen Sprachkurs vor der Reise wichtig, denn im Alltag kommt man mit Englisch nicht immer weiter.", "As far as the language is concerned, I think a course before the trip is important, because English doesn't always get you by in daily life."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Kultur schlage ich vor, ihm die wichtigsten Regeln und Feiertage zu erklären, damit es keine Missverständnisse gibt.", "Regarding culture, I suggest explaining the most important rules and holidays to him so that there are no misunderstandings."]]], ["Person B", "Person B", [["Das ist eine gute Idee.", "That's a good idea."], ["Was die Stadtteile angeht, wäre es sinnvoll, ihm die schönen und sicheren zu zeigen, weil er die Stadt noch nicht kennt.", "As for districts, it would make sense to show him the nice and safe ones, because he doesn't know the city yet."]]], ["Person A", "Person A", [["Das ist ein guter Vorschlag.", "That's a good suggestion."], ["Allerdings fühlt man sich am Anfang oft allein. Vielleicht stellen wir ihm unsere Freunde dort vor?", "However, at the beginning you often feel alone. Maybe we could introduce him to our friends there?"]]], ["Person B", "Person B", [["Du hast recht, daran sollten wir unbedingt denken.", "You're right, we should definitely think about that."], ["Unsere Freunde können ihm auch bei Behördengängen helfen.", "Our friends can also help him with dealing with the authorities."], ["Lass uns jetzt die Aufgaben verteilen.", "Let's divide up the tasks now."], ["Ich kümmere mich um die Wohnungssuche und die Kontakte.", "I'll take care of the flat search and the contacts."]]], ["Person A", "Person A", [["Und ich übernehme die Tipps zur Sprache und zur Kultur.", "And I'll do the tips about language and culture."], ["Dann haben wir alles besprochen.", "Then we've discussed everything."]]], ["Person B", "Person B", [["Perfekt! Wann treffen wir uns, um alles noch einmal zu besprechen?", "Perfect! When shall we meet to go over everything again?"], ["Passt dir Samstag um 12 Uhr?", "Does Saturday at 12 suit you?"]]], ["Person A", "Person A", [["Ja, das passt mir gut.", "Yes, that suits me well."], ["Bis Samstag!", "See you on Saturday!"]]]]}, {"id": "pl-studentengruppe", "type": "plan", "title": "Ein Programm für eine Studentengruppe", "en": "A programme for a group of students", "task": "Ihr Chef hat Ihnen mitgeteilt, dass Sie nächste Woche eine Gruppe Studenten betreuen, die Ihre Stadt besichtigen möchten. Planen Sie gemeinsam ein gutes Programm.", "task_en": "Your boss has told you that next week you will look after a group of students who want to visit your town. Plan a good programme together.", "s rse, you want to organise a weekend reunion. Create a programme and think about accommodation and how to inform everyone.", "sections": [["Person A", "Person A", [["Hallo! Unser Sprachkurs ist jetzt ein Jahr vorbei, und ich möchte gern ein Kurstreffen für ein Wochenende organisieren.", "Hi! Our language course ended a year ago, and I'd love to organise a weekend reunion."], ["Ich habe mir schon ein paar Gedanken gemacht, aber allein schaffe ich das nicht.", "I've already given it some thought, but I can't manage it alone."], ["Was hältst du davon, wenn wir das zusammen planen?", "What do you think about planning it together?"]]], ["Person B", "Person B", [["Gute Idee, ich bin dabei!", "Good idea, I'm in!"], ["Meiner Meinung nach sollten wir zuerst alle Kursteilnehmer finden und informieren.", "In my opinion, we should first find and inform all the course participants."], ["Lass uns Punkt für Punkt vorgehen, damit wir nichts vergessen.", "Let's go point by point so that we don't forget anything."]]], ["Person A", "Person A", [["Einverstanden.", "Agreed."], ["Was die Information angeht, würde ich eine Chatgruppe und eine E-Mail an alle vorschlagen, weil wir so fast alle erreichen.", "As for informing people, I'd suggest a chat group and an email to everyone, because that way we reach almost everyone."], ["Was meinst du dazu?", "What do you say to that?"]]], ["Person B", "Person B", [["Das finde ich gut, und ich möchte noch etwas ergänzen.", "I think that's good, and I'd like to add something."], ["Was das Programm betrifft, finde ich einen Besuch in der Sprachschule und eine Stadtführung schön, denn so erinnern wir uns an alte Zeiten.", "As far as the programme is concerned, I think a visit to the language school and a city tour are nice, because we'll remember old times."], ["Wie findest du das?", "What do you think of that?"]]], ["Person A", "Person A", [["Da stimme ich dir zu.", "I agree with you."], ["Bezüglich der Übernachtung schlage ich ein günstiges Hotel in d const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WORD_RE = /[A-Za-zÄÖÜäöüß]+(?:-[A-Za-zÄÖÜäöüß]+)*/g;
const isQ = s => s.trim().endsWith("?");

function lookup(word){
  const w = word.toLowerCase();
  if (DICT[w]) return DICT[w];
  for (const suf of ["en","em","er","es","e","n","s"]) {
    if (w.endsWith(suf) && DICT[w.slice(0,-suf.length)]) return DICT[w.slice(0,-suf.length)];
  }
  for (const add of ["e","en","n"]) { if (DICT[w+add]) return DICT[w+add]; }
  return null;
}

// Wrap words in spans; keep char offsets for speech highlighting
function kwRanges(text){
  const r = [], re = /Meiner Meinung nach|Bezüglich|\b(?:betrifft|angeht)\b/g; let m;
  while ((m = re.exec(text))) r.push([m.index, m.index + m[0].length]);
  if (/^Was\b/.test(text) && /\b(betrifft|angeht)\b/.test(text)) r.push([0, 3]);
  return r;
}
function wrap(text, ctx){
  const kr = kwRanges(text);
  let out = "", last = 0, m; WORD_RE.lastIndex = 0;
  while ((m = WORD_RE.exec(text))) {
    out += esc(text.slice(last, m.index));
    out += `<span class="w${kr.some(([a,b])=>m.index>=a&&m.index<b)?' kw':''}" data-s="${m.index}" data-e="${m.index+m[0].length}" data-ctx="${ctx}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function ctxSentence(ctx){
  const p = ctx.split("|");
  if (p[0]==="rm") return REDEMITTEL[+p[1]][1];

  if (p[1]==="t") return t.en;
  if (p[1]==="task") return t.task_en;

}

function loadVoices(){
  if (window.TIMINGS) {

function score(v){ let s=0; if(/natural|neural/i.test(v.name)) s+=10; if(/online/i.test(v.name)) s+=5; if(/de-DE/i.test(v.lang)) s+=3; if(/katja|amala|seraphina|conrad|killian|florian/i.test(v.name)) s+=2; if(/google/i.test(v.name)) s+=1; return s; }

function speak(text, {onWord, onEnd, r} = {}){
  if (!("speechSynthesis" in window)) { onEnd && setTimeout(onEnd, 1500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE"; if (voice) u.voice = voice; u.rate = r || rate;
  if (onWord) u.onboundary = e => { if (e.name === "word" || e.name === undefined) onWord(e.charIndex); };
  u.onend = () => onEnd && onEnd();
  u.onerror = () => onEnd && onEnd();
  speechSynthesis.speak(u);
}
function voiceFor(ti, si){ const t = TOPICS[ti]; if (t.type==="plan") return t.sections[si][0]==="Person A" ? "florian" : "seraphina"; if (t.type==="blocks") return "seraphina"; return null; }
function sayOne(si,k){
  const de = TOPICS[cur].sections[si][2][k][0];
  const spans = [...document.querySelectorAll(`#s-${si}-${k} .w`)];
  say(TOPICS[cur].id+"/"+si+"_"+k, de, { voice: voiceFor(cur,si),
    onWord: i => spans.forEach(s => s.classList.toggle("speaking", +s.dataset.s <= i && i < +s.dataset.e)),
    onEnd: () => spans.forEach(s => s.classList.remove("speaking")) });
}


/* ===================== RECORDED NATURAL AUDIO ===================== */
const REC = window.TIMINGS || null;              // created by tools/make_audio.py
const REC_VOICES = REC ? Object.keys(REC) : [];
let recVoice = REC_VOICES[0] || null, curAudio = null, rafId = 0;
const hasRec = k => !!(recVoice && REC[recVoice] && REC[recVoice][k]);
function stopAll(){
  if (curAudio){ curAudio.onended = null; curAudio.pause(); curAudio = null; }
  cancelAnimationFrame(rafId);
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
// say(): plays the recorded MP3 if it exists, otherwise falls back to the browser voice
function say(k, text, {onWord, onEnd, voice} = {}){
  stopAll();
  const v = (voice && REC && REC[voice] && REC[voice][k]) ? voice : recVoice;
  if (!(v && REC && REC[v] && REC[v][k])) { speak(text, {onWord, onEnd}); return; }
  const tm = REC[v][k];
  const a = new Audio("audio/" + v + "/" + k + ".mp3");
  a.playbackRate = rate; a.preservesPitch = true; curAudio = a;
  let done = false;
  const fin = () => { if (done) return; done = true; cancelAnimationFrame(rafId); if (curAudio === a) curAudio = null; onEnd && onEnd(); };
  a.onended = fin;
  a.onerror = () => { if (curAudio === a) curAudio = null; speak(text, {onWord, onEnd}); };
  const tick = () => {
    if (onWord && tm.length) {
      const ms = a.currentTime * 1000; let idx = -1;
      for (const [c, t] of tm) { if (t <= ms + 60) idx = c; else break; }
      if (idx >= 0) onWord(idx);
    }
    if (!a.paused) rafId = requestAnimationFrame(tick);
  };
  a.onplay = () => { rafId = requestAnimationFrame(tick); };
  a.play().catch(() => { a.onerror(); });
}

/* ===================== VIDEO PLAYER ===================== */
const MODES = { lesson:"Lektion", shadow:"Nachsprechen", exam:"Prüfung" };
const P = {
  t:0, mode:"lesson", items:[], i:0, playing:false, timer:null, en:true, token:0,
  build(){
    this.items = [];
    const T = TOPICS[this.t], plan = T.type==="plan";
    T.sections.forEach(([h,hen,s],si)=>{
      if (this.mode === "exam" && T.type!=="blocks" && (!plan || h==="Person B"))
        this.items.push(plan ? {si, kind:"prompt", h, de:"Du bist Person B. Bitte antworte jetzt.", en:"Tipp: " + s.map(x=>x[1]).join(" ")}
                             : {si, kind:"prompt", h, de:h, en:hen});
      s.forEach(([de,en],k)=> this.items.push({si, k, h, de, en}));
    });
  },
  open(t, mode, startSec){
    this.t=t; this.mode=mode; this.build();
    this.i = startSec!=null ? this.items.findIndex(x=>x.si===startSec) : 0;
    $("#player").classList.add("open"); hidePop();
    $("#modeBtn").textContent = "Modus: " + (mode==="exam" && TOPICS[t].type==="plan" ? "Rollenspiel" : MODES[mode]);
    this.show(); this.play();
  },
  close(){ this.stop(); $("#player").classList.remove("open"); },
  show(){
    const it = this.items[this.i], T = TOPICS[this.t];
    $("#stTopic").textContent = T.title;
    const N = T.sections.length;
    $("#stCount").textContent = T.type==="plan" ? `Zug ${it.si+1} / ${N}` : T.type==="blocks" ? `Baustein ${it.si+1} / ${N}` : `Punkt ${it.si+1} / ${N}`;
    const head = $("#stHead"); head.textContent = T.type ? it.h : `${it.si+1}. ${it.h}`;
    const tx = $("#stText"), en = $("#stEn");
    if (it.kind === "prompt") {
      tx.innerHTML = T.type==="plan" ? `<span style="opacity:.85">Du bist dran!</span><br>Antworte als Person B.`
        : `<span style="opacity:.85">Du bist dran! Sprich frei über:</span><br>„${wrap(it.h, this.t+"|"+it.si+"|h")}“`;
      en.textContent = it.en;
    } else {
      tx.innerHTML = wrap(it.de, this.t+"|"+it.si+"|"+it.k);
      en.textContent = it.en;
    }
    en.classList.toggle("hide", !this.en);
    [head,tx].forEach(el=>{ el.style.animation="none"; el.offsetHeight; el.style.animation=""; });
    $("#progBar").style.width = ((this.i+1)/this.items.length*100) + "%";
    $("#stTimer").classList.remove("show");
    $("#avLabel").textContent = T.type==="plan" ? (it.kind==="prompt" ? "Prüferin" : it.h==="Person A" ? "Person A (Partner)" : "Person B (du)")
      : it.kind==="prompt" ? "Prüferin" : (isQ(it.de) ? "Frage an den Partner" : "Sprecherin");
  },
  play(){ this.playing=true; $("#playBtn").textContent="⏸ Pause"; this.run(); },
  pause(){ this.playing=false; this.token++; $("#playBtn").textContent="▶ Abspielen"; stopAll(); clearInterval(this.timer); $("#stage").classList.remove("talking"); $("#stTimer").classList.remove("show"); },
  stop(){ this.pause(); },
  toggle(){ this.playing ? this.pause() : this.play(); },
  run(){
    const tok = ++this.token, it = this.items[this.i], stage = $("#stage");
    const spans = [...$("#stText").querySelectorAll(".w")];
    const after = () => { if (tok!==this.token) return; stage.classList.remove("talking"); this.afterItem(tok); };
    if (it.kind === "prompt") {
      stage.classList.add("talking");
      const plan = TOPICS[this.t].type==="plan";
      say(TOPICS[this.t].id+"/"+it.si+"_p", plan ? it.de : `Punkt ${it.si+1}: ${it.h}. Bitte sprich jetzt.`, { onEnd: ()=>{ if(tok!==this.token) return; stage.classList.remove("talking"); this.countdown(tok, plan ? 25 : 45, "Sprich jetzt", ()=>this.advance(tok)); } });
      return;
    }
    stage.classList.add("talking");
    say(TOPICS[this.t].id+"/"+it.si+"_"+it.k, it.de, { voice: voiceFor(this.t, it.si),
      onWord: i => spans.forEach(s => s.classList.toggle("speaking", +s.dataset.s <= i && i < +s.dataset.e)),
      onEnd: () => { spans.forEach(s=>s.classList.remove("speaking")); after(); }
    });
  },
  afterItem(tok){
    if (this.mode === "shadow") {
      const words = this.items[this.i].de.split(/\s+/).length;
      this.countdown(tok, Math.ceil(words*0.55/rate)+2, "Jetzt du – nachsprechen", ()=>this.advance(tok));
    } else setTimeout(()=>this.advance(tok), 600);
  },
  countdown(tok, n, label, cb){
    const box = $("#stTimer"); $("#stTimerLabel").textContent = label; $("#stTimerNum").textContent = n; box.classList.add("show");
    clearInterval(this.timer);
    this.timer = setInterval(()=>{
      if (tok!==this.token) { clearInterval(this.timer); return; }
      n--; $("#stTimerNum").textContent = n;
      if (n<=0) { clearInterval(this.timer); box.classList.remove("show"); cb(); }
    },1000);
  },
  advance(tok){
    if (tok!==this.token) return;
    if (this.i < this.items.length-1) { this.i++; this.show(); this.run(); }
    else { this.pause(); $("#stHead").textContent="Super gemacht! 🎉"; $("#stText").textContent="Thema abgeschlossen."; $("#stEn").textContent="Topic complete – well done!"; }
  },
  next(){ const was=this.playing; this.pause(); if(this.i<this.items.length-1) this.i++; this.show(); if(was) this.play(); },
  prev(){ const was=this.playing; this.pause(); if(this.i>0) this.i--; this.show(); if(was) this.play(); },
  cycleMode(){ const ks=Object.keys(MODES); const si=this.items[this.i].si; this.mode=ks[(ks.indexOf(this.mode)+1)%ks.length]; $("#modeBtn").textContent="Modus: "+MODES[this.mode]; const was=this.playing; this.pause(); this.build(); this.i=this.items.findIndex(x=>x.si===si); this.show(); if(was) this.play(); },
  cycleRate(){ const rs=[0.85,1.0,1.1]; rate=rs[(rs.indexOf(rate)+1)%rs.length]; $("#rateBtn").textContent=`Tempo ${rate}×`; if(curAudio) curAudio.playbackRate=rate; },
  toggleEn(){ this.en=!this.en; $("#enBtn").classList.toggle("on",this.en); $("#stEn").classList.toggle("hide",!this.en); },
  setVoice(i){ if (window.TIMINGS) { recVoice = i; renderBanner(); return; } voice = voices[+i]; loadVoices(); }
};
document.addEventListener("keydown", e=>{
  if (!$("#player").classList.contains("open")) return;
  if (e.key===" ") { e.preventDefault(); P.toggle(); }
  if (e.key==="ArrowRight") P.next();
  if (e.key==="ArrowLeft") P.prev();
  if (e.key==="Escape") P.close();
});

(function(){ const h = decodeURIComponent((location.hash||"").slice(1)); const i = TOPICS.findIndex(t=>t.id===h); go(i>=0 ? i : 0); })();
</script>
